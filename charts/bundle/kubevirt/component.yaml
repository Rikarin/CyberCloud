# Bundle component — charts/bundle/README.md § What a component owes.
#
# ⚠ NO CHART IN charts/managed/ RENDERS A `kubevirt.io` OBJECT, AND THIS COMPONENT IS STILL REQUIRED.
# The requirement is transitive: cluster-api-provider-kubevirt reconciles a Cluster API `Machine`
# into a `kubevirt.io/v1` VirtualMachine, and its own RBAC in `infrastructure-components.yaml` names
# the `kubevirt.io` and `cdi.kubevirt.io` API groups. A `requiredBy:` that named only charts is a
# `requiredBy:` that would have missed this component entirely, which is why the key takes components
# as well as charts.

component: kubevirt
phase: 30
licence: Apache-2.0
licenceEvidence: https://raw.githubusercontent.com/kubevirt/kubevirt/v1.9.0/LICENSE
install: manifest
release: v1.9.0

# Two documents, in this order: the operator, then the `KubeVirt` custom resource that tells the
# operator to deploy the handler and the API. Installing the first alone leaves a cluster with the
# definitions and no virtualisation.
manifest: https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-operator.yaml
manifestExtra: https://github.com/kubevirt/kubevirt/releases/download/v1.9.0/kubevirt-cr.yaml

source: https://api.github.com/repos/kubevirt/kubevirt/releases/latest
checked: 2026-08-19

# Read off kubevirt-operator.yaml. The definition also serves the deprecated `kubevirt.io/v1alpha3`;
# only the version this platform's dependants use is claimed.
serves:
  - kubevirt.io/v1

requiredBy:
  - charts/bundle/cluster-api-provider-kubevirt

# ⚠ KUBEVIRT REQUIRES CDI, AND NOT THE OTHER WAY ROUND — FOUND BY THE PER-COMPONENT BARRIER ON
# 2026-09-15. v1.9.0's `virt-template-controller` fails at start with "no matches for kind
# DataVolume in version cdi.kubevirt.io/v1beta1" and the `KubeVirt` resource stays `Deploying`
# forever; with CDI's definitions present it starts and the resource reaches `Deployed`. The
# first real run had kubevirt first in phase 30 and went green only because nothing waited between
# the two applies. Read by the Bundle gate, which checks containerized-data-importer's roster row
# comes first.
requires:
  - charts/bundle/containerized-data-importer

# What "installed" means for this component, read by install.sh after the apply: one `kubectl wait`
# argument list per entry, the timeout supplied by the script. ⚠ THE `KubeVirt` RESOURCE'S PHASE AND
# NOT `virt-operator`'S DEPLOYMENT, measured on 2026-09-15 on the first run with a kubelet:
# `virt-operator` is 2/2 Available at 42 s and then renders virt-api, virt-controller,
# virt-exportproxy, two template components and the `virt-handler` DaemonSet; the condition a later
# phase can rely on is `status.phase == Deployed` (with `Available=True`), reached about seven
# minutes after apply on a cold image cache.
waitFor:
  - "kubevirt/kubevirt -n kubevirt --for=jsonpath={.status.phase}=Deployed"

# Every container image this component's pinned artefact renders, with the digest its registry served
# on 2026-09-03. Regenerate with `./charts/bundle/images.sh --resolve`; check with `images.sh`.
#
# ⚠ THIS IS A RECORD, NOT A PIN, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. The tag is what the
# chart passes to the kubelet; the digest beside it is what that tag resolved to when somebody looked.
# A tag is mutable, so an upstream rebuild moves these bytes without moving any version in this
# directory — and `images.sh` is what turns that from invisible into a red run.
images:
  - quay.io/kubevirt/virt-operator:v1.9.0@sha256:d08b5b5ad1c0d694fad13279e44b44b6fad961aa7508acd53b87ce6ef468cbae

notes: >
  ⚠ Nested virtualisation. KubeVirt runs guests under KVM, and a node with no `/dev/kvm` schedules
  NO guest at all: every launcher pod requests `devices.kubevirt.io/kvm`, and the scheduler answers
  "Insufficient devices.kubevirt.io/kvm". ⚠ THIS PARAGRAPH SAID "falls back to software emulation"
  UNTIL 2026-09-17 AND THAT IS ONLY TRUE WITH `developerConfiguration.useEmulation: true` IN THE
  KubeVirt RESOURCE, which this bundle does not set. Emulation would be slow enough that a Cluster
  API Machine could time out before its guest finishes booting, which is why it is not switched on
  for a lane's convenience. Either way it is a property of the host fleet rather than of this pin,
  and it is the first thing to check when charts/managed/kubernetes-agentpool creates Machines that
  never become Ready.
  ⚠ INSTALLED ON 2026-09-15 THROUGH install.sh AGAINST A `rancher/k3s:v1.35.7-k3s1` WITH A KUBELET,
  AND TWO THINGS ABOUT THAT NODE HAD TO BE TRUE FIRST. (1) `/var/run` must be a SHARED mount:
  `virt-handler` refuses a node where it is not — `path "/var/run/kubevirt" is mounted on "/var/run"
  but it is not a shared mount` — and every k3s-in-Docker in this repository was started with
  `--tmpfs /var/run`, which is private. `mount --make-rshared /var/run` inside the container before
  k3s starts is the fix, and it is now the container's own entrypoint in all three recipes
  (CyberCloudTopology.cs, K3sFixture, ClusterInfrastructure) so the AppHost can host this component
  at all; a real node has no such problem. (2) containerized-data-importer must be `Deployed` FIRST —
  see `requires:` above. With both, the `KubeVirt` resource reached `Deployed` 1 m 40 s after apply
  on a warm cache, `virt-handler` and all nine of the operator's workloads Running.
  ✅ A VirtualMachine HAS RUN HERE, since 2026-09-17: test/CyberCloud.Bundle.Cluster.Nightly
  § KubeVirtOnAnEmptyCluster applies charts/managed/virtual-machine against this component and the
  guest reports Running under KVM. The sentence this paragraph carried — "Docker Desktop's VM
  exposes no /dev/kvm to a container" — was true of an unprivileged container and false of the
  privileged k3s one, because WSL2 nests virtualization; the device plugin advertises
  `devices.kubevirt.io/kvm` on the node. WHAT THAT STILL DOES NOT PROVE: charts/managed/kubernetes'
  Machines — the reason this component exists — need the phase-40 rows under test and a guest that
  joins a cluster, which are the VM lane's. bundle.yaml § owed, `virtual-machines-need-a-node-with-kvm`.
