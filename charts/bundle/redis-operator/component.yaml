# Bundle component — charts/bundle/README.md § What a component owes.
#
# ⚠ THE WORST ROW IN THIS DIRECTORY, AND EVERY SENTENCE BELOW WAS READ OFF A REGISTRY OR AN API
# RATHER THAN OFF DOCUMENTATION. Read bundle.yaml § owed, `redis-operator-is-archived-and-its-chart-
# is-broken`, before changing anything here.
#
#   * github.com/spotahome/redis-operator reports `archived: true`. Last push 2024-07-01.
#   * Its newest chart release is `Chart-3.3.0`, published 2023-08-17.
#   * Its newest OPERATOR tag is `v1.3.0-rc1`, published 2023-08-21, `prerelease: true`. The last
#     non-prerelease is `v1.2.4`, 2022-12-28.
#   * Chart 3.3.0's values.yaml pins `image.tag: v1.3.0` against `quay.io/spotahome/redis-operator`,
#     and the Quay tag listing for that repository has no `v1.3.0` in it — the newest tag is
#     `v1.3.0-rc1`. SO THE CHART'S DEFAULT VALUES PRODUCE A DEPLOYMENT THAT CANNOT PULL, and the
#     project cannot fix it because it is read-only.
#   * ⚠ AND CHART 3.3.0 IS UNINSTALLABLE AS PUBLISHED, WHICH NO READING FOUND AND THE FIRST REAL RUN
#     DID (issue #2, 2026-09-15). Its `crds/databases.spotahome.com_redisfailovers.yaml` carries Go
#     templating — `{{- with .Values.crds.annotations }}` — and helm never templates `crds/`, so
#     `helm install` refuses the chart before it renders anything: `error converting YAML to JSON:
#     line 4: did not find expected node content`. The last chart of the 3.2 line, 3.2.9
#     (2023-08-11), was diffed against 3.3.0 rather than assumed: the templates/ directories are
#     IDENTICAL, values.yaml differs only in the default tag (v1.2.4 against the non-existent v1.3.0)
#     and the `crds.annotations` key whose templating is the defect, and the CRD itself is the same
#     document once those three lines are removed. So 3.2.9 with the override below renders BYTE
#     FOR BYTE what 3.3.0 would have, and installs.
#
# This is the defect class Task #109 names: "a version pin that was 'verified' and points at a tag
# that does not exist". Here the broken pin is upstream's, and this component overrides it — and
# the chart pin is the one release of the chart that helm can read.

component: redis-operator
phase: 50
licence: Apache-2.0
licenceEvidence: https://raw.githubusercontent.com/spotahome/redis-operator/v1.3.0-rc1/LICENSE
install: helm
repo: https://spotahome.github.io/redis-operator
chart: redis-operator
version: 3.2.9
appVersion: 1.3.0-rc1

source: https://spotahome.github.io/redis-operator/index.yaml
checked: 2026-09-15

serves:
  - databases.spotahome.com/v1

requiredBy:
  - charts/managed/valkey

# ⚠ A TAG AND NOT A DIGEST, BECAUSE THE CHART HAS NO DIGEST KEY. templates/deployment.yaml composes
# the reference as `"{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion
# }}"` and nothing else, so `image.digest` would be a values key that silently does nothing — which
# is worse than a tag, because it reads as a stronger pin than it is.
#
# ⚠ THIS FILE USED TO CARRY AN `imageDigest:` KEY WHOSE OWN COMMENT SAID IT WAS "recorded so that
# `install.sh --verify` can compare what it pulled against what was reviewed". NOTHING READ IT.
# `verify_component` reads install, repo, chart, version, archive, manifest and manifestExtra, and
# has never read a digest — so the sentence described a check that did not exist, which is the failure
# class this repository has shipped roughly a dozen times. The key is gone and the digest is in the
# `images:` block below, which `charts/bundle/images.sh` re-resolves and compares. Re-read on
# 2026-09-03 through the OCI distribution API rather than quay's own: same digest, and the chart's
# DEFAULT tag `v1.3.0` still answers 404.
# ⚠ THE TAG THIS RUNS, AND `appVersion:` ABOVE NAMES IT RATHER THAN THE CHART'S OWN `1.2.4`. The chart
# pin is 3.2.9 for the
# reason the header gives (its crds/ is plain YAML); the operator it runs is still the newest one,
# v1.3.0-rc1, because the templates are identical to 3.3.0's and the image is the one reviewed and
# recorded below — so `appVersion:` says what runs, which is what `licenceEvidence:` has to name and
# what the Bundle gate holds that URL to; every other component's chart and operator agree, so
# there the two readings coincide.
values:
  image.tag: "v1.3.0-rc1"

# Every container image this component's pinned artefact renders, with the digest its registry served
# on 2026-09-03. Regenerate with `./charts/bundle/images.sh --resolve`; check with `images.sh`.
#
# ⚠ THIS IS A RECORD, NOT A PIN, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. The tag is what the
# chart passes to the kubelet; the digest beside it is what that tag resolved to when somebody looked.
# A tag is mutable, so an upstream rebuild moves these bytes without moving any version in this
# directory — and `images.sh` is what turns that from invisible into a red run.
images:
  - quay.io/spotahome/redis-operator:v1.3.0-rc1@sha256:8c772955184e60ee3116428540ec21abe7b648f4d5a5d74ecf3f19aec52b7e49

notes: >
  ⚠ ADR-011 IS SATISFIED AND IT IS SATISFIED BY THE CHART, NOT BY THIS COMPONENT. The licence
  question is about the ENGINE, and this operator's `defaultImage` is `redis:6.2.6-alpine` — the
  licence ADR-011 rejected. charts/managed/valkey/values.yaml already refuses to inherit it: its
  `imageName` row's `@internal` reason says "Leaving it empty must NOT mean 'let the operator
  choose' … so the empty case renders a Valkey tag rather than nothing". Installing this operator
  does not put Redis on the cluster; rendering a RedisFailover without an image would.
  ⚠ The operator's own licence is Apache-2.0, which is why this is a hazard to record rather than an
  ADR-011 refusal. A refusal would be the right answer to an SSPL or BUSL operator and is the wrong
  answer to an unmaintained one — the cost here is unpatched CVEs, which is a decision for whoever
  owns CyberCloud.Cache/redis and not a decision a bundle can make.
  ⚠ INSTALLED ON 2026-09-15 THROUGH install.sh AGAINST A `rancher/k3s:v1.35.7-k3s1` WITH A KUBELET,
  the first time this component has installed at all: chart 3.3.0 was refused by helm on the first
  real run of the roster the same day, and this pin is the answer. `redis-operator-system/redis-operator`
  1/1, definition `redisfailovers.databases.spotahome.com` Established, `databases.spotahome.com/v1`
  served.
