  - id: licence-scan-is-a-declaration-not-a-scan
    says: >
      ADR-011 § Enforcement asks for "a build gate [that] runs a licence scan over the chart set and
      the container images in the platform bundle". The Bundle gate checks a DECLARED SPDX id per
      component against an allow-list. That catches a component added under SSPL or BUSL by somebody
      who wrote the licence down honestly, and catches nothing else — it does not read a LICENSE file
      and does not open an image. build/Build.Licence.cs is still `NotImplementedYet`, and the
      distance between what it will do and what this gate does is the distance between a scan and an
      attestation.
      ⚠ AND ON 2026-09-03 THE ROW GREW A SECOND HALF THAT IS BIGGER THAN THE FIRST: THE SCAN AS
      ADR-011 WORDS IT CANNOT BE GREEN AGAINST THE ONLY ALLOW-LIST THIS REPOSITORY HAS. Measured
      against `mcr.microsoft.com/dotnet/aspnet:10.0`, which is the base image Build.Images publishes
      every platform host onto: /usr/share/doc holds 99 packaged components and 76 of them declare
      GPL or LGPL in their Debian copyright file — coreutils is `License: GPL-3+`. So a scan over
      image CONTENTS that failed on anything outside `BundleLicenceAllowList` would fail on our own
      runtime image before it reached a single bundle component.
      ⚠ THE FAULT IS ONE LIST BEING ASKED TWO QUESTIONS, NOT THE LIST AND NOT THE ADR. The list
      answers "may this platform OFFER this as a managed service", which is what SSPL and BUSL exist
      to prevent. A scan over layers answers "what is linked into this artefact", where GPL and LGPL
      are the ordinary state of every Linux base image and imply nothing about offering anything.
      That is the same confusion `the-replicated-stage-is-not-installed` records from the other end,
      and it is ISSUE #18's decision — deliberately not taken here, because widening the existing
      list to make the target implementable would answer #18 by making the list stop answering its
      own question. build/Build.Licence.cs now carries the measurement and stays unimplemented on
      purpose.
      ✅ CLOSED ON 2026-09-15 BY ISSUE #17, AND THE ROW'S NAME IS NOW A HISTORY RATHER THAN A CLAIM.
      build/Build.Licence.cs is the scan, and it is TWO scans because the paragraph above was right
      that one list cannot answer both questions. (1) The artefact's OWN licence, against the
      offering allow-list: every component now carries `licenceEvidence:`, the URL of the upstream
      LICENSE at the pinned release, which the scan fetches and classifies by text and compares with
      `licence:` — a mismatch fails naming both. The pinned chart's `artifacthub.io/license` and every
      recorded image's `org.opencontainers.image.licenses` label are compared the same way wherever
      they exist, which on 2026-09-15 was three charts of thirteen and five images of thirty-two —
      the count that made the LICENSE file the evidence that is required. (2) What each image LINKS,
      with Syft, against the families ADR-011 § Enforcement names — SSPL, BUSL, AGPL, Elastic, RSAL —
      and nothing else: GPL and LGPL inside a layer are reported and not judged, and the second
      allow-list that would judge them is still #18's decision, deliberately not taken. First run:
      all nineteen LICENSE files agree with their declarations, and the first disagreement the labels
      produced was cfssl/cfssl under BSD-2-Clause — a helper image kamaji renders — which widened the
      allow-list with a component behind it. What is still owed here: the managed charts' ENGINE
      images. charts/managed/* compose `repository:tag` from a `version` value inside templates, so
      scanning them means a `helm template` per chart — the render images.sh already does for bundle
      components — and this machine has no helm. The operators' own images are scanned; the engines
      they run are not yet.
  - id: images-are-not-pinned-by-digest
    says: >
      ⚠ THE FIRST SENTENCE OF THIS ROW WAS WRONG AND IS CORRECTED RATHER THAN QUIETLY EDITED. It read
      "Every component but redis-operator installs at its upstream's own default image, which is a
      tag rather than a digest", which reads as though redis-operator were the one component pinned
      by digest. It was not. It passed `--set image.tag=v1.3.0-rc1` — a TAG — and recorded an
      `imageDigest:` beside it whose own comment claimed `install.sh --verify` compared it. NOTHING
      READ THAT KEY: `verify_component` reads install, repo, chart, version, archive, manifest and
      manifestExtra and has never read a digest. So the true count of images pinned or checked by
      digest was ZERO, of nineteen components.
      ✅ WHAT LANDED ON 2026-09-03 IS THE RECORD AND THE CHECK, WHICH IS THE HALF THAT IS OURS TO
      BUILD. Every component now carries an `images:` block naming every container image its pinned
      artefact renders, each with the digest its registry served — THIRTY-TWO images across
      eighteen components, prometheus-operator-crds declaring in prose that it renders none.
      charts/bundle/images.sh re-renders each component (applying the same `values:` overrides
      install.sh does, without which redis-operator resolves the chart's broken default), extracts
      the images, resolves each tag through the OCI distribution API with curl alone, and compares.
      Sabotage-verified both ways: a moved digest and a recorded image nothing renders each turn it
      red, with different messages. The Bundle gate keeps the record readable — shape, no duplicates,
      and the prose escape — and deliberately resolves nothing, because a gate that makes thirty
      registry calls goes red when a network is slow.
      ⚠ WHAT IS STILL OWED, AND IT IS NOT THE SAME ITEM ANY MORE. (1) The record is a RECORD, not a
      pin: the tag is still what reaches the kubelet, so this detects a moved tag rather than
      preventing one. Preventing it means a values override per chart, and several charts have no
      digest key at all — redis-operator's component.yaml documents that case firsthand. ⚠ AND THE
      TWO CHARTS THAT DID TURN OUT TO HAVE AN IMAGE VALUES PATH, on 2026-09-05, DO NOT MAKE THIS ITEM
      SMALLER: clickhouse-operator's `crdHook.image.*` and kamaji's `cfssl.image.tag` both compose
      `repository:tag` in the template and can therefore carry a VERSION and never a digest. What
      those two closed is `a-tag-that-names-no-version-is-not-a-pin`, which is a different row. Zero
      of nineteen components is still the count of images pinned by digest. (2) A
      MIRROR MAP, still unmodelled, the same shape charts/managed/harbor's `imageRegistry` escape
      hatch takes for a single service. (3) The `manifest:` components under-report: kubevirt and
      containerized-data-importer record their OPERATOR image, and the operator then pulls
      virt-api, virt-controller, virt-handler and virt-launcher by names that appear nowhere in the
      applied document. (4) Nothing runs images.sh on a schedule, so a tag that moves is caught when
      somebody asks.
      ✅ (4) CLOSED ON 2026-09-15 BY ISSUE #17, AND IT CLOSED BY MOVING THE CHECK RATHER THAN BY
      SCHEDULING IT. The record is now CONSUMED by install.sh: before a component's first helm or
      kubectl line, every recorded image is resolved through the same `digest_of` images.sh uses —
      one copy, in oci.sh, sourced by both — and the component is refused, ending the run, when a
      tag serves other bytes than the recorded ones or when an entry is `@unresolved`. `--verify`
      runs the same gate over the roster with no cluster; `--dry-run` checks the shape and resolves
      nothing. test/CyberCloud.Bundle.Cluster.Conformance § BundleImagePins runs both refusals
      against sabotaged copies of this directory in REAL apply mode and asserts no kubectl line was
      reached, plus a positive control over the checked-in record. Its first run over the roster
      found the Altinity pair rebuilt under `0.27.3` — see clickhouse-operator/component.yaml — so
      the count of moved tags this directory has caught is now three, and two of them were
      versioned. (1) is unchanged and is stated precisely in charts/bundle/README.md § What this
      bundle pulls: the tag is still what the kubelet pulls, and the window between the resolve and
      the pull is closed by a digest the chart can render or by admission (#15), not by this. (2)
      and (3) are unchanged. ⚠ AND THE HARNESS THAT PROVES IT NOW RUNS ON WINDOWS, which #74's
      closing comment recorded it did not: BundleInstaller.OnPath found no `bash` because it looked
      for a file with no extension, and the fix was NOT to add one — `bash.exe` on a Windows PATH is
      the WSL launcher in System32. It finds Git for Windows' bash beside git.exe instead, and it
      normalises the output's line endings, which was the second thing that had never run.
  - id: a-tag-that-names-no-version-is-not-a-pin
    says: >
      ⚠ THIS ROW WAS CALLED `two-images-in-this-bundle-are-latest` AND THE NUMBER IN ITS NAME IS NOW
      ZERO. Renamed rather than edited in place, for the reason
      `most-of-the-roster-has-never-been-installed` carries in its own text — that row shed a count
      from its name after three successive names had carried one that was wrong by the time somebody
      quoted it. A number in a name is a claim nothing checks. Both sightings closed on 2026-09-05 —
      issue #75 — and the reading that produced them is kept below, because the argument rather than
      the count is the part worth having.
      ⚠ WHAT WAS FOUND, BY THE FIRST RUN OF images.sh ON 2026-09-03. A tag that names a version is a
      weak pin; a tag that names no version is not a pin at all. charts/bundle/clickhouse-operator
      rendered `bitnami/kubectl:latest` and charts/bundle/kamaji rendered `cfssl/cfssl:latest`.
      `bitnami/kubectl` was the sharper of the two: on 2026-09-03 `bitnami/kubectl:latest` resolved, a
      VERSIONED tag on the same repository (`bitnami/kubectl:1.34.1`) answered 404, and
      `bitnamilegacy/kubectl:latest` resolved — the versioned catalogue had moved namespace and what
      this bundle depended on was the one tag left behind in the old one.
      ⚠ AND IT MOVED, IN TWO DAYS, WHICH IS THE MEASUREMENT THAT DECIDED THE REST. Re-resolving ALL
      THIRTY-TWO recorded references through the OCI distribution API on 2026-09-05 found thirty-one
      serving the digest their component.yaml records and exactly one moved: `bitnami/kubectl:latest`,
      recorded sha256:e0fcb25c… on 2026-09-03 and serving sha256:b29d8c16… on 2026-09-05. The row
      that predicted "images.sh will go red the next time either moves — which for `latest` is a
      question of when" was answered by the calendar in forty-eight hours.
      ✅ BOTH ARE VERSIONED NOW, THROUGH UPSTREAM'S OWN VALUES KEYS AND NOT THROUGH A FORK.
      clickhouse-operator sets `crdHook.image.repository: clastix/kubectl` and
      `crdHook.image.tag: v1.36.4`; kamaji sets `cfssl.image.tag: v1.6.5`. Each component.yaml
      carries the full argument, the alternatives that were checked and rejected, and what would make
      the choice stale. Two facts are worth repeating here because they are the load-bearing ones.
      (a) `cfssl/cfssl:v1.6.5` and `cfssl/cfssl:latest` resolve to the SAME DIGEST on 2026-09-05, so
      that half changed a label and not a byte. (b) `bitnami/kubectl` has no versioned tag left to
      pin to — on 2026-09-05 the repository carries exactly one human-readable tag, `latest`, beside
      cosign artefacts — and the bytes it now serves report `Client Version: v1.37.0`, two minors
      ahead of this platform's own `rancher/k3s:v1.35.7-k3s1` and so outside kubectl's supported ±1
      skew. Staying was not the cheap option; it was the broken one.
      ⚠ THE PREVIOUS POSITION — "nothing is overridden here, because an override that pins somebody
      else's helper image to a digest we chose is a fork of their chart with no note saying so" — WAS
      RIGHT ABOUT DIGESTS AND TOO WIDE ABOUT TAGS, and it is corrected rather than quietly dropped. A
      digest we picked would be a fork: it would freeze bytes upstream never chose. A VERSIONED TAG
      passed through a values key upstream published, replacing a tag upstream left version-less, is
      upstream's own escape hatch used for its own purpose — and neither key can carry a digest
      anyway, because both templates compose `repository:tag` and nothing else.
      ⚠ THE GATE IS WHAT KEEPS IT AT ZERO. build/Build.Bundle.cs § ImagesViolations now fails the
      build on any `images:` entry whose tag is `latest`, which is a rule that can exist only because
      the count is zero: it was written after the two were closed, not before, and it is why nobody
      has to re-count. There is deliberately NO prose escape on it, unlike `rendersNoWorkloadImages:`
      — a component that genuinely cannot avoid `latest` is a decision worth a diff in the gate with
      the argument beside it, which is exactly what this row is.
      ⚠ A THIRD SIGHTING IS STILL DELIBERATELY NOT COUNTED, AND CHECKING IT IS THE POINT. The Kamaji
      control-plane provider's CRD carries `registry.k8s.io/kas-network-proxy/proxy-agent` and
      `-server` with NO TAG — which means `latest` — as `default:` values inside the KamajiControlPlane
      OpenAPI schema. images.sh drops CustomResourceDefinition documents and so does not report them,
      because they are not images this bundle pulls: nothing runs until a tenant creates a control
      plane that asks for konnectivity. It is a real hazard for charts/managed/kubernetes and it
      belongs to that chart's conformance.yaml, not to this row. Counting it would have made the
      bundle's own install look worse than it is, which is the mirror of the failure this repository
      keeps finding. The gate above cannot see it either, for the same reason and by the same
      exclusion.
      ⚠ WHAT IS STILL OWED HERE, AND IT IS THE ETCD HALF. The two etcd references this row recorded
      as "two versions of the same component in one chart" are not that, and the chart was read on
      2026-09-05 rather than guessed at: templates/etcd_sts.yaml renders the etcd SERVER from
      `.Values.etcd.image.tag`, pinned at v3.5.6, and templates/etcd_job_postinstall.yaml line 51
      renders an etcdctl CLIENT as the LITERAL string `quay.io/coreos/etcd:v3.5.1` — a post-install
      Job that adds the `root` user and enables auth. One server, one client four patches older,
      same 3.5 line, same v3 API, which is why nothing has failed. It stays owed because the client
      is a 2021 build pulled `imagePullPolicy: Always` on every install and there is NO values key
      for it: closing it is an upstream change or a fork, and this directory does not fork charts.
      ⚠ AND ONE ENTRY OF THE THIRTY-TWO IS A PROPERTY OF THE RENDERER RATHER THAN OF THE BUNDLE,
      found while reading the etcd jobs. kamaji renders `clastix/kubectl:<tag>` where the tag is
      `v<Capabilities.KubeVersion.Major>.<Minor>` — so the recorded `v1.36` is whatever Kubernetes
      version the helm that ran images.sh reported, and against this platform's own
      `rancher/k3s:v1.35.7-k3s1` the same chart renders `clastix/kubectl:v1.35`. Making the record
      match what a cluster pulls means `helm template --kube-version` inside images.sh, which changes
      what EVERY component renders; it belongs with a re-record of all thirty-two and not with the
      edit that found it.
  - id: the-admission-policies-are-admitted-by-nothing-that-re-runs
    says: >
      charts/bundle/cybercloud-admission is the twentieth component and the first this repository
      wrote rather than pinned: two ValidatingAdmissionPolicies and their bindings — #15's Secrets
      row control and ADR-013's belt over the seven labels. It was ADMITTED BY HAND ON 2026-09-15
      and BY NO TEST, and this row is the distance between those two.
      WHAT THE HAND RUN SETTLED, against one `rancher/k3s:v1.35.7-k3s1` started `--disable-agent` on
      a Cgroup-v1 host, the same fixture `the-manifest-path-waits-for-nothing` used: all four objects
      admitted with an empty `status.typeChecking`; and then, in a namespace labelled
      `cybercloud.io/managed-by=cybercloud`, every one of the eleven credential fixtures from
      SecretShapedTextTests in a ConfigMap REFUSED with its own rule named — "a value in this object
      is credential-shaped (AwsAccessKey)" and ten more — while all eight lines that suite says the
      platform logs on purpose were ADMITTED; a Pod env value, a Deployment arg, a CronJob command and
      a StatefulSet initContainer env each refused naming the rule that saw them; a Secret carrying a
      JWT admitted, because a Secret is not scanned; the same JWT ConfigMap in an unlabelled
      namespace admitted, because the binding does not reach it; an unlabelled ConfigMap from
      `system:admin` refused, six of seven labels refused, all seven admitted; a `managed-by` claim
      with no resource-id refused, `managed-by=someone-else` refused; an UPDATE changing tenant-id
      refused, one changing api-version admitted, one removing managed-by refused; and the ReplicaSet
      controller — a kube-system ServiceAccount, because k3s runs
      `--use-service-account-credentials=true` — created a ReplicaSet and a Pod carrying only
      `app` and `pod-template-hash` under the policy, which is the controller exemption doing the one
      thing it exists to do. 37 readings, none contrary.
      WHAT IT MEASURED, AND IT CHANGED THE FILE'S SHAPE: the CEL cost budget. Eleven rules in one
      expression refused an innocent 100,000-character ConfigMap value; every rule in one alternation
      refused 80,000; one validation per rule admits 450,000 and refuses 500,000. policies.yaml
      carries the numbers beside the shape they chose, and an object over that ceiling is REFUSED
      with a "cost budget" message rather than admitted unscanned.
      WHAT IT DID NOT SETTLE, AND WHY EACH IS OWED RATHER THAN CLOSED:
      ⚠ NOTHING RE-RUNS IT. A reading taken once by a person is not a gate — the sentence this file
      already applies to the six manifest components applies here in full. The suite this needs is
      the one test/CyberCloud.Bundle.Cluster.Conformance already has the shape of: a fresh k3s,
      `install.sh --component cybercloud-admission`, a labelled namespace, and the two fixture sets
      pushed through the real evaluator. It is not written because on this host a k3s with an agent
      does not start (`the-manifest-path-waits-for-nothing` has the reading) and a suite that was
      never seen green is a suite that ships its own bugs. It goes in the same lane as the other
      installing classes, and it is the first that would exercise the `file` arm of install.sh under
      test.
      ⚠ THE TWO RULE TABLES ARE COPIES, AND THE GATE OVER THEM IS A UNIT TEST, NOT THE EVALUATOR.
      SecretShapedAdmissionPolicyTests holds the eleven patterns to SecretShapedText.Rules byte for
      byte, and SecretShapedTextTests runs every fixture through the RE2 spelling on .NET's
      non-backtracking engine — the nearest thing to Go's this repository can run without a cluster,
      and it agrees on ASCII. Where the two engines could disagree — `\b` and `\s` are ASCII in RE2
      and Unicode in .NET — no fixture reaches, and the only proof that the API server agrees with
      the log scrubber over a real object is the hand run above.
      ⚠ NO OPERATOR HAS RENDERED A CHILD INTO A CYBER CLOUD NAMESPACE UNDER THESE POLICIES. The
      secret-shaped policy holds every writer, controllers included, and every operator in this
      bundle creates Pods and ConfigMaps in the namespace of the resource it reconciles. Read rather
      than run: Kamaji's `DataStore` here is etcd, so no tenant control plane carries a
      `postgres://user:password@` in its args, but a kine-backed DataStore would; a ConfigMap
      template with `password = ${PLACEHOLDER}` is refused by ConnectionStringPassword exactly as
      the log scrubber would redact it. Whether any pinned operator does either is the question the
      suite above answers and this row cannot.
      ⚠ THE CONTROLLER EXEMPTION IS AN IDENTITY LIST, AND IT IS WIDER THAN "THIS PLATFORM". Any
      ServiceAccount — a tenant's own controller included — may create an unlabelled object in a
      Cyber Cloud namespace, because CloudNativePG, Strimzi and the token controller must. The other
      two rules hold everyone. policies.yaml states the list and why it is closed rather than
      prefix-matched; a narrower exemption is a design change that needs the suite above to be
      tested against.
  - id: the-platform-has-no-mta
    says: >
      CyberCloud.Communication/services and its three children shipped on 2026-09-15 (#33) as the
      tenant-facing face of the sending module, and NOTHING IN THIS BUNDLE CAN CARRY AN EMAIL. What
      changed on 2026-09-18 (#93), and what did not — AND #93 STAYS OPEN, because what it asked for
      is the carrier and what landed is the client: the module now ships the CLIENT — SmtpChannelProvider,
      a hand-written SMTP submission (STARTTLS, AUTH PLAIN/LOGIN, the deliverability headers docs/plan/17
      § The outbound carrier lists) to whatever relay CyberCloud:Communication:Smtp names, proven against
      Mailpit in a container and run against Mailpit by the AppHost — and this bundle still ships no
      RELAY, so on a cluster the section names nothing and every email channel, the platform's own OTPs
      included, still lands on the refusing seam, whose sentence now names the section to set. Recorded
      HERE rather than in a chart's conformance.yaml because the family is clusterless and has no chart:
      the outbound MTA is not a per-tenant resource, it is platform infrastructure — a shared, warmed
      outbound pool with a PTR, feedback-loop registrations and RBL monitoring, docs/plan/17
      § Deliverability's table — and docs/plan/25's closed row 2 adds that the platform's OWN
      transactional sending IPs must be separate from tenant sending IPs, so that one tenant's
      reputation problem cannot take the platform's OTPs and invoices down with it. WHAT CLOSING IT
      TAKES, now that the client exists: a Postfix relay component in this roster (its own chart, its
      own conformance.yaml, `requires:` cert-manager for the submission certificate) or an Amazon SES
      SMTP credential in a Secret — either is the same six configuration keys on the silo — plus the
      operational half no chart carries: the PTR, the feedback loops, the warm-up, and the abuse desk
      docs/plan/17 § Deliverability says to decide about before starting. ⚠ TWO SMALLER THINGS RIDE ON
      THE SAME ROW. A tenant's own SMTP account (account: tenant on an email channel) is REFUSED by the
      carrier rather than sent through the platform's relay under the platform's name, because a BYO
      relay has a host per tenant and ChannelConfiguration carries only two credential handles; closing
      it is a `relayHost` on the channel and a third CarrierSecretRef read through a vault seam this
      module does not yet have. And the relay credential itself is configuration, not a vault handle —
      SmtpRelayOptions' remarks own the deviation and name the one line to change. The SMS, WhatsApp,
      push and voice carriers are the same shape of absence and the same seam; the MTA is listed alone
      because it is the one this bundle would host rather than a contract somebody signs.
  - id: communication-silo-kill-has-no-clusterless-harness
    says: >
      test/CyberCloud.Cluster.Conformance refuses a case with no objects by name
      (ClusterConformanceTests.TheCaseOwnsClusterObjectsOrThisWholeSuiteWouldBeVacuous), and every
      CyberCloud.Communication type is clusterless. Four of that half's five criteria are about a real
      API server and do not apply; the fifth — docs/plan/24 § Phase 1's exit criterion 3, killing the
      silo mid-create and finding the resource converged from a real PostgreSQL durable tier — does
      apply, because a channel or a suppression is durable grain state, and has no harness that can
      run it. The Docker-free suite's clusterless half (IConvergedModule) is what the family passes
      today; a clusterless SiloKillConformanceTests over the same IConvergedModule is the missing
      piece, and it is the first thing to build before a second clusterless family lands.
      ⚠ A SECOND CLUSTERLESS TYPE LANDED FIRST (2026-09-15, #32): CyberCloud.Monitor/workspaces/alertRules,
      a clusterless child of a cluster-backed parent, converges onto a durable grain through its own
      IConvergedModule and has the same criterion unrun. It was not built ahead of that type because
      the type is a child — its harness has to create the workspace ancestor against a real API
      server before it can kill a silo under the rule — so the clusterless silo-kill harness now has
      a second shape to cover, and two creditors.
  - id: communication-senders-have-no-resource-surface
    says: >
      docs/plan/17 § The channel abstraction makes sender-id registration, US 10DLC campaign approval
      and WhatsApp template pre-approval "the tenant's compliance obligations with our tooling", and
      the module has the grain for it — ISenderIdentityGrain, with its Draft → Pending → Approved
      flow and the CheckAsync a send makes. No resource type reaches it: ChannelConfiguration.SenderId
      is always empty from the tenant-facing surface, so every send goes out under the platform's
      sender and no tenant can register their own. The same api-version limit that made a template one
      locale applies — a sender's cleared countries are a list of strings, which IS expressible, so
      this is a missing type rather than a missing schema feature, and the next pass on this family.
      Template pre-approval (IMessageTemplateGrain.RecordApprovalAsync) has the same gap: nothing on
      the resource surface records a carrier's decision, so a WhatsApp send refuses today for want of
      an approval nobody can enter.
  - id: communication-inbound-is-suppressed-and-forwarded-nowhere
    says: >
      docs/plan/17 § The parts that are actually the work: "Replies and STOP keywords routed to a
      webhook or a queue." The first half is built — IWebhookRouter.HandleInboundAsync suppresses on a
      STOP before anything else, deliberately — and the second is not: there is no forwarding
      destination on the service, no queue, and no property to declare one. A reply that is not a
      STOP is dropped on the floor. The property belongs on CyberCloud.Communication/services once
      there is something to forward to.
  - id: communication-receipts-have-no-ingress
    says: >
      docs/plan/24's Communication row names four nouns and the fourth — delivery receipts — has its
      read half only. The `status` action renders every receipt IWebhookRouter recorded, and NOTHING
      CAN DELIVER ONE: no host maps an HTTP path a carrier's callback could reach, and the gateway's
      pipeline authenticates every request by bearer token (GatewayRoute's closed set of route kinds,
      AuthenticateStage), which a carrier does not carry. Nothing outside the tests calls
      IWebhookRouter.HandleAsync; the receipt-fed hard-bounce test in
      CyberCloud.Providers.Communication.Tests hands the router a receipt in-process and pins
      everything from the router down. Found by review of #33, and NOT closable ahead of
      the-platform-has-no-mta above, for a reason that is a security property rather than a
      sequencing preference: docs/plan/17 § The channel abstraction puts HandleWebhookAsync on the
      channel provider because the ONLY authentication a carrier callback has is the carrier's own
      signature over the raw body, and the provider is what knows how to verify it. With no carrier
      registered, WebhookRouter.HandleAsync resolves no provider for any channel and applies nothing —
      so an ingress today would be a public endpoint that answers 200 and does nothing, and an ingress
      that bypassed the provider to feed HandleReceiptAsync directly would let anyone on the internet
      hard-bounce any address on any tenant's list. What the ingress will be, so the first carrier
      lands with it: a gateway route kind beside SecurityTxt that skips the bearer-token stage and
      carries the service id in its path (WebhookEnvelope.ServiceId — "this is where the tenant comes
      from"), rate-limited, handing the raw bytes to the router unparsed because the signature is over
      them.
      ⚠ THE FIRST CARRIER LANDED (2026-09-18, #93) AND THE INGRESS DID NOT, DELIBERATELY, AND THIS
      ROW NOW CARRIES THE EMAIL-SPECIFIC DESIGN SO THE RELAY LANDS WITH IT. The carrier is SMTP to a
      relay, and a relay reports a bounce as MAIL, not as a webhook: an RFC 3464 delivery status
      notification to the envelope sender, with the original Message-ID (the provider message id
      SmtpChannelProvider returns, minted under the From domain) in the returned headers and a
      per-recipient `Status:` field whose first digit says permanent (5.x.x → HardBounce) or
      transient (4.x.x → nothing). Amazon SES reports the same as an SNS notification — JSON with
      `notificationType` Bounce/Complaint, `bounce.bounceType` Permanent/Transient and the SES
      message id, which is NOT ours (SES rewrites Message-ID), signed with the SNS certificate named
      in `SigningCertURL`. So two ingestion shapes, both landing on IWebhookRouter.HandleReceiptAsync
      with DeliveryReceipt.Suppresses set by the parser and nobody else: (1) for a Postfix relay, a
      mailbox the DSNs are routed to — the envelope sender, or a VERP address per message
      (`bounces+{messageId}@domain`, which makes the correlation the address itself) — read by a poller
      or delivered by the relay to an HTTP hook; and (2) for SES, the gateway route kind above, verifying
      the SNS signature before parsing, with a lookup from the SES message id to ours that the
      dispatch path has to record when the relay's 250 carries it. The List-Unsubscribe mailbox is the
      third arrival on the same path: a mail to it is an OptOut for the sender, and the RFC 8058
      one-click `https:` form is the same gateway route kind again. None of this ships before a relay
      does, for the security reason at the top of this row — with no relay there is nothing to verify
      a bounce against, and an unverified bounce is a stranger suppressing an address.
