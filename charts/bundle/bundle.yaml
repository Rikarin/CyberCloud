# The bundle roster — charts/bundle/README.md § What a component owes.
#
# Every directory beside this file is a component; every component is listed here; the Bundle gate in
# build/Build.Architecture.cs fails when those two sets differ. The roster exists so that adding a
# component is a visible diff in one file rather than a directory somebody has to notice — the same
# reason Build.Architecture.cs keeps `ArchitectureGates` next to the run that produces the outcomes.
#
# ⚠ THIS FILE CARRIES NO VERSIONS. A pin lives in exactly one place, its component's `component.yaml`,
# because a version written twice is a version that disagrees with itself. What the roster carries is
# the ORDER, which is a property of the set and belongs to the set.

# The phases, in the order `install.sh` applies them. A phase is a barrier: every component in phase N
# is installed and its CRDs are established before phase N+1 begins.
#
# ⚠ THAT SENTENCE OVERSTATED ITSELF UNTIL #74 AND NOW STATES EXACTLY HALF OF WHAT IT USED TO IMPLY,
# WHICH IS THE HALF THAT IS TRUE. "Its CRDs are established" is now enforced for every kind of
# component: helm's `--wait` for the thirteen `helm` and `helm-archive` rows, and a
# `kubectl wait --for=condition=Established crd --all` after every apply for the six `manifest:` ones,
# which before #74 ran only for the two of those six that declare a `manifestExtra`.
#
# ✅ AND SINCE 2026-09-15 THE SENTENCE IS WHOLE AGAIN, FOR EVERY KIND: a `manifest:` row's
# component.yaml carries `waitFor:` — a Deployment `Available`, or a custom resource's phase, one
# `kubectl wait` per entry — which install.sh runs after the apply with the same 10 m helm gets, the
# Bundle gate requires and shape-checks, and `BundleInstallSelection` asserts on the dry run. So
# "installed" means "serving" for all twenty, and a phase is the barrier this comment always said it
# was. What the wait is for each of the six was MEASURED on the first run with a kubelet, not
# derived: `owed:` § `the-manifest-path-waits-for-nothing` has the three shapes and the one row that
# had to move because of it.
phases:
  - phase: 5
    name: admission
    why: >
      The two ValidatingAdmissionPolicies of charts/bundle/cybercloud-admission — docs/plan/18
      § Platform security's "never in env vars in a manifest", and ADR-013's belt over the seven
      labels. First because it needs nothing: no pod, no image, no definition another component
      establishes. A policy is stored by the API server and served from its own informer, so it is
      in place before the first object anything writes. ⚠ It is the only `install: file` component
      and the only first-party one; its component.yaml says what that kind may not carry and why.
      Both bindings select namespaces carrying `cybercloud.io/managed-by=cybercloud`, which the
      platform stamps and this bundle never does — so no later phase is admitted against them and
      the order here is a statement about dependencies, not a barrier.
  - phase: 10
    name: fabric
    why: >
      The CNI. Nothing else schedules until pods have addresses, so this is not merely first, it is
      the only phase whose failure has no diagnostic worth reading — every later component reports
      "pod pending" and none of them reports why.
  - phase: 15
    name: certificates
    why: >
      cert-manager, and it is here because later components' webhooks mount a Secret only
      cert-manager creates. ⚠ It was not on Task #109's starting list; it was found by reading
      `cluster-api-components.yaml` and the Kamaji chart's templates rather than their READMEs. A
      cluster missing it accepts every install and admits no Cluster.
      ⚠ THIS ROW SAID "TWO PHASE-40 COMPONENTS" UNTIL #74 AND THE SUBJECT IS NEITHER TWO NOR CONFINED
      TO PHASE 40. Counted on 2026-09-05 by applying all six `manifest:` components to one API server
      and reading the objects back off it: FIVE Deployments in the bundle mount a Secret that only a
      cert-manager `Certificate` produces — `capi-controller-manager`,
      `capi-kubeadm-bootstrap-controller-manager` and `capi-kubeadm-control-plane-controller-manager`
      from charts/bundle/cluster-api, `capk-controller-manager` from
      charts/bundle/cluster-api-provider-kubevirt, and `rabbitmq-cluster-operator` from
      charts/bundle/rabbitmq-cluster-operator, WHICH IS PHASE 50. Applying that last one to a cluster
      with no `cert-manager.io/v1` was run rather than reasoned about: `kubectl apply` places
      THIRTEEN of its sixteen objects, refuses the THREE cert-manager ones with "ensure CRDs are
      installed first", and install.sh exits 1 — so the ordering failure here is loud, and the
      Deployment it leaves behind could not have started either way. charts/bundle/kamaji ships its
      own Issuer and Certificate as chart templates and so is a sixth dependant that no applied
      document shows.
      The count goes stale when a component is added, bumped, or drops its webhook.
  - phase: 20
    name: crds
    why: >
      Definitions with no controller behind them in this bundle. Three managed charts render a
      PodMonitor and nothing here reconciles one; the definition still has to exist or the apply is
      refused. Installed early because a CRD is cheap and a missing CRD fails an apply that already
      returned 202 to a tenant.
  - phase: 25
    name: storage
    why: >
      The default StorageClass, and it is this early because three later phases provision claims
      before any tenant does: KubeVirt's DataVolumes in phase 30, Kamaji's etcd in phase 40 — whose
      failure mode docs/plan/09 already names as "storage class unavailable" — and every data-service
      operator in phase 50. ⚠ It is a StorageClass and a provisioner, NOT a CSI driver, and the
      component says so in its own first paragraph. The class installed here is single-replica and
      node-local with no kernel module in it, which is what lets the bundle install onto a cluster we
      did not build; the replicated path is declared in openebs-localpv/component.yaml § which stage
      is on, and nothing here installs it.
  - phase: 30
    name: virtualisation
    why: >
      CDI and KubeVirt, in that order. The Cluster API infrastructure provider in phase 40 reconciles
      a Machine into a VirtualMachine, so it needs both groups present before its first reconcile,
      not merely before its first cluster. ⚠ CDI first because KubeVirt v1.9.0's
      `virt-template-controller` needs the `DataVolume` kind at start — the row comment under
      `components:` and kubevirt/component.yaml § requires have the measurement.
  - phase: 40
    name: cluster-api
    why: >
      Core Cluster API and the two providers charts/managed/kubernetes names. Kamaji is here rather
      than in phase 50 because the control-plane provider's webhook resolves a cluster-scoped
      `DataStore` at admission — see kamaji/component.yaml.
  - phase: 50
    name: data-services
    why: >
      The operators behind the catalogue. They are mutually independent — no data-service operator
      reads another's CRDs — so the order within this phase does not matter and is alphabetical.
  - phase: 60
    name: observability
    why: >
      Last, because it is the only phase whose absence degrades rather than breaks: a monitor
      workspace that cannot be created is a missing feature, and a missing CNI is a dead cluster.

components:
  - name: cybercloud-admission
    phase: 5
  - name: kube-ovn
    phase: 10
  - name: cert-manager
    phase: 15
  - name: prometheus-operator-crds
    phase: 20
  - name: openebs-localpv
    phase: 25
  # ⚠ CDI BEFORE KUBEVIRT, SINCE 2026-09-15, AND THE PER-COMPONENT BARRIER IS WHAT FOUND IT. KubeVirt
  # v1.9.0's `virt-template-controller` refuses to start without CDI's `DataVolume` kind — "no matches
  # for kind DataVolume in version cdi.kubevirt.io/v1beta1" — so the `KubeVirt` resource never leaves
  # `Deploying`. The other way round the first real run went green only because both were applied
  # with no wait between them and CDI's definitions arrived while KubeVirt was still deploying; with
  # `waitFor:` the kubevirt row held for its full 10 m and exited 1 before CDI was reached. Measured,
  # not read. kubevirt/component.yaml § requires carries it.
  - name: containerized-data-importer
    phase: 30
  - name: kubevirt
    phase: 30
  - name: cluster-api
    phase: 40
  - name: kamaji
    phase: 40
  - name: kamaji-control-plane-provider
    phase: 40
  - name: cluster-api-provider-kubevirt
    phase: 40
  - name: clickhouse-operator
    phase: 50
  - name: cloudnative-pg
    phase: 50
  - name: mariadb-operator
    phase: 50
  - name: opensearch-operator
    phase: 50
  - name: rabbitmq-cluster-operator
    phase: 50
  - name: redis-operator
    phase: 50
  - name: seaweedfs-operator
    phase: 50
  - name: strimzi-kafka-operator
    phase: 50
  - name: victoria-metrics-operator
    phase: 60

# ── The ordering rule ─────────────────────────────────────────────────────────────────────────
#
# charts/managed/opensearch/conformance.yaml § owed, `api-group-is-deprecated`: "Closing it is a new
# api-version on the resource type plus a charts/bundle/ bump, in that order, and the two must not be
# done in one commit: a bundle that moved first would strand every existing service."
#
# Two halves, and they are enforced by different things because only one of them is a property of a
# file on disk.
#
#   * THE DIRECTION is enforced by the Bundle gate's coverage check, on every run, over every chart.
#     A component whose pin no longer serves a group/version some chart still renders fails the
#     build, naming both. That is the half that matters: the failure mode being prevented is an
#     object applied, accepted by the API server, and reconciled by nothing.
#   * THE GRANULARITY — "not in one commit" — is enforced over the tip commit only, because that is
#     the unit the sentence is about. The gate reads HEAD; a shallow clone with no parent is reported
#     as not inspected rather than passed.
ordering:
  rule: A commit must not change a component's version pin and a charts/managed/*/templates/ file.
  enforcedBy: build/Build.Architecture.cs, BundleGate
  citation: charts/managed/opensearch/conformance.yaml § owed, api-group-is-deprecated

# ── owed ──────────────────────────────────────────────────────────────────────────────────────
#
# Named here rather than left to be discovered. Every item below was found while pinning this bundle
# and none of it is speculative.
owed:
  - id: most-of-the-roster-has-never-been-installed
    says: >
      ⚠ READ THIS BEFORE ANY OTHER ITEM. ⚠ AND THE ID NO LONGER CARRIES A COUNT, WHICH IS THE FOURTH
      CORRECTION RATHER THAN THE FOURTH COUNT. It read `nothing-here-has-been-installed`, then
      `one-of-eighteen-has-been-installed`, then `two-of-nineteen-have-been-installed`; the
      denominator in the second was already wrong when openebs-localpv landed, and "eighteen" survived
      into README.md, deploy/README.md and build/Build.Bundle.cs' prose. Renaming it to
      `three-of-nineteen` on 2026-09-03 would have been the same mistake a fourth time — a count
      written into an ID is a count nothing checks, and every reader of the ID then quotes it.
      THE COUNT, ON 2026-09-03: `components:` above holds NINETEEN rows and charts/bundle/ holds
      nineteen directories. THREE of them are installed onto a real API server by
      test/CyberCloud.Bundle.Cluster.Conformance, which runs THIS DIRECTORY'S OWN `install.sh` in
      every case:
      cert-manager, phase 15 — `cert-manager.io/v1` is served afterwards and a self-signed
      Certificate reaches Ready with a parseable certificate in the Secret it names. Sabotage-verified
      both ways: deleting the `values:` block from cert-manager/component.yaml turns the run red, and
      so does removing the `--set` from the installer.
      openebs-localpv, phase 25 — see `one-volume-has-been-provisioned` below.
      openebs-localpv AND cloudnative-pg TOGETHER, in ONE run, across TWO phases — see
      `an-operator-created-and-bound-the-claim` below, which is the row that closes the sentence this
      directory exists for.
      WHAT THAT PROVES: the install MECHANISM, and now one end-to-end path through it. `install.sh`
      runs unattended against a cluster it is handed; it reads a pin out of a component.yaml rather
      than carrying one; its `--wait` makes "installed" mean "serving" FOR A HELM COMPONENT — see
      `the-manifest-path-waits-for-nothing`, which is the clause that turned out to be false for six
      of the nineteen and is now half true of them; a `serves:` line is true of the cluster
      afterwards; and two components install onto one node without fighting.
      WHAT IT DOES NOT PROVE, AND THE DISTANCE IS STILL THE WHOLE OF THIS ROW: that the other
      SEVENTEEN pins install under a test. NO TEST runs kube-ovn, KubeVirt, CDI, Cluster API or Kamaji,
      which is where the three virtual machines and most of the risk are. ⚠ That sentence was narrowed
      to "kube-ovn or Kamaji" when the hand run landed and is restored on 2026-09-05, because the
      paragraph it sits in is scoped to "under a TEST" and the hand run was not one. Dropping names
      from a not-proven list on the strength of a run that proves something else is how a list like
      this stops being read.
      ⚠ THE `manifest:` HALF OF THAT SENTENCE MOVED ON 2026-09-05 AND IT MOVED BY HAND RATHER THAN BY
      A SUITE, WHICH IS A WEAKER THING AND IS RECORDED AS ONE. All SIX `manifest:` components were
      applied through install.sh against an API server with no kubelet — see
      `the-manifest-path-waits-for-nothing` for the fixture and every reading. So the `kubectl` branch
      and the two-document apply are no longer unexercised, and `kubectl` has still NEVER been invoked
      by this script UNDER TEST: the kubectl in the cloudnative-pg suite is the test's own, applying a
      rendered chart. A reading taken once by a person is not a gate, and nothing re-runs it.
      ✅ AND ON 2026-09-15 THE WHOLE ROSTER WAS INSTALLED BY HAND ONTO ONE k3s WITH A KUBELET — the
      first time an operator this script installs has run at all — and NINETEEN OF TWENTY SERVE. The
      count of what has been applied at all is now: three by a test, nineteen by that run, and ONE by
      nothing that succeeded — kube-ovn, which is a cluster-creation component and refuses a k3s that
      already has a CNI; `kube-ovn-needs-a-node-this-lane-cannot-give` below. What that run found is
      the reason this file changed shape: `the-manifest-path-waits-for-nothing` (the wait is per
      component and is now written), and the three pins and one reorder recorded in install.sh's
      header. It is still a reading by a person: the suite in test/CyberCloud.Bundle.Cluster.Conformance
      installs the same three helm rows it always did, and the lane that would install a `manifest:`
      row under test now EXISTS on this machine (docs/plan/23 § The lane that needs a kubelet) and is
      not yet used for one.
      ⚠ THE PHASE ORDER IS RUN, AND THE PHASE BARRIER IS NOW HALF RUN, AND THE TWO ARE DIFFERENT
      CLAIMS. `BundleInstallSelection` drives a full `--dry-run` and asserts that all nineteen
      components are attempted once each, in the roster's order, under ascending phase headers — the
      first assertion here that covers every row, and it costs under a second because it touches no
      cluster. It also asserts, from the same dry run, that every `manifest:` component is followed by
      an establishment wait before the next component begins, which is the barrier's SHAPE. What a dry
      run cannot answer is whether "installed" implies "serving", and for the six `manifest:` rows the
      answer is now "its definitions are served, its operator may not be running".
      ⚠ THE LANE, DECIDED RATHER THAN DEFERRED, AND MEASURED. The suite is 4 m 27 s – 4 m 47 s green
      across three runs with the cloudnative-pg class in it, against 2 m 20 s – 3 m 15 s without: the class costs about 1 m 50 s
      of serial tail, of which 26 s is the two-component install, 68 s is PostgreSQL reaching Ready,
      and the rest is a second k3s start. It stays in the per-PR lane, and NOT because that is cheap.
      The only nightly lane that exists is `Build.E2E`, whose own preconditions refuse to run without
      `--e2e-base-url` pointing at a real staging deployment and without a `cyc` CLI to drive; a
      Testcontainers k3s suite moved there would be run by nothing, which is a worse outcome than a
      slow one. A lane for container-backed suites that are too slow for per-PR and need no
      deployment does not exist, and creating one is the decision this row now owes.
  - id: an-operator-created-and-bound-the-claim
    says: >
      ✅ THE SENTENCE THIS DIRECTORY EXISTS FOR IS NO LONGER OWED, AND IT IS THE ONLY ROW HERE THAT
      HAS EVER BEEN ABLE TO SAY SO. `one-volume-has-been-provisioned` set the target in its own words
      — "a reconciler applies a resource, an operator creates the claim, the claim binds" — and
      test/CyberCloud.Bundle.Cluster.Conformance § CloudNativePgOnAnEmptyCluster now runs it:
      ONE `install.sh` run installs openebs-localpv (phase 25) and cloudnative-pg (phase 50) onto one
      fresh k3s; `helm template charts/managed/postgres` renders a `postgresql.cnpg.io/v1` Cluster;
      the API server admits it against the definition the bundle just installed; CloudNativePG creates
      a PersistentVolumeClaim NAMING `openebs-hostpath`; the claim binds; and the cluster reports
      Ready.
      ⚠ WHAT MAKES IT DIFFERENT FROM THE STORAGE ROW IS ONE FIELD ON THE API SERVER. The claim carries
      a CONTROLLER ownerReference to the `Cluster`, kind and apiVersion asserted, so the test could
      not have written it — which is precisely the criticism `one-volume-has-been-provisioned` makes
      of itself ("a 64Mi directory by a test's own hand-written claim").
      ⚠ AND THE VOLUME'S NODE-LOCAL PATH IS ASSERTED, FOR THE SAME REASON AS OVER THERE. This cluster
      has two default classes; openebs writes under /var/openebs/local and k3s's own provisioner under
      /var/lib/rancher/k3s/storage, so the path is the one assertion that survives a mix-up in every
      other one. Measured on a ten-CPU host on 2026-09-03: the claim exists 8 s after the apply, is
      Bound at 18 s, and the cluster is Ready at 68 s.
      ⚠ WHAT IT DOES NOT SAY. It is one of the two charts that render this group — charts/managed/
      ferretdb renders a Cluster too and is not exercised — and it is not the chart's DEFAULT body:
      seven values are overridden, each with the reason beside it in the test, and two of them
      (`pooling.enabled`, `monitoring.enabled`) switch off objects that would need a second and third
      bundle component. It says nothing about the other seventeen charts, and nothing at all about a
      RECONCILER: the resource here is applied by a test running helm and kubectl, not by the
      platform's own reconcile path.
  - id: the-manifest-path-waits-for-nothing
    says: >
      ⚠ FOUND ON 2026-09-03 BY READING install.sh WHILE ADDING A SELECTOR TO IT, AND IT REFUTES A
      SENTENCE THIS FILE AND README.md BOTH REPEAT. The claim is that `--wait` makes "installed" mean
      "serving". That is true of the THIRTEEN `helm` and `helm-archive` components and false of the
      SIX `manifest:` ones — kubevirt and containerized-data-importer in phase 30, cluster-api,
      kamaji-control-plane-provider and cluster-api-provider-kubevirt in phase 40, and
      rabbitmq-cluster-operator in phase 50. The `manifest` branch was a bare
      `kubectl apply --server-side` with no wait of any kind; the ONE wait it could reach —
      `kubectl wait --for=condition=Established crd --all` — ran only when the component declares a
      `manifestExtra`, which two of the six do, and even then it ran INSIDE the component, before its
      second document.
      ✅ THE DEFINITIONS HALF IS CLOSED ON 2026-09-05 AND IT WAS CLOSED BY RUNNING THE SIX RATHER THAN
      BY ARGUING ABOUT THEM, WHICH IS WHAT THE PARAGRAPH BELOW ASKED FOR. install.sh now runs that
      establishment wait after EVERY manifest apply, not only before a second document. It is per
      component rather than per phase on purpose: phase 40 holds four rows and the two providers admit
      against definitions the rows before them IN THE SAME PHASE installed, so a boundary-only wait
      would not have ordered the case this row calls out — and a wait after every manifest apply
      gives the boundary property as well.
      ⚠ THE REASON FOR THAT LAST CLAUSE WAS WRONG UNTIL THE #74 REVIEW AND IS CORRECTED HERE ON
      2026-09-05, BECAUSE IT IS THE WHOLE JUSTIFICATION FOR NOT DOING WHAT THE ISSUE ASKED. It read
      "because the last row of a phase has run it", which is a general property of the roster and is
      not one. Counted here by taking each phase's LAST row and reading its `install:` key: phases 30
      and 40 end on a `manifest:` row (containerized-data-importer, cluster-api-provider-kubevirt) and
      the other SIX of the EIGHT end on `helm` or `helm-archive` — kube-ovn, cert-manager,
      prometheus-operator-crds, openebs-localpv, strimzi-kafka-operator, victoria-metrics-operator.
      Phase 50's ONLY manifest row, rabbitmq-cluster-operator, is fifth of that phase's eight. The
      conclusion survives on a per-row argument instead: every manifest row waits right after its own
      apply, so no phase can END holding a definition install.sh applied and did not wait for, and the
      helm tail that closes those six phases carries helm's `--wait`.
      ⚠ WHAT WAS ACTUALLY RUN, BECAUSE THE PROVENANCE IS THE POINT OF THIS ROW. All six components
      were applied through install.sh itself, one `--component` run each, onto ONE
      `rancher/k3s:v1.35.7-k3s1` started with `--disable-agent` — an API server with NO KUBELET,
      because the host's Docker reports `Cgroup Version: 1` and 1.35's kubelet refuses to start on
      such a host. cert-manager's definitions were applied first, standing in for phase 15. Every one
      of the six exits 0, the two-document path was exercised for the first time
      (`kubevirt.kubevirt.io/kubevirt` and `cdi.cdi.kubevirt.io/cdi` both admitted after the wait),
      one `--phase 30` run put BOTH of that phase's components on in one go, and
      rabbitmq-cluster-operator went from 1.2 s to 4.7 s once the wait became unconditional, on a
      cluster holding thirty-six definitions. Those thirty-six are four k3s ships, six cert-manager's,
      and TWENTY-SIX from the six components themselves — cluster-api alone contributes seventeen.
      ⚠ THE DEPLOYMENTS HALF WAS OWED, AND THE 2026-09-05 RUN MADE IT SHARPER RATHER THAN SMALLER.
      "Established" says the API server will serve the kind; it says nothing about the operator, and a
      phase-40 provider whose controller has no pod fails exactly like one whose CRD is missing, only
      later. What that run settled is that the obvious spelling is WRONG. The six put EIGHT
      Deployments in EIGHT namespaces and NOT ONE namespace is the `<component>-system` install.sh
      computes — `kubevirt/virt-operator`, `cdi/cdi-operator`, `capi-system/capi-controller-manager`,
      `capi-kubeadm-bootstrap-system/capi-kubeadm-bootstrap-controller-manager`,
      `capi-kubeadm-control-plane-system/capi-kubeadm-control-plane-controller-manager`,
      `kamaji-system/capi-kamaji-controller-manager`, `capk-system/capk-controller-manager` and
      `rabbitmq-system/rabbitmq-cluster-operator`. cluster-api alone accounts for three of them, so
      "its Deployment" is not even singular.
      ✅ CLOSED ON 2026-09-15, ON THE FIRST RUN WITH A KUBELET, AND THE WAIT IS THREE SHAPES. Every
      `manifest:` component.yaml now carries `waitFor:` — one `kubectl wait` argument list per entry
      — which install.sh runs after the apply (the same 10 m helm's `--wait` gets), the Bundle gate
      requires on that kind and shape-checks, and BundleInstallSelection asserts the dry run prints
      after the apply: the three readers `imageDigest:` never had. What the entries say was MEASURED
      rather than derived, because no rule could have produced it: (1) the plain Deployment
      `Available` for rabbitmq-cluster-operator and the four Cluster API controllers, which is the
      one shape the guess would have got right; (2) the `KubeVirt` resource's `status.phase ==
      Deployed` for kubevirt, where `virt-operator` is 2/2 Available at 42 s and is NOT the barrier —
      it then renders nine more workloads including the `virt-handler` DaemonSet, and `Deployed`
      arrived at about seven minutes on a cold cache, 1 m 40 s on a warm one; (3) the `CDI` resource's
      `Deployed` for containerized-data-importer, where a Deployment wait would have gone RED during
      a healthy install — `cdi-uploadproxy` sits in `CreateContainerConfigError` on `secret
      "cdi-api-signing-key" not found` until the operator mints the key.
      ⚠ AND THE BARRIER, ONCE IT EXISTED, FOUND A DEPENDENCY THE WAIT-FREE RUN HAD HIDDEN. With
      kubevirt first in phase 30 and a real wait after it, the `KubeVirt` resource never left
      `Deploying`: v1.9.0's `virt-template-controller` fails at start with "no matches for kind
      DataVolume in version cdi.kubevirt.io/v1beta1", CDI's definitions were a row away, and the
      wait burned its full 10 m and exited 1 — 10 m 36 s wall-clock, before CDI was reached. That is
      the loud failure a barrier owes and the first real run had got lucky on: both were applied
      with nothing between them, and CDI's definitions arrived while KubeVirt was still deploying.
      The roster now installs containerized-data-importer first; re-run, phase 30 is 2 m 47 s with
      both waits returning. kubevirt/component.yaml § requires records it, and the gate's new
      DependencyViolations refuses the roster the other way round.
      ⚠ WHAT `--force-conflicts` IS DOING ON THE APPLY LINE, FOUND THE SAME WAY. The second apply of
      cdi-operator.yaml onto a cluster where CDI had run was refused — `conflict with "cdi-operator"
      using apiextensions.k8s.io/v1: .spec.versions` — because the operator adopts fields of its own
      definition after it starts. The installer owns the document; a re-run that fails forever on a
      healthy cluster is the wrong way round, so the flag is on and the reason is beside it.
      WHAT IS STILL A READING BY A PERSON: all of the above. The suite installs three helm rows; no
      test has yet run a `manifest:` row, and the lane that could now exists on this machine.
      ⚠ ONE THING THE FIX CANNOT BE IS SILENTLY GREEN, AND THAT WAS MEASURED TOO — AND RE-MEASURED ON
      2026-09-05 ON THE FORM THE SCRIPT ACTUALLY RUNS, BECAUSE THE FIRST MEASUREMENT WAS OF A
      DIFFERENT INVOCATION. What was recorded was `kubectl wait --for=condition=Established crd -l <a
      label nothing carries>` — a LABEL SELECTOR; install.sh runs `crd --all`. The `--all` form was
      then measured on an empty selection that an agentless k3s makes available, `kubectl wait
      --for=condition=Ready --timeout=5s node --all` on a server with no nodes: it prints "error: no
      matching resources found" and exits 1 too, so the guard does hold for the shipped line. It is
      also not what the shipped line rests on: a fresh k3s carries FOUR definitions before this bundle
      runs (addons.k3s.cattle.io, etcdsnapshotfiles.k3s.cattle.io, helmchartconfigs.helm.cattle.io,
      helmcharts.helm.cattle.io, counted on that cluster the same day) and the apply on the line above
      has already stored this component's own. A barrier built out of `kubectl wait` fails loudly when
      it selects nothing, which is the opposite of the defect
      `a-selector-that-matched-nothing-reported-success` records about this script's own selectors.
      ⚠ AND THE TRADEOFF THE ESTABLISHMENT WAIT BUYS, WHICH IS A FALSE FAILURE, RECORDED ON 2026-09-05
      BECAUSE THE #74 REVIEW WAS RIGHT THAT NOTHING RECORDED IT. `crd --all` is a CLUSTER-WIDE barrier
      and waits on definitions this bundle never installed, so any definition on the cluster that is
      not Established and never will be blocks the run: a name conflict is terminal — a definition
      whose plural, singular, kind or shortName collides with one already served is marked
      NamesAccepted=False and Established=False and does not recover, which is what a half-installed
      operator leaves behind — and a definition mid-deletion is the other case. MEASURED by applying
      two definitions in one group sharing the shortName `dup` onto the agentless k3s: the second goes
      Established=False/NamesAccepted=False, and `kubectl wait --for=condition=Established
      --timeout=20s crd --all` then burned the whole 20.09 s, exited 1, and reported "timed out" for
      THREE definitions that were Established=True, because one invocation shares one deadline across
      every object it walks. So the failure does not reliably name the definition that caused it.
      THE COUNT OF WHAT THAT CHANGED: the wait used to run only for a component declaring a
      `manifestExtra` — TWO of the six manifest rows, kubevirt and containerized-data-importer, the
      only two component.yaml files carrying that key — and now runs for all SIX, so one stuck
      definition breaks six of six rather than two of six. Under `set -e` the bill is one 5 m timeout
      charged to the first manifest row — containerized-data-importer in phase 30 since 2026-09-15 — which is a component that is fine; the
      bound on a run whose waits are slow but succeed went from 2 × 5 m to 6 × 5 m. ACCEPTED rather
      than fixed: the only narrower selector is the per-component definition list install.sh cannot
      spell without a `crds:` key nothing would check, which is the shape `imageDigest:` took and
      `images-are-not-pinned-by-digest` records. Closing it properly means the same declaration per
      component the Deployments half above already owes, so it is owed HERE and not as a second row.
