  - id: a-selector-that-matched-nothing-reported-success
    says: >
      ✅ FIXED ON 2026-09-03, RECORDED BECAUSE THE READING IS WORTH MORE THAN THE FIX.
      `install.sh --phase 99` printed one empty phase header and exited 0 under "Bundle applied",
      and `--verify --phase 99` printed "Every pin resolves" having resolved none. The cause was one
      line — `phases="$only_phase"` took the caller's word rather than filtering the roster — and the
      shape is the mirror image of the defect `verify_component`'s own comment already records: "a
      verifier that fails when there is nothing to verify is the same defect as one that passes when
      there is". This was the second half, and it is the more dangerous one, because its output reads
      like a green run and a typo in a phase number is a plausible thing to type.
      ⚠ THE USAGE TEXT WAS WRONG IN THE SAME AREA AND IS ALSO CORRECTED. It said `--phase` is "for
      repairing one row"; phases 30, 40 and 50 hold two, four and eight rows, so fourteen of the
      nineteen components could not be addressed individually at all. `--component <name>` now exists,
      is repeatable, filters the roster and never reorders it — the roster carries the order, and a
      flag that reordered it would be a second place the order is written.
      ⚠ THAT CORRECTION WAS HALF A CORRECTION AND #74 CAUGHT IT. The flag landed; the sentence did
      not. It went on reading "--phase and --component both skip that guarantee and are for repairing
      a row", which still calls a phase a row and still lumps the two flags together, and it still
      said "helm waits for it" of a barrier that six components never reach helm for. On 2026-09-05 it
      was rewritten to separate the two flags, to say what "installed" means for each install kind,
      and — the part that stops this happening a third time — to COUNT the phases out of bundle.yaml
      at `--help` time rather than assert a number. `roster()` moved above the argument loop for that,
      because bash resolves a function name when the call runs and `-h` is answered inside the loop.
      A number the usage text does not contain is a number that cannot go stale, which is the same
      rule this file's own header applies to versions.
