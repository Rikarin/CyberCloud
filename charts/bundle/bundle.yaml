      `manifestExtra`, which two of the six do, and even then it ran INSIDE the component, before its
      second document.
      ✅ THE DEFINITIONS HALF IS CLOSED ON 2026-09-05 AND IT WAS CLOSED BY RUNNING THE SIX RATHER THAN
      BY ARGUING ABOUT THEM, WHICH IS WHAT THE PARAGRAPH BELOW ASKED FOR. install.sh now runs that
      establishment wait after EVERY manifest apply, not only before a second document. It is per
      component rather than per phase on purpose: phase 40 holds four rows and the two providers admit
      against definitions the rows before them IN THE SAME PHASE installed, so a boundary-only wait
      would not have ordered the case this row calls out — and a wait after every manifest apply
      gives the boundary property as well.
      ⚠ THE REASON FOR THAT LAST CLAUSE WAS WRONG UNTIL THE #74 REVIEW AND IS CORRECTED HERE ON
      2026-09-05, BECAUSE IT IS THE WHOLE JUSTIFICATION FOR NOT DOING WHAT THE ISSUE ASKED. It read
      "because the last row of a phase has run it", which is a general property of the roster and is
      not one. Counted here by taking each phase's LAST row and reading its `install:` key: phases 30
      and 40 end on a `manifest:` row (containerized-data-importer, cluster-api-provider-kubevirt) and
      the other SIX of the EIGHT end on `helm` or `helm-archive` — kube-ovn, cert-manager,
      prometheus-operator-crds, openebs-localpv, strimzi-kafka-operator, victoria-metrics-operator.
      Phase 50's ONLY manifest row, rabbitmq-cluster-operator, is fifth of that phase's eight. The
      conclusion survives on a per-row argument instead: every manifest row waits right after its own
      apply, so no phase can END holding a definition install.sh applied and did not wait for, and the
      helm tail that closes those six phases carries helm's `--wait`.
      ⚠ WHAT WAS ACTUALLY RUN, BECAUSE THE PROVENANCE IS THE POINT OF THIS ROW. All six components
      were applied through install.sh itself, one `--component` run each, onto ONE
      `rancher/k3s:v1.35.7-k3s1` started with `--disable-agent` — an API server with NO KUBELET,
      because the host's Docker reports `Cgroup Version: 1` and 1.35's kubelet refuses to start on
      such a host. cert-manager's definitions were applied first, standing in for phase 15. Every one
      of the six exits 0, the two-document path was exercised for the first time
      (`kubevirt.kubevirt.io/kubevirt` and `cdi.cdi.kubevirt.io/cdi` both admitted after the wait),
      one `--phase 30` run put BOTH of that phase's components on in one go, and
      rabbitmq-cluster-operator went from 1.2 s to 4.7 s once the wait became unconditional, on a
      cluster holding thirty-six definitions. Those thirty-six are four k3s ships, six cert-manager's,
      and TWENTY-SIX from the six components themselves — cluster-api alone contributes seventeen.
      ⚠ WHAT IS STILL OWED IS THE DEPLOYMENTS HALF, AND THE RUN MADE IT SHARPER RATHER THAN SMALLER.
      "Established" says the API server will serve the kind; it says nothing about the operator, and a
      phase-40 provider whose controller has no pod fails exactly like one whose CRD is missing, only
      later. That wait is STILL a guess, for the same reason as before and now a narrower one: nothing
      scheduled a pod, so not one of these Deployments has ever started. What the run did settle is
      that the obvious spelling is WRONG. The six put EIGHT Deployments in EIGHT namespaces and NOT
      ONE namespace is the `<component>-system` install.sh computes — `kubevirt/virt-operator`,
      `cdi/cdi-operator`, `capi-system/capi-controller-manager`,
      `capi-kubeadm-bootstrap-system/capi-kubeadm-bootstrap-controller-manager`,
      `capi-kubeadm-control-plane-system/capi-kubeadm-control-plane-controller-manager`,
      `kamaji-system/capi-kamaji-controller-manager`, `capk-system/capk-controller-manager` and
      `rabbitmq-system/rabbitmq-cluster-operator`. cluster-api alone accounts for three of them, so
      "its Deployment" is not even singular. Closing this is a declaration per component that
      something reads — the shape `images:` took, and NOT the shape `imageDigest:` took, which
      `images-are-not-pinned-by-digest` records as a key nothing ever read — plus a run on a cluster
      that can schedule a pod.
      ⚠ ONE THING THE FIX CANNOT BE IS SILENTLY GREEN, AND THAT WAS MEASURED TOO — AND RE-MEASURED ON
      2026-09-05 ON THE FORM THE SCRIPT ACTUALLY RUNS, BECAUSE THE FIRST MEASUREMENT WAS OF A
      DIFFERENT INVOCATION. What was recorded was `kubectl wait --for=condition=Established crd -l <a
      label nothing carries>` — a LABEL SELECTOR; install.sh runs `crd --all`. The `--all` form was
      then measured on an empty selection that an agentless k3s makes available, `kubectl wait
      --for=condition=Ready --timeout=5s node --all` on a server with no nodes: it prints "error: no
      matching resources found" and exits 1 too, so the guard does hold for the shipped line. It is
      also not what the shipped line rests on: a fresh k3s carries FOUR definitions before this bundle
      runs (addons.k3s.cattle.io, etcdsnapshotfiles.k3s.cattle.io, helmchartconfigs.helm.cattle.io,
      helmcharts.helm.cattle.io, counted on that cluster the same day) and the apply on the line above
      has already stored this component's own. A barrier built out of `kubectl wait` fails loudly when
      it selects nothing, which is the opposite of the defect
      `a-selector-that-matched-nothing-reported-success` records about this script's own selectors.
      ⚠ AND THE TRADEOFF THE ESTABLISHMENT WAIT BUYS, WHICH IS A FALSE FAILURE, RECORDED ON 2026-09-05
      BECAUSE THE #74 REVIEW WAS RIGHT THAT NOTHING RECORDED IT. `crd --all` is a CLUSTER-WIDE barrier
      and waits on definitions this bundle never installed, so any definition on the cluster that is
      not Established and never will be blocks the run: a name conflict is terminal — a definition
      whose plural, singular, kind or shortName collides with one already served is marked
      NamesAccepted=False and Established=False and does not recover, which is what a half-installed
      operator leaves behind — and a definition mid-deletion is the other case. MEASURED by applying
      two definitions in one group sharing the shortName `dup` onto the agentless k3s: the second goes
      Established=False/NamesAccepted=False, and `kubectl wait --for=condition=Established
      --timeout=20s crd --all` then burned the whole 20.09 s, exited 1, and reported "timed out" for
      THREE definitions that were Established=True, because one invocation shares one deadline across
      every object it walks. So the failure does not reliably name the definition that caused it.
      THE COUNT OF WHAT THAT CHANGED: the wait used to run only for a component declaring a
      `manifestExtra` — TWO of the six manifest rows, kubevirt and containerized-data-importer, the
      only two component.yaml files carrying that key — and now runs for all SIX, so one stuck
      definition breaks six of six rather than two of six. Under `set -e` the bill is one 5 m timeout
      charged to the first manifest row, kubevirt in phase 30, which is a component that is fine; the
      bound on a run whose waits are slow but succeed went from 2 × 5 m to 6 × 5 m. ACCEPTED rather
      than fixed: the only narrower selector is the per-component definition list install.sh cannot
      spell without a `crds:` key nothing would check, which is the shape `imageDigest:` took and
      `images-are-not-pinned-by-digest` records. Closing it properly means the same declaration per
      component the Deployments half above already owes, so it is owed HERE and not as a second row.
  - id: a-selector-that-matched-nothing-reported-success
    says: >
      ✅ FIXED ON 2026-09-03, RECORDED BECAUSE THE READING IS WORTH MORE THAN THE FIX.
      `install.sh --phase 99` printed one empty phase header and exited 0 under "Bundle applied",
      and `--verify --phase 99` printed "Every pin resolves" having resolved none. The cause was one
      line — `phases="$only_phase"` took the caller's word rather than filtering the roster — and the
      shape is the mirror image of the defect `verify_component`'s own comment already records: "a
      verifier that fails when there is nothing to verify is the same defect as one that passes when
      there is". This was the second half, and it is the more dangerous one, because its output reads
      like a green run and a typo in a phase number is a plausible thing to type.
      ⚠ THE USAGE TEXT WAS WRONG IN THE SAME AREA AND IS ALSO CORRECTED. It said `--phase` is "for
      repairing one row"; phases 30, 40 and 50 hold two, four and eight rows, so fourteen of the
      nineteen components could not be addressed individually at all. `--component <name>` now exists,
      is repeatable, filters the roster and never reorders it — the roster carries the order, and a
      flag that reordered it would be a second place the order is written.
      ⚠ THAT CORRECTION WAS HALF A CORRECTION AND #74 CAUGHT IT. The flag landed; the sentence did
      not. It went on reading "--phase and --component both skip that guarantee and are for repairing
      a row", which still calls a phase a row and still lumps the two flags together, and it still
      said "helm waits for it" of a barrier that six components never reach helm for. On 2026-09-05 it
      was rewritten to separate the two flags, to say what "installed" means for each install kind,
      and — the part that stops this happening a third time — to COUNT the phases out of bundle.yaml
      at `--help` time rather than assert a number. `roster()` moved above the argument loop for that,
      because bash resolves a function name when the call runs and `-h` is answered inside the loop.
      A number the usage text does not contain is a number that cannot go stale, which is the same
      rule this file's own header applies to versions.
  - id: redis-operator-is-archived-and-its-chart-is-broken
    says: >
      ⚠ THE FOURTH SIGHTING OF ADR-010 CLAUSE 1'S AMENDMENT, AND THE FIRST WHERE THE OPERATOR EXISTS.
      github.com/spotahome/redis-operator reports `archived: true` and was last pushed 2024-07-01.
      Its newest chart release is `Chart-3.3.0`, 2023-08-17; its newest operator tag is `v1.3.0-rc1`,
      a PRE-RELEASE, and the last non-prerelease is v1.2.4 from 2022-12-28. Chart 3.3.0 pins
      `quay.io/spotahome/redis-operator:v1.3.0` and THAT TAG DOES NOT EXIST — quay.io serves
      v1.3.0-rc1 and nothing named v1.3.0. So the chart's default values produce a Deployment that
      cannot pull, on a project that cannot fix it. redis-operator/component.yaml pins the digest
      instead. What is owed is the DECISION, not the workaround: an archived operator behind
      CyberCloud.Cache/redis is a CVE with no upstream, and the alternatives are a maintained Valkey
      operator (hyperspike/valkey-operator, unaudited) or owning the reconciler. ADR-011 is satisfied
      either way — the licence is Apache-2.0 and the ENGINE image is already Valkey, which
      charts/managed/valkey/values.yaml pins deliberately because spotahome's own default is
      `redis:6.2.6-alpine`.
  - id: strimzi-1x-drops-the-group-the-chart-renders
    says: >
      ⚠ THE COVERAGE CHECK EXISTS BECAUSE OF THIS ROW AND WOULD HAVE FAILED ON IT. Strimzi 1.0.0
      removed `kafka.strimzi.io/v1beta2` from the Kafka and KafkaNodePool definitions; 1.1.0 serves
      `v1` alone, with `conversion: strategy: None`. charts/managed/kafka renders v1beta2, so this
      bundle pins 0.51.0 — the last release serving both, where v1beta2 is `served: true, storage:
      true, deprecated: true`. Closing it is a new api-version on CyberCloud.Messaging/kafkaClusters
      rendering `kafka.strimzi.io/v1`, THEN a bundle bump, in that order and not in one commit.
  - id: the-replicated-stage-is-not-installed
    says: >
      ✅ THIS ROW USED TO BE `no-csi` AND THE FIRST HALF OF IT IS CLOSED. charts/bundle/openebs-localpv
      installs a DEFAULT StorageClass, so a cluster built from this bundle provisions claims and every
      stateful managed service can converge. ⚠ THE OLD ROW ALSO UNDERSTATED ITS OWN SUBJECT BY NINE
      CHARTS AND IS CORRECTED HERE. It said "two managed charts carry a `@widget storageclass` row
      (charts/managed/postgres, charts/managed/seaweedfs)". Counted on 2026-08-20: ELEVEN charts name
      a storage class in a template — clickhouse, cloud-shell, ferretdb, harbor, mariadb, nats,
      opensearch, postgres, rabbitmq, seaweedfs, valkey — and eleven carry the `@widget storageclass`
      row, which is not the same eleven: kafka has the widget and renders no claim of its own, and
      cloud-shell renders a claim with no widget. charts/README.md and README.md carried the same
      two-chart sentence and are corrected with it.
      WHAT IS STILL OWED IS THE SECOND STAGE, AND IT IS A STAGE RATHER THAN A GAP. What is installed
      is single-replica and node-local: one copy, no DRBD, no kernel module, and a requested size that
      nothing enforces. A node loss loses that node's volumes. That is the right default — it is what
      makes this bundle installable on a cluster we did not build, which is docs/plan/09's phase 0 —
      and it is not what a paying customer's data sits on. The parts list for turning the replicated
      stage on is openebs-localpv/component.yaml § which stage is on, and the trigger is
      docs/plan/24 § The replicated-storage switch.
      ⚠ ONE PART OF THAT LIST IS A CONTRADICTION IN THIS REPOSITORY RATHER THAN A TASK. ADR-011's
      table marks LINSTOR (GPL-3.0) and DRBD (GPL-2.0) ✓ on their own terms, and
      build/Build.Bundle.cs § BundleLicenceAllowList is an ALLOW-list holding Apache-2.0,
      BSD-3-Clause, MIT and MPL-2.0 — so the gate fails a component the ADR permits. ADR-011
      § Enforcement's wording, "fails on any SSPL/BUSL/AGPL image outside an allow-list", is what
      makes that easy to read the wrong way round. Widening the list with the reason beside it is the
      sanctioned move and is deliberately not done in advance of the component that needs it.
  - id: one-volume-has-been-provisioned
    says: >
      ✅ THIS ROW USED TO BE `nothing-has-provisioned-a-volume` AND THAT SENTENCE IS NO LONGER TRUE.
      test/CyberCloud.Bundle.Cluster.Conformance § OpenEbsLocalPvOnAnEmptyCluster runs THIS
      DIRECTORY'S OWN `install.sh --phase 25` against a fresh k3s and then binds a claim through the
      class it installs. The four assertions this row used to ask for, all present, all firsthand:
      the claim names `storageClassName: openebs-hostpath` EXPLICITLY; a pod mounts it, writes a file
      and reads the bytes back, because WaitForFirstConsumer means a claim with no consumer proves
      nothing; the bound PersistentVolume's `spec.storageClassName` and provisioned-by annotation are
      read back OFF THE API SERVER rather than off the claim; and the default-class annotation is
      asserted to be on OUR class.
      ⚠ THE TRAP THIS ROW WARNED ABOUT WAS REAL AND WAS MEASURED RATHER THAN REASONED ABOUT. A
      throwaway probe on 2026-09-02, against the same fixture with NOTHING INSTALLED: the fresh k3s
      serves exactly one StorageClass — `local-path`, annotated default, and itself
      `volumeBindingMode: WaitForFirstConsumer` — and a BARE claim plus a pod reaches `Bound` with the
      pod `Succeeded`, on a PersistentVolume of class `local-path` at
      `/var/lib/rancher/k3s/storage/pvc-…`. So the obvious test would have been green over a cluster
      install.sh never touched, and — because k3s's own class already waits for a first consumer —
      even "there is a pod" would not have distinguished it. What does the distinguishing is the
      explicit name, the volume's class read back, and the volume's node-local path: openebs writes
      under `/var/openebs/local` and Rancher under `/var/lib/rancher/k3s/storage`, so the path is the
      one assertion that survives a mix-up in every other one, and it is asserted.
      ⚠ THE DEFAULT-CLASS ASSERTION IS THE ONE WITH A SILENT FAILURE BEHIND IT, AND IT IS
      SABOTAGE-VERIFIED. Deleting the `values:` block from openebs-localpv/component.yaml turns the
      run red twice — once in the daemonless companion, in a tenth of a second, on the manifest; and
      once on the cluster, on the missing annotation. Neither `helm` nor `install.sh` reports
      anything in that state: the install succeeds, the Deployment goes Ready, the class exists, and
      the eleven managed charts that leave `storageClassName` at `""` keep silently using k3s's
      provisioner. That is why the flag is asserted in two places and not one.
      ✅ ONE VOLUME WAS NOT THE SENTENCE THE DIRECTORY EXISTS FOR, AND THE SENTENCE IS NOW RUN. What
      is bound HERE is still a 64Mi directory by a test's own hand-written claim, and that has not
      changed. What has is that `an-operator-created-and-bound-the-claim` above does the other half:
      a charts/managed/postgres Cluster, applied against the definition charts/bundle/cloudnative-pg
      installed, whose claim CloudNativePG creates — controller ownerReference asserted — and binds
      through this component's class. The recommendation this paragraph carried, "a phase-50 operator,
      not a bigger storage test", was taken.
      ⚠ AND IT IS ONE COPY OF A DIRECTORY ON ONE NODE, WITH NO QUOTA. Binding a volume says nothing
      about surviving the loss of the node it is on — `the-replicated-stage-is-not-installed` is
      where that lives, and this row closing does not move it.
  - id: licence-scan-is-a-declaration-not-a-scan
    says: >
      ADR-011 § Enforcement asks for "a build gate [that] runs a licence scan over the chart set and
      the container images in the platform bundle". The Bundle gate checks a DECLARED SPDX id per
      component against an allow-list. That catches a component added under SSPL or BUSL by somebody
      who wrote the licence down honestly, and catches nothing else — it does not read a LICENSE file
      and does not open an image. build/Build.Licence.cs is still `NotImplementedYet`, and the
      distance between what it will do and what this gate does is the distance between a scan and an
      attestation.
      ⚠ AND ON 2026-09-03 THE ROW GREW A SECOND HALF THAT IS BIGGER THAN THE FIRST: THE SCAN AS
      ADR-011 WORDS IT CANNOT BE GREEN AGAINST THE ONLY ALLOW-LIST THIS REPOSITORY HAS. Measured
      against `mcr.microsoft.com/dotnet/aspnet:10.0`, which is the base image Build.Images publishes
      every platform host onto: /usr/share/doc holds 99 packaged components and 76 of them declare
      GPL or LGPL in their Debian copyright file — coreutils is `License: GPL-3+`. So a scan over
      image CONTENTS that failed on anything outside `BundleLicenceAllowList` would fail on our own
      runtime image before it reached a single bundle component.
      ⚠ THE FAULT IS ONE LIST BEING ASKED TWO QUESTIONS, NOT THE LIST AND NOT THE ADR. The list
      answers "may this platform OFFER this as a managed service", which is what SSPL and BUSL exist
      to prevent. A scan over layers answers "what is linked into this artefact", where GPL and LGPL
      are the ordinary state of every Linux base image and imply nothing about offering anything.
      That is the same confusion `the-replicated-stage-is-not-installed` records from the other end,
      and it is ISSUE #18's decision — deliberately not taken here, because widening the existing
      list to make the target implementable would answer #18 by making the list stop answering its
      own question. build/Build.Licence.cs now carries the measurement and stays unimplemented on
      purpose.
  - id: images-are-not-pinned-by-digest
    says: >
      ⚠ THE FIRST SENTENCE OF THIS ROW WAS WRONG AND IS CORRECTED RATHER THAN QUIETLY EDITED. It read
      "Every component but redis-operator installs at its upstream's own default image, which is a
      tag rather than a digest", which reads as though redis-operator were the one component pinned
      by digest. It was not. It passed `--set image.tag=v1.3.0-rc1` — a TAG — and recorded an
      `imageDigest:` beside it whose own comment claimed `install.sh --verify` compared it. NOTHING
      READ THAT KEY: `verify_component` reads install, repo, chart, version, archive, manifest and
      manifestExtra and has never read a digest. So the true count of images pinned or checked by
      digest was ZERO, of nineteen components.
      ✅ WHAT LANDED ON 2026-09-03 IS THE RECORD AND THE CHECK, WHICH IS THE HALF THAT IS OURS TO
      BUILD. Every component now carries an `images:` block naming every container image its pinned
      artefact renders, each with the digest its registry served — THIRTY-TWO images across
      eighteen components, prometheus-operator-crds declaring in prose that it renders none.
      charts/bundle/images.sh re-renders each component (applying the same `values:` overrides
      install.sh does, without which redis-operator resolves the chart's broken default), extracts
      the images, resolves each tag through the OCI distribution API with curl alone, and compares.
      Sabotage-verified both ways: a moved digest and a recorded image nothing renders each turn it
      red, with different messages. The Bundle gate keeps the record readable — shape, no duplicates,
      and the prose escape — and deliberately resolves nothing, because a gate that makes thirty
      registry calls goes red when a network is slow.
      ⚠ WHAT IS STILL OWED, AND IT IS NOT THE SAME ITEM ANY MORE. (1) The record is a RECORD, not a
      pin: the tag is still what reaches the kubelet, so this detects a moved tag rather than
      preventing one. Preventing it means a values override per chart, and several charts have no
      digest key at all — redis-operator's component.yaml documents that case firsthand. ⚠ AND THE
      TWO CHARTS THAT DID TURN OUT TO HAVE AN IMAGE VALUES PATH, on 2026-09-05, DO NOT MAKE THIS ITEM
      SMALLER: clickhouse-operator's `crdHook.image.*` and kamaji's `cfssl.image.tag` both compose
      `repository:tag` in the template and can therefore carry a VERSION and never a digest. What
      those two closed is `a-tag-that-names-no-version-is-not-a-pin`, which is a different row. Zero
      of nineteen components is still the count of images pinned by digest. (2) A
      MIRROR MAP, still unmodelled, the same shape charts/managed/harbor's `imageRegistry` escape
      hatch takes for a single service. (3) The `manifest:` components under-report: kubevirt and
      containerized-data-importer record their OPERATOR image, and the operator then pulls
      virt-api, virt-controller, virt-handler and virt-launcher by names that appear nowhere in the
      applied document. (4) Nothing runs images.sh on a schedule, so a tag that moves is caught when
      somebody asks.
  - id: a-tag-that-names-no-version-is-not-a-pin
    says: >
      ⚠ THIS ROW WAS CALLED `two-images-in-this-bundle-are-latest` AND THE NUMBER IN ITS NAME IS NOW
      ZERO. Renamed rather than edited in place, for the reason
      `most-of-the-roster-has-never-been-installed` carries in its own text — that row shed a count
      from its name after three successive names had carried one that was wrong by the time somebody
      quoted it. A number in a name is a claim nothing checks. Both sightings closed on 2026-09-05 —
      issue #75 — and the reading that produced them is kept below, because the argument rather than
      the count is the part worth having.
      ⚠ WHAT WAS FOUND, BY THE FIRST RUN OF images.sh ON 2026-09-03. A tag that names a version is a
      weak pin; a tag that names no version is not a pin at all. charts/bundle/clickhouse-operator
      rendered `bitnami/kubectl:latest` and charts/bundle/kamaji rendered `cfssl/cfssl:latest`.
      `bitnami/kubectl` was the sharper of the two: on 2026-09-03 `bitnami/kubectl:latest` resolved, a
      VERSIONED tag on the same repository (`bitnami/kubectl:1.34.1`) answered 404, and
      `bitnamilegacy/kubectl:latest` resolved — the versioned catalogue had moved namespace and what
      this bundle depended on was the one tag left behind in the old one.
      ⚠ AND IT MOVED, IN TWO DAYS, WHICH IS THE MEASUREMENT THAT DECIDED THE REST. Re-resolving ALL
      THIRTY-TWO recorded references through the OCI distribution API on 2026-09-05 found thirty-one
      serving the digest their component.yaml records and exactly one moved: `bitnami/kubectl:latest`,
      recorded sha256:e0fcb25c… on 2026-09-03 and serving sha256:b29d8c16… on 2026-09-05. The row
      that predicted "images.sh will go red the next time either moves — which for `latest` is a
      question of when" was answered by the calendar in forty-eight hours.
      ✅ BOTH ARE VERSIONED NOW, THROUGH UPSTREAM'S OWN VALUES KEYS AND NOT THROUGH A FORK.
      clickhouse-operator sets `crdHook.image.repository: clastix/kubectl` and
      `crdHook.image.tag: v1.36.4`; kamaji sets `cfssl.image.tag: v1.6.5`. Each component.yaml
      carries the full argument, the alternatives that were checked and rejected, and what would make
      the choice stale. Two facts are worth repeating here because they are the load-bearing ones.
      (a) `cfssl/cfssl:v1.6.5` and `cfssl/cfssl:latest` resolve to the SAME DIGEST on 2026-09-05, so
      that half changed a label and not a byte. (b) `bitnami/kubectl` has no versioned tag left to
      pin to — on 2026-09-05 the repository carries exactly one human-readable tag, `latest`, beside
      cosign artefacts — and the bytes it now serves report `Client Version: v1.37.0`, two minors
      ahead of this platform's own `rancher/k3s:v1.35.7-k3s1` and so outside kubectl's supported ±1
      skew. Staying was not the cheap option; it was the broken one.
      ⚠ THE PREVIOUS POSITION — "nothing is overridden here, because an override that pins somebody
      else's helper image to a digest we chose is a fork of their chart with no note saying so" — WAS
      RIGHT ABOUT DIGESTS AND TOO WIDE ABOUT TAGS, and it is corrected rather than quietly dropped. A
      digest we picked would be a fork: it would freeze bytes upstream never chose. A VERSIONED TAG
      passed through a values key upstream published, replacing a tag upstream left version-less, is
      upstream's own escape hatch used for its own purpose — and neither key can carry a digest
      anyway, because both templates compose `repository:tag` and nothing else.
      ⚠ THE GATE IS WHAT KEEPS IT AT ZERO. build/Build.Bundle.cs § ImagesViolations now fails the
      build on any `images:` entry whose tag is `latest`, which is a rule that can exist only because
      the count is zero: it was written after the two were closed, not before, and it is why nobody
      has to re-count. There is deliberately NO prose escape on it, unlike `rendersNoWorkloadImages:`
      — a component that genuinely cannot avoid `latest` is a decision worth a diff in the gate with
      the argument beside it, which is exactly what this row is.
      ⚠ A THIRD SIGHTING IS STILL DELIBERATELY NOT COUNTED, AND CHECKING IT IS THE POINT. The Kamaji
      control-plane provider's CRD carries `registry.k8s.io/kas-network-proxy/proxy-agent` and
      `-server` with NO TAG — which means `latest` — as `default:` values inside the KamajiControlPlane
      OpenAPI schema. images.sh drops CustomResourceDefinition documents and so does not report them,
      because they are not images this bundle pulls: nothing runs until a tenant creates a control
      plane that asks for konnectivity. It is a real hazard for charts/managed/kubernetes and it
      belongs to that chart's conformance.yaml, not to this row. Counting it would have made the
      bundle's own install look worse than it is, which is the mirror of the failure this repository
      keeps finding. The gate above cannot see it either, for the same reason and by the same
      exclusion.
      ⚠ WHAT IS STILL OWED HERE, AND IT IS THE ETCD HALF. The two etcd references this row recorded
      as "two versions of the same component in one chart" are not that, and the chart was read on
      2026-09-05 rather than guessed at: templates/etcd_sts.yaml renders the etcd SERVER from
      `.Values.etcd.image.tag`, pinned at v3.5.6, and templates/etcd_job_postinstall.yaml line 51
      renders an etcdctl CLIENT as the LITERAL string `quay.io/coreos/etcd:v3.5.1` — a post-install
      Job that adds the `root` user and enables auth. One server, one client four patches older,
      same 3.5 line, same v3 API, which is why nothing has failed. It stays owed because the client
      is a 2021 build pulled `imagePullPolicy: Always` on every install and there is NO values key
      for it: closing it is an upstream change or a fork, and this directory does not fork charts.
      ⚠ AND ONE ENTRY OF THE THIRTY-TWO IS A PROPERTY OF THE RENDERER RATHER THAN OF THE BUNDLE,
      found while reading the etcd jobs. kamaji renders `clastix/kubectl:<tag>` where the tag is
      `v<Capabilities.KubeVersion.Major>.<Minor>` — so the recorded `v1.36` is whatever Kubernetes
      version the helm that ran images.sh reported, and against this platform's own
      `rancher/k3s:v1.35.7-k3s1` the same chart renders `clastix/kubectl:v1.35`. Making the record
      match what a cluster pulls means `helm template --kube-version` inside images.sh, which changes
      what EVERY component renders; it belongs with a re-record of all thirty-two and not with the
      edit that found it.
