# Bundle component — charts/bundle/README.md § What a component owes.
#
# Core Cluster API, plus the kubeadm bootstrap and kubeadm control-plane providers, which
# `cluster-api-components.yaml` ships as one document. charts/managed/kubernetes-agentpool renders a
# `bootstrap.cluster.x-k8s.io/v1beta2` KubeadmConfigTemplate, so the bootstrap provider is not
# optional here even though the platform's control planes are Kamaji's rather than kubeadm's.

component: cluster-api
phase: 40
licence: Apache-2.0
licenceEvidence: https://raw.githubusercontent.com/kubernetes-sigs/cluster-api/v1.14.0/LICENSE
install: manifest
release: v1.14.0
manifest: https://github.com/kubernetes-sigs/cluster-api/releases/download/v1.14.0/cluster-api-components.yaml

source: https://api.github.com/repos/kubernetes-sigs/cluster-api/releases/latest
checked: 2026-08-19

# ⚠ EVERY LINE HERE WAS READ OFF THE DOWNLOADED DOCUMENT'S CustomResourceDefinitions, AND THE
# DISTINCTION MATTERS FOR THIS COMPONENT MORE THAN FOR ANY OTHER. v1.14.0 serves v1beta1 AND v1beta2
# side by side for every core kind. charts/managed/kubernetes and charts/managed/kubernetes-agentpool
# render v1beta2, which is the storage version; src/Providers/CyberCloud.Providers.ContainerService
# declares the same. A reader who assumed "latest release, therefore v1beta1 is gone" would have been
# wrong today and will be right at some release, which is exactly why the coverage check reads the
# document instead of the assumption.
serves:
  - cluster.x-k8s.io/v1beta2
  - bootstrap.cluster.x-k8s.io/v1beta2
  - controlplane.cluster.x-k8s.io/v1beta2

requiredBy:
  - charts/managed/kubernetes
  - charts/managed/kubernetes-agentpool
  - charts/bundle/kamaji-control-plane-provider
  - charts/bundle/cluster-api-provider-kubevirt

# The rows install.sh must have serving before this one — read by the Bundle gate, which checks
# the roster reaches each earlier and that its `requiredBy:` names this component back. The three
# webhook Deployments mount Secrets only a cert-manager Certificate produces (the notes below).
requires:
  - charts/bundle/cert-manager

# What "installed" means for this component, read by install.sh after the apply: three Deployments
# in three namespaces, because `cluster-api-components.yaml` ships core, kubeadm-bootstrap and
# kubeadm-control-plane as one document. None of the three namespaces is the `<component>-system`
# install.sh computes for a helm row, which is why the names are written here and not derived.
waitFor:
  - "deployment/capi-controller-manager -n capi-system --for=condition=Available"
  - "deployment/capi-kubeadm-bootstrap-controller-manager -n capi-kubeadm-bootstrap-system --for=condition=Available"
  - "deployment/capi-kubeadm-control-plane-controller-manager -n capi-kubeadm-control-plane-system --for=condition=Available"

# Every container image this component's pinned artefact renders, with the digest its registry served
# on 2026-09-03. Regenerate with `./charts/bundle/images.sh --resolve`; check with `images.sh`.
#
# ⚠ THIS IS A RECORD, NOT A PIN, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. The tag is what the
# chart passes to the kubelet; the digest beside it is what that tag resolved to when somebody looked.
# A tag is mutable, so an upstream rebuild moves these bytes without moving any version in this
# directory — and `images.sh` is what turns that from invisible into a red run.
images:
  - registry.k8s.io/cluster-api/cluster-api-controller:v1.14.0@sha256:4f57cf35b7de52e568eb85295f2a505268f29f1c7b76e7b12ce7cf6d2034f8f4
  - registry.k8s.io/cluster-api/kubeadm-bootstrap-controller:v1.14.0@sha256:3209310007d8f015545f5cd621b110cc1af2bcf2538d91bbac81aaf989451102
  - registry.k8s.io/cluster-api/kubeadm-control-plane-controller:v1.14.0@sha256:bab6f68839cef892102427f03599dd4d7b433bcae0e4794724ba80253fb8aa98

notes: >
  ⚠ `clusterctl init` is the documented install path and is deliberately not the one taken. It
  resolves provider versions from a remote contract at install time, which is a pin this directory
  cannot see and cannot diff — the same objection ADR-010 raises to a vendored chart with no
  provenance. Applying the released component document pins the same bits and leaves the version in a
  file a reviewer reads.
  ⚠ AND THE ARGUMENT WAS HALF AN ARGUMENT UNTIL THE FIRST RUN WITH A KUBELET (issue #2, 2026-09-15),
  BECAUSE clusterctl DOES ONE MORE THING BEFORE IT APPLIES. The released document is a TEMPLATE:
  `cluster-api-components.yaml` v1.14.0 carries thirteen distinct `${VAR:=default}` variables in its
  container args — `--insecure-diagnostics=${CAPI_INSECURE_DIAGNOSTICS:=false}`, a feature-gate list
  of nine — and `kubectl apply` handed them to the binary verbatim. All three controllers went
  CrashLoopBackOff on `strconv.ParseBool: parsing "${CAPI_INSECURE_DIAGNOSTICS:=false}": invalid
  syntax`, and so did kamaji-control-plane-provider's on the same shape. install.sh now performs the
  substitution clusterctl would have — charts/bundle/substitute.sh, in awk, from the document's OWN
  defaults, with the environment able to override exactly as `CLUSTER_TOPOLOGY=true clusterctl init`
  can — and the pinning argument survives intact: every one of the thirteen carries a default, so the
  applied bytes are still a function of this file's `release:` and of nothing remote. A variable
  with no default and no value is refused by name, which is also what clusterctl does. Re-applied
  through install.sh on that day: all three Deployments Available in 1 m 17 s including the wait.
  ⚠ ONE THING THE COMPONENT DOCUMENT DOES THAT clusterctl WOULD HAVE DONE FOR YOU: it declares
  `cert-manager` annotations on its webhook configurations. Cluster API's webhooks are served with
  cert-manager-issued certificates, so this component is inert on a cluster with no cert-manager —
  which is why charts/bundle/cert-manager is phase 15 and this one is phase 40.
  ⚠ THE SENTENCE ABOVE ONCE READ "and this bundle does not install cert-manager. See README.md
  § What this bundle does not install." IT WAS FALSE FROM THE COMMIT THAT ADDED cert-manager: the
  component exists, bundle.yaml gives it phase 15, and that README section lists a CSI, an ingress
  controller and OpenBao — never cert-manager. A file pointing at a section that does not say what it
  is cited for is the shape of drift the docs/plan citation gate exists to catch one level up, and
  nothing gates a `notes:` block. Corrected 2026-08-20 while task #119 installed that component.
