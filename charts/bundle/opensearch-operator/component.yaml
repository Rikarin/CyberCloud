# Bundle component — charts/bundle/README.md § What a component owes.
#
# ⚠ THE SECOND PIN HERE THAT IS NOT THE NEWEST CHART, AND FOR A DIFFERENT REASON FROM STRIMZI'S.
# The repository index serves chart 3.0.2, and chart 3.0.2's `appVersion` is `3.0.0-alpha`. So are
# 3.0.1, 3.0.0, 2.8.4 and 2.8.3 — five chart releases all pointing at the same pre-release operator.
# The newest OPERATOR release is v2.8.0 (github.com/opensearch-project/opensearch-k8s-operator,
# 2025-06-25), and three charts name it as their appVersion: 2.8.0, 2.8.1 and 2.8.2.
#
# Pinning 3.0.2 would put an alpha controller in front of every tenant's search service. The
# alternative was checked rather than assumed to be necessary: every chart from 2.8.0 to 3.0.2 ships
# the `opensearch.opster.io` definitions this platform renders, so nothing is lost by taking the
# older one.
#
# ⚠ AND OF THE THREE CHARTS THAT NAME 2.8.0, ONLY 2.8.0 ITSELF AGREES WITH IT — FOUND BY INSTALLING
# 2.8.2 ON THE FIRST REAL RUN OF THE ROSTER (issue #2, 2026-09-15), NOT BY READING. Charts 2.8.1 and
# 2.8.2 (2026-02-17 and 2026-02-25) are a rewrite of the chart for the 3.0 operator — renamed
# templates, a ValidatingWebhookConfiguration, a cert-manager Issuer and Certificate for it — with
# the appVersion left at 2.8.0. Their Deployment renders `--enable-webhooks={{ .Values.webhook.enabled }}`
# and `--webhook-port={{ .Values.webhook.port }}` UNCONDITIONALLY, and the 2.8.0 binary knows
# neither: `flag provided but not defined: -enable-webhooks`, CrashLoopBackOff, and `helm --wait`
# sits for the full timeout (11 m 31 s measured) before `set -e` aborts the phase and takes the four
# components after it with it. `webhook.enabled: false` is NOT a fix — it removes the first flag and
# leaves the second, which the same binary refuses next. Chart 2.8.0 was cut on the operator's own
# release day and its templates carry neither flag; it is the pair that agrees.
#
# ⚠ WHAT THAT COSTS, AND WHY THERE IS A `values:` BLOCK. Chart 2.8.0 renders a second container,
# `kube-rbac-proxy`, from `gcr.io/kubebuilder/kube-rbac-proxy:v0.15.0` — and on 2026-09-15 that
# repository serves NO TAGS AT ALL (`/v2/kubebuilder/kube-rbac-proxy/tags/list` answers
# `"tags":[]`): kubebuilder retired its copy of the image, so the chart's own default cannot pull.
# The project's own registry, quay.io/brancz/kube-rbac-proxy, serves the identical version, so the
# override below is a versioned tag through the chart's own `kubeRbacProxy.image.repository` key —
# the same shape as clickhouse-operator's `crdHook.image.*`, and argued the same way in
# bundle.yaml § owed, `a-tag-that-names-no-version-is-not-a-pin`: upstream's escape hatch, not a fork.

component: opensearch-operator
phase: 50
licence: Apache-2.0
licenceEvidence: https://raw.githubusercontent.com/opensearch-project/opensearch-k8s-operator/v2.8.0/LICENSE
install: helm
repo: https://opensearch-project.github.io/opensearch-k8s-operator
chart: opensearch-operator
version: 2.8.0
appVersion: 2.8.0

source: https://opensearch-project.github.io/opensearch-k8s-operator/index.yaml
checked: 2026-09-15

# ⚠ THE DEPRECATED GROUP, DELIBERATELY, AND THE PIN IS WHAT MAKES THAT SAFE.
# charts/managed/opensearch/SOURCE: "opensearch.opster.io … is deprecated and will be removed in a
# future release. Please migrate to opensearch.org/v1". Chart 2.8.0 ships `opensearch.opster.io`
# ALONE (ten definitions under files/, counted 2026-09-15); 2.8.2 and 3.0.2 ship both groups side by
# side. The chart renders the deprecated one because it is "the group a released operator in
# charts/bundle/ serves", and this file is where that sentence becomes a fact. The day
# charts/managed/opensearch moves to `opensearch.org/v1` this pin has to move with it — in that
# order, per bundle.yaml § The ordering rule — and 2.8.0 is the last chart where that is a choice
# rather than a given.
serves:
  - opensearch.opster.io/v1

requiredBy:
  - charts/managed/opensearch

# Chart 2.8.0's helper image, re-homed. See the header: the chart's default registry serves no tags.
values:
  kubeRbacProxy.image.repository: quay.io/brancz/kube-rbac-proxy

# Every container image this component's pinned artefact renders, with the digest its registry served
# on 2026-09-15. Regenerate with `./charts/bundle/images.sh --resolve`; check with `images.sh`.
#
# ⚠ THIS IS A RECORD, NOT A PIN, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. The tag is what the
# chart passes to the kubelet; the digest beside it is what that tag resolved to when somebody looked.
# A tag is mutable, so an upstream rebuild moves these bytes without moving any version in this
# directory — and `images.sh` is what turns that from invisible into a red run.
images:
  - opensearchproject/opensearch-operator:2.8.0@sha256:ad86464ea5b1661ea25294058e78b3697286cc6b742df7a543fd96d2de0bc61a
  - quay.io/brancz/kube-rbac-proxy:v0.15.0@sha256:2c7b120590cbe9f634f5099f2cbb91d0b668569023a81505ca124a5c437e7663

notes: >
  ⚠ WHAT THIS PIN OWES charts/managed/opensearch/conformance.yaml § owed, `api-group-is-deprecated`.
  That item's closing move is "a new api-version on the resource type plus a charts/bundle/ bump, in
  that order, and the two must not be done in one commit". The bump it means is to a release that no
  longer serves `opensearch.opster.io` — which no release does yet, so the deadline is upstream's and
  not this platform's. When it arrives, the coverage check in the Bundle gate is what turns the
  wrong-order commit red.
  ⚠ `manager.watchNamespace` is empty in 2.8.0's values.yaml and the chart's own comment says the
  default is to watch all namespaces. Checked.
  ⚠ INSTALLED ON 2026-09-15 THROUGH install.sh AGAINST A `rancher/k3s:v1.35.7-k3s1` WITH A KUBELET,
  after the 2.8.2 release above was `helm uninstall`ed, in 29 s:
  `opensearch-operator-system/opensearch-operator-controller-manager`
  1/1 with both containers, and the ten `opensearch.opster.io` definitions Established. That run is
  the measurement behind every sentence in the header.
