# Bundle component — charts/bundle/README.md § What a component owes.
#
# ⚠ NOT ON THE STARTING LIST TASK #109 GAVE, AND IT IS A HARD PREREQUISITE FOR TWO PHASE-40 ROWS.
# It was found by reading the components documents rather than the operators' documentation:
#
#   * cluster-api-components.yaml v1.14.0 contains `cert-manager.io/v1` Certificate and Issuer
#     objects, and each of its three webhook Deployments mounts a Secret — `capi-webhook-service-cert`
#     and its siblings — that only cert-manager creates. Applying that document to a cluster with no
#     cert-manager leaves three Deployments whose pods never start, and every Cluster API webhook then
#     fails closed: `charts/managed/kubernetes` applies cleanly and the Cluster is admitted by nothing.
#   * The Kamaji chart ships `templates/certmanager_issuer.yaml` and
#     `templates/certmanager_certificate.yaml` and wires its validating and mutating webhook
#     configurations to them.
#
# cluster-api-provider-kubevirt's document carries cert-manager annotations too. The Kamaji CONTROL
# PLANE PROVIDER's does not — it was checked separately rather than assumed from its sibling.
#
# ⚠ ALL OF THAT WAS READ OFF DOCUMENTS AND ON 2026-09-05 IT WAS READ OFF AN API SERVER INSTEAD, WHICH
# CONFIRMED IT AND ADDED A FOURTH DEPENDANT IN A PHASE THE HEADING ABOVE DOES NOT MENTION. Applying
# all six `manifest:` components to one k3s and listing what they created: eleven cert-manager objects
# exist afterwards, and FIVE Deployments mount a Secret only a `Certificate` produces —
# capi-system/capi-controller-manager, capi-kubeadm-bootstrap-system/…-controller-manager and
# capi-kubeadm-control-plane-system/…-controller-manager (charts/bundle/cluster-api, which is the
# "three webhook Deployments" above, now counted rather than read), capk-system/capk-controller-manager,
# and rabbitmq-system/rabbitmq-cluster-operator — WHICH IS PHASE 50 AND WAS NOT ON THIS LIST.
# kamaji-control-plane-provider creates none, exactly as the paragraph above says it would.
# The rabbitmq row was also run WITHOUT cert-manager: `kubectl apply` places thirteen of that
# document's sixteen objects, refuses the three cert-manager ones with "ensure CRDs are installed
# first", and install.sh exits 1. So that dependency fails loudly rather than silently, which is not
# true of the Cluster API ones — theirs is a Deployment whose pod never starts.

component: cert-manager
phase: 15
licence: Apache-2.0
install: helm
repo: https://charts.jetstack.io
chart: cert-manager
version: v1.21.1
appVersion: v1.21.1

source: https://charts.jetstack.io/index.yaml
checked: 2026-08-19

serves:
  - cert-manager.io/v1

requiredBy:
  - charts/bundle/cluster-api
  - charts/bundle/cluster-api-provider-kubevirt
  - charts/bundle/kamaji
  # ⚠ The fourth, added 2026-09-05 after the install above rather than after a reading. It is also
  # the first entry here that is not in phase 40, which is why the header's "two phase-40 rows" no
  # longer describes this list.
  - charts/bundle/rabbitmq-cluster-operator

# ⚠ THE CHART DOES NOT INSTALL ITS OWN DEFINITIONS UNLESS ASKED. values.yaml ships `crds.enabled:
# false`, so `helm install cert-manager jetstack/cert-manager` with default values produces a
# controller and no Certificate kind — and the first thing that notices is the Cluster API webhook,
# three phases later, with an error that names a Secret. install.sh passes the flag; it is recorded
# here because a values default is the kind of fact that changes between minor releases.
#
# ⚠ MEASURED RATHER THAN REASONED, 2026-08-20, BY DELETING THE TWO LINES BELOW AND RUNNING THE
# INSTALL. Without them `helm upgrade --install` does not quietly produce a controller with no
# Certificate kind — it FAILS, after about six minutes, with `failed post-install: resource
# Job/cert-manager-system/cert-manager-startupapicheck not ready. status: Failed`. The chart ships a
# post-install hook Job that creates a SelfSubjectAccessReview against the API it just installed, so
# the chart itself catches the missing definitions. That makes the flag's absence loud rather than
# silent, which is better than this note assumed, and it is also the second reason `--wait` means
# "serving": the hook cannot pass until the webhook admits. See
# test/CyberCloud.Bundle.Cluster.Conformance.
values:
  crds.enabled: "true"

# Every container image this component's pinned artefact renders, with the digest its registry served
# on 2026-09-03. Regenerate with `./charts/bundle/images.sh --resolve`; check with `images.sh`.
#
# ⚠ THIS IS A RECORD, NOT A PIN, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. The tag is what the
# chart passes to the kubelet; the digest beside it is what that tag resolved to when somebody looked.
# A tag is mutable, so an upstream rebuild moves these bytes without moving any version in this
# directory — and `images.sh` is what turns that from invisible into a red run.
images:
  - quay.io/jetstack/cert-manager-cainjector:v1.21.1@sha256:ccf6b919ec0500745a47a910118f834f9636d0aac1ff221245cd2557ed8c7c98
  - quay.io/jetstack/cert-manager-controller:v1.21.1@sha256:416a2d76870d996460e62bd7f521bf14fa017be9e3e904aab92163a331fcb61a
  - quay.io/jetstack/cert-manager-startupapicheck:v1.21.1@sha256:d8ab6416e6e7303a86fa0a8daa82c94a8001f21c9d78eb2e7db20534e5d07ae8
  - quay.io/jetstack/cert-manager-webhook:v1.21.1@sha256:d8b3961b51c8c7320633f8208dc46bf88aa13804d0f7cbe48a096b2c523cee42

notes: >
  Phase 15 rather than 10: cert-manager's controller and its webhook must reach each other, so it
  needs the CNI. Phase 15 rather than 40: cert-manager's own webhook has to be Ready before anything
  in phase 40 creates a Certificate, and `helm install --wait` is the barrier that makes "installed"
  mean "serving".
  ⚠ THIS WAS "THE ONE COMPONENT IN THE BUNDLE THAT HAS BEEN INSTALLED ONTO A CLUSTER BY A TEST" AND
  IT IS NOW ONE OF THREE — openebs-localpv and cloudnative-pg are the others, and
  bundle.yaml § owed, `most-of-the-roster-has-never-been-installed`, is the row that keeps that count
  rather than this file. Corrected 2026-09-05 while #74 was being read; the sentence had been false
  since 2026-09-03.
  test/CyberCloud.Bundle.Cluster.Conformance runs `install.sh --phase 15` against a fresh k3s and
  asserts that `cert-manager.io/v1` is served afterwards and that a self-signed Certificate reaches
  Ready with a parseable certificate in the Secret it names. The namespace that produces is
  `cert-manager-system`, from install.sh's `<component>-system` rule, and NOT the upstream default
  `cert-manager`; nothing in this bundle depends on the name, because a cert-manager annotation names
  an Issuer rather than a namespace, but a values file copied from upstream documentation will.
