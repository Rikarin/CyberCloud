# Bundle component — charts/bundle/README.md § What a component owes.
#
# Altinity's ClickHouse operator. ⚠ ONE COMPONENT, TWO API GROUPS — charts/managed/clickhouse renders
# a `clickhouse.altinity.com/v1` ClickHouseInstallation and the
# `clickhouse-keeper.altinity.com/v1` ClickHouseKeeperInstallation it names, and one operator serves
# both. The starting list in Task #109 named only the first, which is why `serves:` is read off the
# definitions rather than off a brief.

component: clickhouse-operator
phase: 50
licence: Apache-2.0

# ⚠ NOT A CHART REPOSITORY. Altinity publishes the packaged chart as a GitHub release asset, so this
# is `helm install <name> <url-to-tgz>` rather than `helm repo add`. The pin is therefore the release
# TAG as well as the chart version, and the two happen to agree at 0.27.3.
install: helm-archive
archive: https://github.com/Altinity/clickhouse-operator/releases/download/release-0.27.3/altinity-clickhouse-operator-0.27.3.tgz
release: release-0.27.3
chart: altinity-clickhouse-operator
version: 0.27.3
appVersion: 0.27.3

source: https://api.github.com/repos/Altinity/clickhouse-operator/releases/latest
checked: 2026-08-19

# Read off crds/CustomResourceDefinition-clickhouseinstallations… and
# …-clickhousekeeperinstallations…, both `served: true, storage: true` at v1.
serves:
  - clickhouse.altinity.com/v1
  - clickhouse-keeper.altinity.com/v1

requiredBy:
  - charts/managed/clickhouse

# ⚠ THE SECOND VALUES DEFAULT IN THIS BUNDLE THAT WOULD MAKE AN OPERATOR IGNORE EVERY TENANT, AND ITS
# WORDING IS WHY IT WAS CAUGHT. `watchNamespaces: []` does NOT mean "all"; the chart's own comment
# says "If empty, the operator watches only its own namespace (or all namespaces when running in
# kube-system). Use [\".*\"] to watch all namespaces." Entries are REGEXPS, not names. So the empty
# default produces an operator that installs cleanly, reports Ready, and reconciles nothing a tenant
# creates. Of the nine data-service operators here, this and Strimzi are the two whose defaults had
# to be overridden; the other seven watch every namespace out of the box and were each checked rather
# than assumed.
values:
  watchNamespaces[0]: ".*"

# Every container image this component's pinned artefact renders, with the digest its registry served
# on 2026-09-03. Regenerate with `./charts/bundle/images.sh --resolve`; check with `images.sh`.
#
# ⚠ THIS IS A RECORD, NOT A PIN, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. The tag is what the
# chart passes to the kubelet; the digest beside it is what that tag resolved to when somebody looked.
# A tag is mutable, so an upstream rebuild moves these bytes without moving any version in this
# directory — and `images.sh` is what turns that from invisible into a red run.
images:
  - altinity/clickhouse-operator:0.27.3@sha256:0520bfb8015dcb270f0600f542cad117e637cdcdc791bfd71b7964ff067d1589
  - altinity/metrics-exporter:0.27.3@sha256:1e7c1d8167aad902513be37dcf7e439cf8a2564779a23008b8c81d879e71fb60
  - bitnami/kubectl:latest@sha256:e0fcb25c485a8ad0665d0dd4b4a67cefb6baee32b0e3b19f54f1b468c49c1ed5

notes: >
  charts/managed/clickhouse/values.yaml carries twelve `@internal` rows where its siblings carry ten
  or eleven, and charts/README.md attributes two of the extras to this component's shape: it is the
  first service in the catalogue rendering two custom resources, so it has two image escape hatches
  where every earlier chart has one.
