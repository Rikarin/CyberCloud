# Bundle component — charts/bundle/README.md § What a component owes.
#
# The Cluster API control-plane provider for Kamaji. This is what serves the
# `controlplane.cluster.x-k8s.io/v1alpha2` KamajiControlPlane that charts/managed/kubernetes renders,
# and it is NOT part of charts/bundle/kamaji: separate repository, separate release, separate version
# number.

component: kamaji-control-plane-provider
phase: 40
licence: Apache-2.0
licenceEvidence: https://raw.githubusercontent.com/clastix/cluster-api-control-plane-provider-kamaji/v0.20.0/LICENSE
install: manifest
release: v0.20.0
manifest: https://github.com/clastix/cluster-api-control-plane-provider-kamaji/releases/download/v0.20.0/control-plane-components.yaml

source: https://api.github.com/repos/clastix/cluster-api-control-plane-provider-kamaji/releases/latest
checked: 2026-08-19

# ⚠ v1alpha2, AND THE GROUP IS SHARED WITH A DIFFERENT COMPONENT AT A DIFFERENT VERSION.
# charts/bundle/cluster-api serves `controlplane.cluster.x-k8s.io/v1beta2` (KubeadmControlPlane);
# this serves `controlplane.cluster.x-k8s.io/v1alpha2` (KamajiControlPlane). Same group, two
# definitions, two owners. That is why the Bundle gate's coverage key is a group AND a version and
# why a duplicate key across components is a failure rather than a warning.
serves:
  - controlplane.cluster.x-k8s.io/v1alpha2

requiredBy:
  - charts/managed/kubernetes

# The rows install.sh must have serving before this one — read by the Bundle gate. Not cert-manager:
# this document declares no cert-manager object (the notes below), and the gate would rightly refuse
# a `requires:` that cert-manager's `requiredBy:` does not answer. cluster-api because its webhooks
# must be serving before a KamajiControlPlane is admitted; kamaji because the provider reconciles
# a KamajiControlPlane into Kamaji's own `TenantControlPlane`, which needs that operator's kind.
requires:
  - charts/bundle/cluster-api
  - charts/bundle/kamaji

# What "installed" means for this component, read by install.sh after the apply. ⚠ `kamaji-system`
# — the same namespace charts/bundle/kamaji's chart installs into, because the provider's document
# hard-codes it; the two are separate releases sharing one namespace.
waitFor:
  - "deployment/capi-kamaji-controller-manager -n kamaji-system --for=condition=Available"

# Every container image this component's pinned artefact renders, with the digest its registry served
# on 2026-09-03. Regenerate with `./charts/bundle/images.sh --resolve`; check with `images.sh`.
#
# ⚠ THIS IS A RECORD, NOT A PIN, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. The tag is what the
# chart passes to the kubelet; the digest beside it is what that tag resolved to when somebody looked.
# A tag is mutable, so an upstream rebuild moves these bytes without moving any version in this
# directory — and `images.sh` is what turns that from invisible into a red run.
images:
  - docker.io/clastix/cluster-api-control-plane-provider-kamaji:v0.20.0@sha256:e1db02682e01d25c8d8f0249f5cead8d6c8246a5a5f74c454428cbd98afef7aa

notes: >
  ⚠ This document declares no cert-manager objects, unlike its two phase-40 siblings. It was checked
  rather than inferred: `grep -c cert-manager.io` over control-plane-components.yaml v0.20.0 returns
  zero. The component still installs after cert-manager because Cluster API's own webhooks must be
  serving before a KamajiControlPlane is admitted, not because this provider needs a certificate.
