# Bundle component — charts/bundle/README.md § What a component owes.
#
# CDI. The other half of the transitive requirement kubevirt/component.yaml describes: a KubeVirt
# guest needs a disk, and a Cluster API node image arrives as a container image that CDI imports into
# a PersistentVolume. cluster-api-provider-kubevirt's RBAC names `cdi.kubevirt.io` for that reason.

component: containerized-data-importer
phase: 30
licence: Apache-2.0
licenceEvidence: https://raw.githubusercontent.com/kubevirt/containerized-data-importer/v1.66.0/LICENSE
install: manifest
release: v1.66.0

manifest: https://github.com/kubevirt/containerized-data-importer/releases/download/v1.66.0/cdi-operator.yaml
manifestExtra: https://github.com/kubevirt/containerized-data-importer/releases/download/v1.66.0/cdi-cr.yaml

source: https://api.github.com/repos/kubevirt/containerized-data-importer/releases/latest
checked: 2026-08-19

# Read off cdi-operator.yaml. The definition also serves `cdi.kubevirt.io/v1alpha1`; only the version
# in use is claimed.
serves:
  - cdi.kubevirt.io/v1beta1

# ⚠ THE DEFINITION charts/managed/image AND charts/managed/disk RENDER AGAINST IS NOT IN THE ARTEFACT
# ABOVE. cdi-operator.yaml defines cdis.cdi.kubevirt.io and nothing else; cdi-operator writes
# datavolumes.cdi.kubevirt.io and the other kinds into the API server at runtime, from schemas
# compiled into its binary, and the project publishes them as YAML at no tag (the v1.66.0 assets are
# cdi-operator.yaml, cdi-cr.yaml, network-policies.yaml and a test binary; manifests/ holds templates
# and examples). So crds.sh cannot fetch DataVolume from the release, and crds/ holds what a cluster
# this release was installed on served, written by `crds.sh --capture --kubeconfig <file>` and
# reported RUNTIME rather than compared — charts/bundle/README.md § The definitions the harness
# validates against. Re-capture on a pin bump, from a cluster the new pin reached `Deployed` on.
definitionsWrittenByOperator: >
  cdi-operator.yaml carries cdis.cdi.kubevirt.io and the operator Deployment alone; cdi-operator
  creates datavolumes.cdi.kubevirt.io and the rest at runtime from schemas compiled into the binary,
  and no release asset or repository path at v1.66.0 carries them as YAML.

requiredBy:
  - charts/bundle/cluster-api-provider-kubevirt
  # ⚠ Added 2026-09-15: KubeVirt v1.9.0's template controller needs the DataVolume kind at start.
  # kubevirt/component.yaml § requires has the reading, and the roster now installs this row first.
  - charts/bundle/kubevirt

# What "installed" means for this component, read by install.sh after the apply. ⚠ THE `CDI`
# RESOURCE'S PHASE AND NOT `cdi-operator`'S DEPLOYMENT — nor the four it renders. Measured on
# 2026-09-15: `cdi-operator` is 1/1 at 37 s, and `cdi-uploadproxy` then sits in
# `CreateContainerConfigError` on `secret "cdi-api-signing-key" not found` until the operator mints
# the key, so a Deployment wait would have gone red during a healthy install. `Deployed` was
# reached at about six minutes on a cold cache. The resource is cluster-scoped, so no namespace.
waitFor:
  - "cdi/cdi --for=jsonpath={.status.phase}=Deployed"

# Every container image this component's pinned artefact renders, with the digest its registry served
# on 2026-09-03. Regenerate with `./charts/bundle/images.sh --resolve`; check with `images.sh`.
#
# ⚠ THIS IS A RECORD, NOT A PIN, AND THE DIFFERENCE IS WORTH BEING EXACT ABOUT. The tag is what the
# chart passes to the kubelet; the digest beside it is what that tag resolved to when somebody looked.
# A tag is mutable, so an upstream rebuild moves these bytes without moving any version in this
# directory — and `images.sh` is what turns that from invisible into a red run.
images:
  - quay.io/kubevirt/cdi-operator:v1.66.0@sha256:45964f62a027e09463c8dd48a2cbaf063c0afe771edb18e505f4461d0915984c

notes: >
  ⚠ CDI's import pods write into a PersistentVolume, so this component depends on a storage class and
  this bundle installs none — bundle.yaml § owed, `no-csi`. On a cluster with no default storage
  class the CDI operator installs cleanly, reports Deployed, and every DataVolume stays Pending,
  which is the shape of failure that reads as a KubeVirt problem and is not one.
