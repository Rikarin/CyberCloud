{{/*
CloudNativePG `Cluster` — docs/plan/12 § The catalogue, PostgreSQL.

⚠ This renders a custom resource; it does not install the operator. The operator is
charts/bundle/'s job, which is why this chart has no CRD directory and no operator Deployment.
*/}}
{{/*
The extension allow-list, mapped to the two names PostgreSQL knows each value by.

⚠ ONE LIST, TWO VOCABULARIES. `.Values.extensions` reaches `CREATE EXTENSION` as an EXTENSION name
and `shared_preload_libraries` as a LIBRARY name, and those are not the same string. `pgvector`
installs as the extension `vector`; `pgvector` and `postgis` need no preload entry at all, while
`timescaledb` and `pg_stat_statements` refuse to work without one. Rendering the raw value into both
produced a `CREATE EXTENSION pgvector` that fails and asked the postmaster to preload two libraries
that do not exist — and a `shared_preload_libraries` entry with no library behind it fails STARTUP,
for every database on the instance.

⚠ PostgresServers.ExtensionCatalogue is the same table in C# and
ChartRegistryPairTests.TheExtensionCatalogueIsTheChartsExtensionCatalogue compares them row for row.
A value with no row here renders as itself, which is what values.schema.json's enum makes
unreachable — see conformance.yaml § owed, `extension-names-are-not-library-names`.
*/}}
{{- $catalogue := dict
  "pgvector"           (dict "extension" "vector"             "preload" "")
  "postgis"            (dict "extension" "postgis"            "preload" "")
  "pg_stat_statements" (dict "extension" "pg_stat_statements" "preload" "pg_stat_statements")
  "timescaledb"        (dict "extension" "timescaledb"        "preload" "timescaledb") -}}
{{- $libraries := list -}}
{{- range .Values.extensions -}}
{{- $row := get $catalogue . | default dict -}}
{{- with get $row "preload" -}}
{{- $libraries = append $libraries . -}}
{{- end -}}
{{- end -}}
{{- $libraries = uniq $libraries -}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "postgres.name" . }}
  labels:
    {{- include "postgres.platformLabels" . | nindent 4 }}
spec:
  instances: {{ .Values.replicas }}
  imageName: {{ .Values.imageName | default (printf "ghcr.io/cloudnative-pg/postgresql:%s" .Values.version) | quote }}

  {{- with include "postgres.resources" . }}
  resources:
    {{- . | trim | nindent 4 }}
  {{- end }}

  postgresql:
    {{/*
      ⚠ A LIST, AND A SIBLING OF `parameters` — NOT A KEY INSIDE IT. api/v1/cluster_types.go declares
      `AdditionalLibraries []string `json:"shared_preload_libraries,omitempty"`` on
      PostgresConfiguration, beside `Parameters map[string]string `json:"parameters,omitempty"``.

      ⚠ The other spelling was a 422 on every server created with an extension, after the caller had
      already been told 202. pkg/postgres/configuration.go lists "shared_preload_libraries" in
      FixedConfigurationParameters and internal/webhook/v1/cluster_webhook.go walks
      spec.postgresql.parameters and answers a fixed key with "Can't set fixed configuration
      parameter" unless the value equals CloudNativePG's own sanitized one — which for this key is
      the default settings' empty string, because the webhook builds its ConfigurationInfo without
      IncludingSharedPreloadLibraries. So no non-empty list could ever have passed. The default here
      is `[]`, which is why nothing noticed. See conformance.yaml § owed,
      `shared-preload-libraries-is-not-a-parameter`.

      ⚠ AND THE LIST IS `$libraries`, NOT `.Values.extensions` — the header of this file explains why
      the two are different lists. A body naming only pgvector renders no key here at all.
    */}}
    {{- if $libraries }}
    shared_preload_libraries:
      {{- range $libraries }}
      - {{ . }}
      {{- end }}
    {{- end }}
    parameters:
      max_connections: "200"

  {{- if .Values.synchronousReplication }}
  postgresql_synchronous:
    method: any
    number: 1
  {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.bootstrap.database | quote }}
      owner: {{ .Values.bootstrap.owner | quote }}
      {{- if .Values.bootstrap.password }}
      {{/*
        ⚠ The value reaching this template is resolved from the tenant's Vault by ISecretResolver
        at render time — docs/plan/12 § The pattern, once, piece 5. It is never persisted in a
        values file and never reaches grain state; values.yaml carries "" and the annotation
        carries `@secret`, which is what makes the generated schema mark it writeOnly.
      */}}
      secret:
        name: {{ include "postgres.name" . }}-app
      {{- end }}
      {{- if .Values.extensions }}
      {{/*
        ⚠ The EXTENSION name from the catalogue at the top of this file, not the allow-list value.
        `CREATE EXTENSION pgvector` fails — the control file is named `vector` — and the failure lands
        in the bootstrap job rather than on the resource, so the server comes up without the feature.
      */}}
      postInitApplicationSQL:
        {{- range .Values.extensions }}
        {{- $row := get $catalogue . | default (dict "extension" .) }}
        - CREATE EXTENSION IF NOT EXISTS {{ get $row "extension" }};
        {{- end }}
      {{- end }}

  storage:
    size: {{ .Values.storage.size | quote }}
    {{- if .Values.storage.class }}
    storageClass: {{ .Values.storage.class | quote }}
    {{- end }}

  {{- if .Values.storage.walSize }}
  walStorage:
    size: {{ .Values.storage.walSize | quote }}
    {{- if .Values.storage.class }}
    storageClass: {{ .Values.storage.class | quote }}
    {{- end }}
  {{- end }}

  {{- if .Values.backup.enabled }}
  backup:
    retentionPolicy: {{ printf "%dd" (int .Values.backup.retentionDays) | quote }}
    barmanObjectStore:
      destinationPath: {{ .Values.backup.destinationPath | quote }}
      wal:
        compression: gzip
  {{- end }}

  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enabled }}
{{- if .Values.bootstrap.password }}
---
{{/*
The owning role's password, as a CloudNativePG basic-auth secret. Rendered only when the resolver
supplied a value; an empty `bootstrap.password` means the operator generates one instead.
*/}}
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ include "postgres.name" . }}-app
  labels:
    {{- include "postgres.platformLabels" . | nindent 4 }}
stringData:
  username: {{ .Values.bootstrap.owner | quote }}
  password: {{ .Values.bootstrap.password | quote }}
{{- end }}
