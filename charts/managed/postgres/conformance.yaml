# Conformance manifest — docs/plan/12 § The pattern, once, piece 8.
#
# What the conformance suite asserts about CyberCloud.DBforPostgreSQL/servers. This file is data:
# the suite that reads it lives in test/ and does not exist yet, so today `Build.Charts` checks only
# that the file is present, non-empty, and names the same resource type as Chart.yaml. That is a
# weaker check than it will be and the target says so in its own log rather than implying otherwise.

resourceType: CyberCloud.DBforPostgreSQL/servers
apiVersion: "2026-08-01"
chart: postgres

# Objects the reconciler must have applied once the resource reports Succeeded.
renders:
  - group: postgresql.cnpg.io
    version: v1
    kind: Cluster
    count: 1
  - group: postgresql.cnpg.io
    version: v1
    kind: Pooler
    count: 1
    when: pooling.enabled

# ADR-013 — every rendered object carries all seven labels. Asserted against real rendered output,
# which is what the Labels architecture gate in docs/plan/23 § The architecture gates requires.
labels:
  required:
    - cybercloud.io/tenant-id
    - cybercloud.io/subscription-id
    - cybercloud.io/resource-group
    - cybercloud.io/resource-id
    - cybercloud.io/resource-type
    - cybercloud.io/api-version
    - cybercloud.io/managed-by
  # ⚠ Not the resource type verbatim. A `/` is not a legal label value character, so the value is
  # lower-cased with `/` replaced by `_` — KubeLabels.ResourceTypeValue.
  values:
    cybercloud.io/resource-type: cybercloud.dbforpostgresql_servers
    cybercloud.io/managed-by: cybercloud

# Behaviour a tenant is entitled to. Each is a statement the suite can fail on, not a feature list.
assertions:
  - id: connect-in-cluster
    says: A client connects to the read-write Service with the credentials from listKeys and runs SELECT 1.
  - id: pooler-is-the-default-endpoint
    says: With pooling.enabled the advertised connection string points at the Pooler, not at the cluster Service, so turning pooling off later is a visible change rather than a silent one.
  - id: failover-preserves-committed-writes
    says: Deleting the primary pod promotes a replica and every transaction that returned success before the delete is still readable afterwards.
  - id: pitr-window-is-the-retention-days
    says: A restore to a timestamp retentionDays-minus-one days old succeeds; a restore older than retentionDays fails with a stated error rather than an empty database.
  - id: extensions-are-the-allow-list
    says: Every value the schema's extensions enum permits installs; anything else is refused by the API before it reaches a cluster.
  - id: storage-grows-never-shrinks
    says: Increasing storage.size resizes online; decreasing it is refused at the API.
  - id: secrets-never-round-trip
    says: A GET of the resource never returns bootstrap.password in any form. The only path out is the listKeys action.

# Meters the type must emit — docs/plan/12 § The pattern, once, piece 3. Listed here so the
# conformance suite and the provider's Describe can be diffed against one file rather than agreeing
# by coincidence.
meters:
  - postgres.instance.hours
  - postgres.storage.gib.hours
  - postgres.backup.gib.hours

# ── owed ──────────────────────────────────────────────────────────────────────────────────────
#
# Named here rather than left to be discovered, because an absent capability that nobody wrote down
# is indistinguishable from one nobody thought of. The convention is charts/managed/ferretdb's.
owed:
  - id: shared-preload-libraries-is-not-a-parameter
    status: closed
    closed: 2026-08-12
    says: >
      ⚠ CLOSED, AND KEPT BECAUSE THE SHAPE OF THE MISS IS WORTH MORE THAN THE FIX.
      PostgresServers.ClusterJson and templates/cluster.yaml both wrote
      `spec.postgresql.parameters.shared_preload_libraries` whenever /properties/extensions was
      non-empty. CloudNativePG declares that key as `AdditionalLibraries []string` on
      PostgresConfiguration — a SIBLING of `parameters` (api/v1/cluster_types.go) — lists it in
      FixedConfigurationParameters (pkg/postgres/configuration.go), and its validating webhook walks
      spec.postgresql.parameters and answers a fixed key with "Can't set fixed configuration
      parameter" (internal/webhook/v1/cluster_webhook.go). So every server created with pgvector,
      postgis, pg_stat_statements or timescaledb was refused at admission AFTER the caller was told
      202. Both spellings now render a list beside `parameters`.
      ⚠ THE DEFAULT IS `[]`, WHICH IS THE WHOLE REASON IT SURVIVED. Every test and every manual run
      used a body that named no extension, so the one placement that is refused was the one nothing
      exercised, and the suite that would notice cannot: the cluster-backed conformance suites run
      against a bare k3s with no CloudNativePG operator and no admission webhook, so a green cluster
      run is not evidence about this and never was.
      ⚠ AND IT WAS FOUND BY WRITING THE SECOND RENDERING, not by reading the first.
      CyberCloud.Providers.DocumentDB renders the same CRD independently — src/Providers/README.md
      § Hard rule forbids sharing a renderer — and got it right, which is what made the disagreement
      visible. Recorded at charts/managed/ferretdb/conformance.yaml § owed until 2026-08-12.
  - id: the-cluster-pair-is-held-together-by-one-test
    says: >
      templates/cluster.yaml and PostgresServers.ClusterJson are two hand-maintained spellings of one
      CloudNativePG Cluster and NOTHING in ./build.sh compares them. ChartSurfaces filters
      `templates/` out of the chart tree on purpose and build/Build.Charts.cs line-filters the same
      directory, so no emitter has ever read a Helm template — ADR-012's fifth surface reaches
      values.yaml and stops there. What holds the pair together is
      ChartRegistryPairTests.TheChartPutsThePreloadLibrariesBesideParametersAndNotInsideThem and
      PostgresReconcilerTests.ThePreloadLibrariesAreASiblingOfParametersInBothSpellings, which assert
      one field each by regular expression over the template. ⚠ That is a check per field somebody
      remembered, not a check of the object, and `shared-preload-libraries-is-not-a-parameter` above
      is what a field nobody remembered costs. Closing it is an emitter that renders the chart and
      diffs it against the registry's projection, which is a seam ChartSurfaces does not have.
  - id: extension-names-are-not-library-names
    status: closed
    closed: 2026-08-18
    says: >
      ⚠ CLOSED, AND THE FINDING IS KEPT BECAUSE THE FIX IS A TABLE AND THE DEFECT WAS THE ABSENCE OF
      ONE. PostgresServers.ExtensionCatalogue and the `$catalogue` dict at the top of
      templates/cluster.yaml now map each allowed value to the extension it installs as and the
      library it needs preloaded, and ClusterJson reads them as two lists rather than one:
      `pgvector` renders `CREATE EXTENSION IF NOT EXISTS vector;` and NO preload entry, `postgis`
      likewise, and only `pg_stat_statements` and `timescaledb` reach
      `spec.postgresql.shared_preload_libraries` — under their own names. Read upstream on
      2026-08-18: pgvector's README says `CREATE EXTENSION vector` and asks for no preload;
      PostgreSQL's own pg_stat_statements page says the module "must be loaded by adding
      pg_stat_statements to shared_preload_libraries … because it requires additional shared memory";
      timescaledb's `extension_load_without_preload` (src/extension_utils.c) raises "extension
      \"timescaledb\" must be preloaded" with the hint "Please preload the timescaledb library via
      shared_preload_libraries".
      ⚠ THE TWO FAILURES WERE NOT THE SAME SIZE, which is why the preload half mattered more. A wrong
      CREATE EXTENSION fails inside a bootstrap job and leaves a server without one feature; a
      `shared_preload_libraries` entry with no library behind it is read by the POSTMASTER before it
      accepts a connection, so it fails startup for every database on the instance.
      ⚠ WHAT IS STILL OWED IS THE EVIDENCE, NOT THE FIX. `extensions-are-the-allow-list` above still
      asks for one run per allowed value against a real cluster and nothing runs it: the
      cluster-backed suites start a bare k3s with no CloudNativePG operator and no PostgreSQL, so
      nothing in this tree can observe a `CREATE EXTENSION` succeed or a postmaster start. What the
      unit suite proves is that the two spellings render the same two lists —
      ChartRegistryPairTests.TheExtensionCatalogueIsTheChartsExtensionCatalogue diffs the tables row
      for row, and PostgresReconcilerTests.AnExtensionNameIsNotALibraryName pins every allowed value
      in one body, because the defect was per-value and a check naming only the value somebody
      thought of is what let it ship.
      ⚠ AND CyberCloud.Providers.DocumentDB NEVER HAD IT. It renders the same CloudNativePG CRD
      independently and keeps the vocabularies apart by construction —
      `DocumentDbAccounts.SharedPreloadLibraries` is `[pg_cron, pg_documentdb_core, pg_documentdb]`
      and `ExtensionStatement` is `CREATE EXTENSION IF NOT EXISTS documentdb CASCADE;`, three lines
      apart with a remark saying the prefixes differ. Its extension set is a platform constant rather
      than a tenant allow-list, so it has one row to be right about and no list to conflate. THAT is
      the difference: the defect here was a tenant-facing enum doing two jobs.
      ── The finding, as recorded before the fix ────────────────────────────────────────────────
      /properties/extensions is one list used as two vocabularies: it reaches
      `bootstrap.initdb.postInitApplicationSQL` as `CREATE EXTENSION IF NOT EXISTS <value>` and
      `spec.postgresql.shared_preload_libraries` as a library name, and PostgreSQL does not agree
      that those are the same string. `pgvector` installs as the extension `vector`; `pgvector` and
      `postgis` need no preload entry at all, while `timescaledb` and `pg_stat_statements` do. So the
      allow-list as spelled produces a CREATE EXTENSION that fails for pgvector and asks the
      postmaster to preload two libraries that do not exist. ⚠ Noticed while moving the key out of
      `parameters` and deliberately NOT fixed there: the placement was a live 422 on every extension
      body and this is a different defect with a different fix — a table mapping each allowed value
      to its extension name and its preload requirement, which is a schema-shaped change rather than
      a rendering one. Closing it also wants one run against a real cluster per allowed value, which
      is what `extensions-are-the-allow-list` above already asks for and nothing yet runs.
  - id: the-recovery-window-is-hollow-because-cloudnativepg-owns-its-claims
    says: >
      ⚠ THIS TYPE DOES NOT LEAK ITS VOLUMES, AND THE REASON IT DOES NOT IS WORSE THAN THE LEAK.
      Issue #65 lists CyberCloud.DBforPostgreSQL/servers among the three operator-delegated types
      whose claims a purge leaves behind, alongside DBforMySQL/servers and Storage/accounts. Read
      against CloudNativePG v1.30.0 — the version charts/bundle/cloudnative-pg/component.yaml pins —
      that premise is false for this row, and only for this row. CloudNativePG creates its PVCs
      itself rather than through a volumeClaimTemplate, and it stamps an OWNER REFERENCE onto every
      one of them: pkg/reconciler/persistentvolumeclaim/build.go calls `.WithClusterInheritance(cluster)`,
      which is `cluster.SetInheritedDataAndOwnership(objectMeta)` (api/v1/cluster_funcs.go), which is
      `utils.SetAsOwnedBy(obj, cluster.ObjectMeta, cluster.TypeMeta)` with `Controller: true`
      (pkg/utils/ownership.go). There is no reclaim or retain setting anywhere in the operator —
      `.spec.storage.pvcTemplate` is a PersistentVolumeClaimSpec and can reach no metadata — and the
      only owner-reference removal in the whole tree is the human-driven
      `kubectl cnpg destroy --keep-pvc`.
      ⚠ SO A PURGE LEAVES NOTHING, AND A SOFT DELETE LEAVES NOTHING EITHER. That is the finding.
      PostgresServerReconciler.DeleteAsync deletes the Cluster on every teardown, and a soft delete
      is a teardown — ProviderConformanceTests says so in as many words: "a soft delete tears the
      data plane down like any other delete; what the window preserves is the name, the stored
      desired state, the committed quota and the volumes". The first three survive here and the
      fourth does not: Kubernetes garbage-collects `{name}-{serial}`, `{name}-{serial}-wal` and every
      tablespace claim as soon as the Cluster is gone. So PostgresServers.SoftDeleteDays = 7 promises
      a window whose restore comes back to an initdb.
      ⚠ AND NOTHING IN THIS TREE CAN SEE IT. ProviderConformanceTests' retained-volume case reads
      volumeClaimTemplates out of the documents a provider APPLIED and skips a family that renders
      none — this provider applies a Cluster and a Pooler, so it skips, and the skip is correct.
      The cluster-backed suites start a bare k3s with no CloudNativePG operator, so no run in this
      repository has ever had a controller present to garbage-collect anything. The window has been
      green since it was declared and has never once been exercised against the operator that
      empties it.
      ⚠ WHAT CLOSING IT LOOKS LIKE, so that the next person does not start from the leak. Either the
      soft-delete teardown stops deleting the Cluster for this family — which contradicts the
      contract every other type keeps and leaves a parked resource's pods running and unbilled — or
      it strips the claims' owner references before deleting, which is what `--keep-pvc` does and
      what a RetainedVolumesAsync-shaped seam cannot express, because that member NAMES claims for a
      purge to remove and this needs claims DETACHED before a delete. A third answer is to withdraw
      SupportsSoftDelete(7) from this type until one of the two exists, on the same argument
      PostgresProvider already makes in its own remarks: "a recovery window the platform does not
      honour is a promise made" to a tenant who will find out when they use it.
