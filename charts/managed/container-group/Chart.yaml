# A container group — docs/plan/13 § Container Instances: "A container group is a Pod … in the tenant's
# namespace with resource limits, env from SecretRefs, an optional volume, an optional public IP, and
# logs streamed to the portal."
#
# ⚠ ONE POD, AND THE TWO SECRETS ARE NOT IN THIS CHART. A chart carries values and a vault value must not
# become one: the secure environment (`{name}-env`) and the pull credential (`{name}-pull`) are rendered
# by the reconciler from resolved handles and only NAMED here, as charts/managed/virtual-machine names its
# cloud-init Secret.
#
# ⚠ THE FLOATING IP IS A KUBE-OVN OBJECT NO LANE RUNS. It is rendered only when the body names a public
# address, validated against the committed OvnFip definition, and conformance.yaml § owed says what that
# does and does not prove.
apiVersion: v2
name: container-group
description: A container group — one or more containers as one pod with a shared CPU and memory budget, environment from vault handles, ports on a tenant subnet and an optional public address.
type: application

# The chart's own version. Bumped on every change to this directory.
version: 0.1.0

# ⚠ No operator: a pod is Kubernetes' own. appVersion is the Kubernetes minor whose pod-level resources
# (beta and on by default since 1.34) the chart relies on — the k3s the cluster lane runs.
appVersion: "1.35"

kubeVersion: ">=1.34.0-0"

keywords:
  - containers
  - pod
  - container-instance

home: https://kubernetes.io/docs/concepts/workloads/pods/
sources:
  - https://github.com/kubernetes/kubernetes

maintainers:
  - name: Cyber Cloud Platform

annotations:
  cybercloud.io/resource-type: CyberCloud.ContainerInstance/containerGroups
  cybercloud.io/api-version: "2026-08-01"
