## @param size {string} The disk's size, in Kubernetes quantity form. ⚠ Immutable: growing a disk depends on the storage class and shrinking one is never possible, so a bigger disk is a new disk.
## @required
## @immutable
## @pattern \d+(\.\d+)?(m|k|M|G|T|P|E|Ki|Mi|Gi|Ti|Pi|Ei)?
## @example "32Gi"
size: "32Gi"

## @param storageClass {string} The storage class the disk is on. Empty means the cluster's default, which on a bundle-installed cluster is node-local: one copy, on one node, and the machine that attaches the disk runs on that node.
## @immutable
## @length ..253
## @widget storageclass
storageClass: ""

