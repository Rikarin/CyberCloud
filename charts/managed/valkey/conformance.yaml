# Conformance manifest — docs/plan/12 § The pattern, once, piece 8.
#
# What the conformance suite asserts about CyberCloud.Cache/redis. This file is data: `Build.Charts`
# checks only that it is present, non-empty, and names the same resource type as Chart.yaml, and it
# says so in its own log rather than implying otherwise. The `renders` and `labels` blocks below are
# asserted today by the two suites that DO run —
# src/Providers/CyberCloud.Providers.Cache/CyberCloud.Providers.Cache.Conformance (Docker-free) and
# …Cluster.Conformance (a real k3s API server) — through ValkeyCase, not by reading this file.

resourceType: CyberCloud.Cache/redis
apiVersion: "2026-08-01"
chart: valkey

# Objects the reconciler must have applied once the resource reports Succeeded.
#
# ⚠ ONE, and the count is the interesting part. A RedisFailover expands into a StatefulSet, a
# Deployment, three Services and two ConfigMaps — all of them the operator's, none of them this
# provider's. A manifest listing them would be asserting on a controller's implementation detail,
# which breaks on the operator's next minor release without anything being wrong.
renders:
  - group: databases.spotahome.com
    version: v1
    kind: RedisFailover
    count: 1

# ADR-013 — every rendered object carries all seven labels. Asserted against real rendered output,
# which is what the Labels architecture gate in docs/plan/23 § The architecture gates requires.
labels:
  required:
    - cybercloud.io/tenant-id
    - cybercloud.io/subscription-id
    - cybercloud.io/resource-group
    - cybercloud.io/resource-id
    - cybercloud.io/resource-type
    - cybercloud.io/api-version
    - cybercloud.io/managed-by
  # ⚠ Not the resource type verbatim. A `/` is not a legal label value character, so the value is
  # lower-cased with `/` replaced by `_` — KubeLabels.ResourceTypeValue.
  values:
    cybercloud.io/resource-type: cybercloud.cache_redis
    cybercloud.io/managed-by: cybercloud

# Behaviour a tenant is entitled to. Each is a statement the suite can fail on, not a feature list.
assertions:
  - id: connect-through-sentinel
    says: A client given the listKeys host, port and masterName asks Sentinel for the primary, connects with the returned requirepass, and runs PING.
  - id: failover-moves-the-primary-and-the-client-follows
    says: Deleting the primary pod promotes a replica within the Sentinel failover timeout, and a client that reconnects through Sentinel reaches the new primary without its connection string changing.
  - id: persistence-none-keeps-nothing-and-says-so
    says: With persistence.mode None a restart returns an empty keyspace, and neither an AOF nor an RDB file is written — the product page says a cache is not durable and this is the assertion that keeps that honest.
  - id: aof-everysec-loses-at-most-one-second
    says: With persistence.mode AOF and fsync everysec, a hard kill loses only writes from the last second. docs/plan/05's honesty about what everysec means is repeated in the product docs for this reason.
  - id: maxmemory-is-set-and-the-policy-is-consulted
    says: Writing past the container's memory produces the declared maxmemoryPolicy's behaviour — an error for noeviction, an eviction for the allkeys and volatile families — rather than an OOM kill. A maxmemory-policy with no maxmemory behind it is a setting that has never been read.
  - id: mode-is-immutable
    says: A PUT that changes mode is refused at the API rather than producing a topology change no client was ready for.
  - id: secrets-never-round-trip
    says: A GET of the resource never returns the requirepass in any form. The only path out is the listKeys action.
  - id: requirepass-is-provisioned
    says: docs/plan/12 § The pattern, once, piece 5 — the credential is generated at create and written to the tenant's Vault. The reconciler mints through ISecretWriter and renders the Secret spec.auth.secretPath names from what the vault returned, under the key the operator reads it from.
  - id: a-reconcile-never-rotates-the-requirepass
    says: A second reconcile pass on a converged cache renders a byte-identical Secret and writes nothing to the vault. Rotating would leave a running server holding a password no caller has been given, while every surface reported success.

# ⚠ OWED, AND NAMED RATHER THAN OMITTED. Each of these is something docs/plan/12 asks of this row
# and the operator ADR-010 clause 1 selects cannot do. Checked against that operator's source on
# 2026-08-12 — see SOURCE next to this file for the files and the lines.
owed:
  - id: tls-on-by-default
    says: docs/plan/12 says "TLS on by default; requirepass from Vault". Neither RedisSettings nor SentinelSettings carries a TLS field, so there is nothing to render and no property is declared — a tls.enabled the reconciler could accept and not honour would be worse than its absence.
    blocked-by: spotahome/redis-operator has no TLS support. Closing it means a sidecar proxy, a different operator, or an upstream change.
  - id: standalone-mode
    says: docs/plan/12 names a Standalone mode. validate.go replaces a sentinel replica count of <= 0 with defaultSentinelNumber (3), so every RedisFailover runs a Sentinel quorum whatever the spec says.
    blocked-by: The CRD cannot express "no Sentinel". The `mode` property exists with one member so that the axis is visible and immutable.
  - id: cluster-mode
    says: docs/plan/12 names a Cluster (sharded) mode. The operator ships one CRD, RedisFailover, and it has no sharding.
    blocked-by: There is nothing to render. A second operator would be an ADR-010 clause 1 change.
  - id: the-operator-accepts-the-rendered-secret
    says: The Secret the reconciler applies is one spotahome's GetRedisPassword reads successfully, and the cache reaches a state where a client can PING it. ⚠ THE HONEST LIMIT OF WHAT WAS PROVED WHEN THE CREDENTIAL LANDED. The suites reach an API server and can show the Secret is rendered and applied with the name, namespace and `password` key the operator's source reads; no operator runs anywhere either suite reaches, so nobody has watched a cache come up. The key name is pinned against upstream in ValkeySecretTests rather than observed.
    blocked-by: Nothing in this repository installs spotahome/redis-operator — charts/bundle/ does not exist. This closes with the bundle, together with connect-through-sentinel above, which is the assertion that would actually observe it.

# Meters the type must emit — docs/plan/12 § The pattern, once, piece 3. Listed here so the
# conformance suite and the provider's Describe can be diffed against one file rather than agreeing
# by coincidence.
#
# ⚠ None of these is declared in Describe, and the reason is a registry gap rather than an oversight:
# a quota meter reserves the NUMBER at a JSON Pointer, and every amount this type draws is a
# Kubernetes quantity string. See the comment on ValkeyCacheProvider.Describe.
meters:
  - valkey.instance.hours
  - valkey.memory.gib.hours
  - valkey.storage.gib.hours
