# The Dovecot, Postfix and Rspamd configuration — MailDomains.ConfigMapJson, as a template.
#
# ⚠ NO CREDENTIAL REACHES THIS OBJECT. The DKIM key is mounted from the credentials Secret and the
# mailbox hashes from the mailbox Secret; a ConfigMap is readable by anyone holding `get
# configmaps`, which is a strictly weaker right than `get secrets`.
#
# ⚠ SENDING IS RENDERED HELD, ALWAYS, AND THAT IS THE ONE PLACE THIS FILE AND THE RECONCILER DIFFER
# ON PURPOSE. The reconciler decides the gate from the public DNS on every pass (MailDeliverability);
# a chart install has no DNS to ask, so it renders the state a domain nobody has verified is in —
# local delivery only — and a relay attempt is refused at RCPT TO with the reason.
#
# ⚠ Every line below was run by the daemon that reads it before it was written down —
# MailDataPlaneTests for Dovecot and Rspamd, MailDeliveryOnK3sTests for the whole pod. MailChartTests
# holds this file's ports, paths and keys to MailDomains' constants.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mail.name" . }}-mail-config
  labels:
    {{- include "mail.platformLabels" . | nindent 4 }}
    {{- include "mail.selectorLabels" . | nindent 4 }}
data:
  dovecot.conf: |
    # Generated by CyberCloud.Mail/domains. Do not edit in place.
    {{- if eq .Values.version "2.3" }}
    base_dir = /run/dovecot
    state_dir = /run/dovecot/state
    default_internal_user = vmail
    default_internal_group = vmail
    default_login_user = vmail
    listen = *
    log_path = /dev/stderr
    protocols = imap lmtp{{ if .Values.sieve }} sieve{{ end }}
    ssl = no
    disable_plaintext_auth = no
    auth_mechanisms = plain login
    mail_location = mdbox:~/mdbox
    mail_home = /srv/mail/%Ld/%Ln
    mail_uid = vmail
    mail_gid = vmail
    first_valid_uid = 1000
    mail_plugins = $mail_plugins quota
    passdb {
      driver = passwd-file
      args = /etc/mail/users/%Ln.passwd
    }
    userdb {
      driver = passwd-file
      args = /etc/mail/users/%Ln.passwd
    }
    plugin {
      quota = count:User quota
      quota_vsizes = yes
      quota_rule = *:storage={{ include "mail.dovecotSize" .Values.storage.mailboxQuota }}
      {{- if .Values.sieve }}
      sieve = file:~/sieve;active=~/.dovecot.sieve
      {{- end }}
    }
    protocol imap {
      mail_plugins = $mail_plugins imap_quota
    }
    {{- if .Values.sieve }}
    protocol lmtp {
      mail_plugins = $mail_plugins sieve
    }
    service managesieve-login {
      chroot =
      inet_listener sieve {
        port = 34190
      }
    }
    {{- end }}
    {{- else }}
    dovecot_config_version = 2.4.0
    dovecot_storage_version = 2.4.0
    base_dir = /run/dovecot
    state_dir = /run/dovecot
    default_internal_user = vmail
    default_internal_group = vmail
    default_login_user = vmail
    listen = *
    log_path = /dev/stderr
    protocols = imap lmtp{{ if .Values.sieve }} sieve{{ end }}
    ssl = no
    auth_allow_cleartext = yes
    auth_mechanisms = plain login
    mail_driver = mdbox
    mail_home = /srv/mail/%{user | domain}/%{user | username}
    mail_path = ~/mdbox
    mail_uid = vmail
    mail_gid = vmail
    first_valid_uid = 1000
    passdb passwd-file {
      passwd_file_path = /etc/mail/users/%{user | username | lower}.passwd
    }
    userdb passwd-file {
      passwd_file_path = /etc/mail/users/%{user | username | lower}.passwd
    }
    mail_plugins {
      quota = yes
    }
    # ⚠ Top level and not inside the quota filter: a setting in the named filter outranks a
    # mailbox's userdb override, and every mailbox would get the domain's limit.
    quota_storage_size = {{ include "mail.dovecotSize" .Values.storage.mailboxQuota }}
    quota "User quota" {
    }
    protocol imap {
      mail_plugins {
        imap_quota = yes
      }
    }
    {{- if .Values.sieve }}
    protocol lmtp {
      mail_plugins {
        sieve = yes
      }
    }
    sieve_script personal {
      driver = file
      path = ~/sieve
      active_path = ~/.dovecot.sieve
    }
    service managesieve-login {
      chroot =
      inet_listener sieve {
        port = 34190
      }
    }
    {{- end }}
    {{- end }}
    service imap-login {
      chroot =
      inet_listener imap {
        port = 31143
      }
      inet_listener imaps {
        port = 0
      }
    }
    service lmtp {
      inet_listener lmtp {
        port = 31024
      }
    }
    service auth {
      inet_listener sasl {
        {{- if eq .Values.version "2.3" }}
        address = 127.0.0.1
        {{- else }}
        listen = 127.0.0.1
        {{- end }}
        port = 31234
      }
    }
  main.cf: |
    # Generated by CyberCloud.Mail/domains. Do not edit in place.
    compatibility_level = 3.6
    myhostname = {{ lower .Values.domain }}
    mydomain = {{ lower .Values.domain }}
    myorigin = $mydomain
    mydestination = localhost
    inet_interfaces = all
    mynetworks = 127.0.0.0/8
    maillog_file = /dev/stdout
    virtual_mailbox_domains = {{ lower .Values.domain }}
    virtual_mailbox_maps = texthash:/etc/postfix/mailboxes
    virtual_alias_maps = texthash:/etc/postfix/virtual
    virtual_transport = lmtp:inet:127.0.0.1:31024
    smtpd_sasl_type = dovecot
    smtpd_sasl_path = inet:127.0.0.1:31234
    smtpd_milters = inet:127.0.0.1:11332
    non_smtpd_milters = $smtpd_milters
    milter_default_action = tempfail
    relayhost = {{ if .Values.relayHosts }}[{{ index (sortAlpha .Values.relayHosts) 0 }}]{{ end }}
    smtpd_relay_restrictions = permit_auth_destination, check_recipient_access static:{REJECT 5.7.1 Outbound mail for {{ lower .Values.domain }} is held until its SPF, DKIM and DMARC records verify}, reject
    defer_transports = smtp
  postfix-start.sh: |
    #!/bin/sh
    # Generated by CyberCloud.Mail/domains. Do not edit in place.
    set -eu
    domain='{{ lower .Values.domain }}'
    catch_all='{{ .Values.catchAll }}'
    fingerprint() {
        cat /etc/mail/config/main.cf /etc/mail/users/* 2>/dev/null | cksum
    }
    build() {
        cp /etc/mail/config/main.cf /etc/postfix/main.cf
        : > /etc/postfix/mailboxes.next
        : > /etc/postfix/virtual.next
        for file in /etc/mail/users/*.passwd; do
            [ -e "$file" ] || continue
            printf '%s@%s OK\n' "$(basename "$file" .passwd)" "$domain" >> /etc/postfix/mailboxes.next
        done
        for file in /etc/mail/users/*.virtual; do
            [ -e "$file" ] || continue
            cat "$file" >> /etc/postfix/virtual.next
        done
        if [ -n "$catch_all" ]; then
            printf '@%s %s@%s\n' "$domain" "$catch_all" "$domain" >> /etc/postfix/virtual.next
        fi
        mv /etc/postfix/mailboxes.next /etc/postfix/mailboxes
        mv /etc/postfix/virtual.next /etc/postfix/virtual
    }
    build
    postconf -F '*/*/chroot = n'
    postconf -M 'submission/inet=submission inet n - n - - smtpd'
    postconf -P 'submission/inet/syslog_name=postfix/submission' \
        'submission/inet/smtpd_sasl_auth_enable=yes' \
        'submission/inet/smtpd_tls_security_level=none' \
        'submission/inet/smtpd_client_restrictions=permit_sasl_authenticated,reject'
    postfix check
    trap 'postfix stop; exit 0' TERM INT
    postfix start-fg &
    master=$!
    seen=$(fingerprint)
    while kill -0 "$master" 2>/dev/null; do
        sleep 5 &
        wait $! || true
        now=$(fingerprint)
        if [ "$now" != "$seen" ]; then
            build
            postfix reload
            seen=$now
        fi
    done
    wait "$master"
  rspamd-worker-proxy.inc: |
    # Generated by CyberCloud.Mail/domains. Do not edit in place.
    bind_socket = "127.0.0.1:11332";
    milter = yes;
    timeout = 120s;
    upstream "local" {
      default = yes;
      self_scan = yes;
    }
  rspamd-dkim-signing.conf: |
    # Generated by CyberCloud.Mail/domains. Do not edit in place.
    enabled = true;
    sign_authenticated = true;
    sign_local = false;
    allow_username_mismatch = false;
    use_domain = "header";
    domain {
      {{ lower .Values.domain }} {
        selector = "cc";
        path = "/etc/mail/dkim/cc.key";
      }
    }
  rspamd-actions.conf: |
    # Generated by CyberCloud.Mail/domains. Do not edit in place.
    reject = {{ .Values.filtering.rejectThreshold }};
    add_header = {{ max 1 (div .Values.filtering.rejectThreshold 3) }};
