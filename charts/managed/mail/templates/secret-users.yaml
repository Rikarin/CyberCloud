# The mailbox Secret — empty, and empty is the design.
#
# ⚠ EVERY KEY THIS OBJECT EVER CARRIES IS A MAILBOX'S. A CyberCloud.Mail/domains/mailboxes resource
# writes `{local}.passwd`, `{local}.virtual` and one `{address}.claim` per address as a SECOND WRITER
# — docs/plan/09 § A second writer on an object — under the domain's shared co-writer manager. See
# charts/managed/mail-mailbox. This chart renders no `data` at all, so the domain's own field
# manager holds no key and re-applying the domain never removes a mailbox. Helm cannot co-write, so
# an install from this chart alone is a domain with no mailboxes.
#
# ⚠ The annotation is how a mailbox learns the mail domain: its own address carries only the
# domain RESOURCE's name, and a reconciler cannot read another resource's body without a role grant.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "mail.name" . }}-mail-users
  labels:
    {{- include "mail.platformLabels" . | nindent 4 }}
    {{- include "mail.selectorLabels" . | nindent 4 }}
  annotations:
    cybercloud.io/mail-domain: {{ lower .Values.domain | quote }}
