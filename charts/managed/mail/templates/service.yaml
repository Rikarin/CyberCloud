# How the shared pools reach this back end.
#
# ⚠ ClusterIP AT EVERY SETTING, WITH NO EXPOSURE PARAMETER AT ALL. Every other managed service in
# docs/plan/12 offers an optional external listener; this one must not, because docs/plan/17
# § Topology puts the front doors in shared pools. A tenant-addressable LoadBalancer here would be a
# second, unauthenticated way into the mail store that bypasses the pool doing the rate limiting and
# the reputation management — which is the entire product.
#
# ⚠ TWO NUMBERS PER PROTOCOL. Dovecot 2.4 runs unprivileged and cannot bind below 1024, so it listens
# on the 31xxx ports its own image uses; the Service maps the conventional port onto each, and a
# pool dials 143 without knowing.
#
# ⚠ INBOUND IS SMTP TO POSTFIX, AND THERE IS NO LMTP PORT HERE. The first two cuts exposed Dovecot's
# LMTP for the inbound pool, as docs/plan/17 § Topology drew it — and LMTP skips Postfix, so an alias,
# a forward or the catch-all never saw internet mail and Rspamd never scanned it. Port 25 is the
# domain's own Postfix, unauthenticated and relaying nowhere. MailDomains.SmtpPort.
#
# ⚠ SUBMISSION IS PLAINTEXT AUTH ON A ClusterIP, WHICH IS ONLY ACCEPTABLE BECAUSE OF WHERE IT IS. The
# shared submission pool terminates TLS and relays here; until it exists the port is reachable from
# inside the cluster only. MailDomains.SubmissionPort.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mail.service" . }}
  labels:
    {{- include "mail.platformLabels" . | nindent 4 }}
    {{- include "mail.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mail.selectorLabels" . | nindent 4 }}
  ports:
    - name: smtp
      port: 25
      targetPort: 25
    - name: imap
      port: 143
      targetPort: 31143
    - name: submission
      port: 587
      targetPort: 587
    {{- if .Values.sieve }}
    - name: sieve
      port: 4190
      targetPort: 34190
    {{- end }}
