# Conformance manifest — docs/plan/12 § The pattern, once, piece 8.
#
# What the conformance suite asserts about CyberCloud.Compute/virtualMachines. This file is data:
# `Build.Charts` checks that it is present, non-empty, and names the same resource type as Chart.yaml.
#
# ⚠ THE FIRST MANIFEST FOR A TYPE WITH A POWER STATE, and the first whose owed section carried the
# rest of an issue by name: #28 is "VMs + disks + images, scale sets, container instances". The
# first three nouns landed first; the scale set landed a batch later as its own type and chart
# (charts/managed/virtual-machine-scale-set), and container groups as their own family
# (charts/managed/container-group) — neither is owed from here any more.

resourceType: CyberCloud.Compute/virtualMachines
apiVersion: "2026-08-01"
chart: virtual-machine

# Objects the reconciler must have applied once the resource reports Succeeded.
#
# ⚠ ONE OBJECT FROM THE CHART AND, WHEN THE BODY NAMES CLOUD-INIT, A SECRET THE CHART CANNOT RENDER:
# `{name}-cloud-init` with the key `userdata`, written by the reconciler from the resolved vault
# handle. A chart carries values and a vault value must not become one, so the Secret is listed
# here as the reconciler's and not as a template. The root DataVolume is KubeVirt's, created from
# `spec.dataVolumeTemplates` and garbage-collected with the machine, and is not counted.
renders:
  - group: kubevirt.io
    version: v1
    kind: VirtualMachine
    count: 1
  # Only when the body names cloud-init; a body without it renders no Secret at all.
  - group: ""
    version: v1
    kind: Secret
    count: 1

# ADR-013 — every rendered object carries all seven labels.
labels:
  required:
    - cybercloud.io/tenant-id
    - cybercloud.io/subscription-id
    - cybercloud.io/resource-group
    - cybercloud.io/resource-id
    - cybercloud.io/resource-type
    - cybercloud.io/api-version
    - cybercloud.io/managed-by
  values:
    cybercloud.io/resource-type: cybercloud.compute_virtualmachines
    cybercloud.io/managed-by: cybercloud

# Behaviour a tenant is entitled to. Each is a statement the suite can fail on, not a feature list.
assertions:
  - id: the-power-state-is-on-the-object-and-survives-a-reconcile
    says: >
      After `POST …/stop` the VirtualMachine carries `spec.runStrategy: Halted`; a PUT that changes
      an unrelated property afterwards leaves it Halted; `POST …/start` puts Always back. ⚠ THIS IS
      THE ASSERTION THE DESIGN EXISTS FOR: the reconciler reads the run strategy off the object before
      every render and writes back what it found, so a stopped machine is not booted by a tag change.
      VirtualMachinePowerTests drives the sequence; the shared suite can only see the stop.
  - id: stop-releases-compute-and-keeps-every-disk
    says: >
      A halted machine has no VirtualMachineInstance and no launcher pod, so it holds no vCPU and no
      memory; its root DataVolume, its data disks and its cloud-init Secret are untouched. This is
      docs/plan/13's `deallocate` as well as its `stop` — § owed, `deallocate-is-stop`.
  - id: restart-deletes-the-instance-and-refuses-on-a-stopped-machine
    says: >
      `POST …/restart` on a running machine deletes the VirtualMachineInstance and KubeVirt's Always
      brings a new one up — exactly what `virtctl restart` does behind its subresource. On a halted
      machine it is refused with Conflict and the message names `start`.
  - id: the-size-is-what-the-guest-gets
    says: >
      A body with `size: s1.medium` renders `domain.cpu.cores: 2` and `domain.memory.guest: 8Gi`, and
      reserves 2 against QuotaMeter.Vcpu and 8 against QuotaMeter.MemoryGb — the same table on both
      sides, unlike the node pool's instancetype name. ComputeChartDriftTests holds the chart's copy
      of the table to VirtualMachines.Sizes.
  - id: the-root-disk-clones-the-named-image-in-this-namespace
    says: >
      `dataVolumeTemplates[0].spec.source.pvc` is `{name: <image>, namespace: <this namespace>}`, so a
      body cannot name another resource group's image whatever it says. A machine created while its
      image is still importing reports InProgress naming the image and its CDI phase; one created
      before its image exists is left to CDI's admission and recovers when the image lands.
  - id: cloud-init-is-a-handle-in-the-body-and-a-value-in-a-secret
    says: >
      `cloudInit.userData` is a vault handle; the reconciler resolves it once per pass, writes the
      value into `{name}-cloud-init` under `userdata`, and the VirtualMachine names the Secret. The
      value appears in no body, no grain and no rendered chart — docs/plan/13 § Virtual Machines,
      "SSH keys and passwords are SecretRefs resolved at render".
  - id: a-cloud-init-handle-names-the-tenants-own-vault-and-nothing-else
    says: >
      ⚠ THE ONE PLACE IN THE TREE WHERE A PATH A TENANT SPELLED IS RESOLVED AND ITS VALUE REACHES
      SOMETHING THE TENANT CAN READ. The vault has one platform-wide token and a namespace per
      platform, not per tenant (OpenBaoSecretResolver), so the path is the whole discriminator; every
      other consumer resolves a path the platform built as `tenants/{tenantId}/…`. A handle whose
      path is not under `tenants/{this tenant}/` is refused with AuthorizationFailed before the
      resolver is asked, on the first reconcile pass — the write path has no per-type validator —
      and the refusal names the tenant's own prefix, never whether the other path exists. Found by
      the adversarial review of #28: without it a body naming
      `tenants/<other>/CyberCloud.ContainerRegistry/registries/<id>#password` would hand another
      tenant's credential to a guest. VirtualMachineReconcilerTests holds a seeded vault to it.
  - id: a-data-disk-is-a-resource-name-and-not-the-machines-own-volume
    says: >
      Each `dataDisks` element is checked as a resource name, and against the machine's own volume
      names `os` and `cloudinit`, before a claim name is rendered: the reconciler's first pass refuses
      a body that fails either with InvalidRequestBody and the property named, so an arbitrary string
      never reaches `persistentVolumeClaim.claimName` and a duplicate volume name never reaches the
      webhook neither conformance suite has. ⚠ On the first pass and not at PUT — § owed,
      `data-disk-names-are-checked-at-reconcile`.
  - id: the-network-join-is-the-subnets-own-object-name
    says: >
      A body naming a virtual network and a subnet renders `ovn.kubernetes.io/logical_switch:
      {namespace}-{network}-{subnet}` on the pod template — the string NetworkSubnets.ObjectNameOf
      renders for that subnet — and a body naming neither renders no annotation. ComputeNetworkJoinTests
      compares the two spellings across the family boundary rule 2 forbids crossing in shipped code.
  - id: the-power-state-cannot-lose-a-race
    says: >
      ⚠ WAS `power-state-can-lose-a-race` IN § owed, AND IS CLOSED. A reconcile pass reads
      `spec.runStrategy` and applies it back a moment later; a start or stop landing between the two
      used to be overwritten by the pass. The apply is now conditional on the resourceVersion the pass
      read (IKubeCommandBuilder.IfResourceVersion, the platform change the row asked for), a moved
      object refuses it as ApplyResult.Stale with nothing written, and the next pass reads what the
      action left. The power handler's own apply carries the version it read too and reads again, up
      to three times, when a pass landed first. VirtualMachinePowerTests
      .AStopThatLandsBetweenAPassReadAndItsApplyIsNotOverwritten drives the race;
      PreconditionAndLogTests.AnApplyCarryingAVersionTheObjectMovedPastIsStaleAndWritesNothing holds
      the lock to a real API server.
  - id: converged-follows-kubevirts-verdict
    says: >
      A machine is Succeeded when KubeVirt reports Running, or Stopped on a halted machine; every other
      printable status is InProgress with KubeVirt's word and, when the instance could not be placed,
      the scheduler's sentence — "Insufficient devices.kubevirt.io/kvm" on a node with no KVM device.
      ⚠ On the k3s-in-Docker lane the verdict is Running: the first machine rendered from this chart
      booted under KVM 46 seconds after the apply (CyberCloud.Providers.Compute.KubeVirt.Cluster.Conformance
      § KubeVirtOnAnEmptyCluster, 2026-09-17), against a record that said the lane had no /dev/kvm.

# Meters the type must emit.
#
# ⚠ THE ROOT DISK AND NOTHING ELSE UNDER STORAGE. A data disk is metered on CyberCloud.Compute/disks,
# which owns the claim; summing them here would reserve every attached gibibyte twice.
meters:
  - meter: resources
    amount: 1
  - meter: vcpu
    amount: the size's cores
  - meter: memoryGb
    amount: the size's guest memory
  - meter: storageGb
    amount: osDiskSize

# ── owed ──────────────────────────────────────────────────────────────────────────────────────────
owed:
  - id: the-guest-is-not-reached
    says: >
      ✅ A VIRTUAL MACHINE HAS RUN ON THIS PLATFORM, AND THE ROW THAT SAID IT COULD NOT ON THIS LANE
      WAS WRONG. CyberCloud.Providers.Compute.KubeVirt.Cluster.Conformance § KubeVirtOnAnEmptyCluster
      — in the Cluster lane of Test since #28's review, every merge and never a PR, for the eight
      minutes it costs — installs CDI and KubeVirt through install.sh,
      imports an image through charts/managed/image, provisions a disk through charts/managed/disk
      and applies this chart naming it against them: KubeVirt's validating webhook admits the render,
      CDI clones the image into the root disk on the bundle's class, the scheduler places the
      launcher with the KVM device it asked for, the machine reports Running 46 seconds after the
      apply (2026-09-17), the disk is populated once the machine consumes it and the launcher mounts
      its claim, and VirtualMachines.Matches holds against the admitted object. Issue #95
      and charts/bundle/bundle.yaml § owed said Docker Desktop's VM lends no /dev/kvm to a container;
      it does, to a privileged one, because WSL2 runs with nested virtualization — nobody had
      measured it. The test asserts Running, the device on the node and on the launcher's requests,
      so a node WITHOUT KVM turns it red with the reason in the message.
      ⚠ WHAT IS STILL OWED IS THE GUEST. Running is libvirt's word for a domain that started; nothing
      here reaches a console, a serial log or a guest agent, so whether cirros finished booting,
      whether cloud-init would have run on an image that ships it, and whether an attached disk
      appears inside the guest are unproven. virt-api's `console` and `vnc` subresources are the
      route (see `no-serial-console`), and a guest-agent condition on the instance is the cheaper
      first assertion once the catalogue image — which ships the agent — is the one the test imports,
      at the cost of a several-hundred-megabyte pull.
  - id: deallocate-is-stop
    says: >
      docs/plan/13 lists `deallocate` beside `stop` as "the billing-relevant one". On KubeVirt a
      halted machine already releases its compute and keeps its disks — there is no
      stopped-but-allocated state for a second action to mean — so `stop` is both and `deallocate`
      is not declared. What is still owed is the BILLING half: the vCPU and memory meters are
      reserved against the body whether the machine is running or halted, because quota is a
      reservation (docs/plan/06 § Quota) and the usage pipeline that would bill only running hours
      is docs/plan/22's and not built.
  - id: snapshot-is-not-offered
    says: >
      docs/plan/13's `snapshot` action needs a VirtualMachineSnapshot, which needs a
      VolumeSnapshotClass for the disks' storage class. The bundle's node-local class has none;
      LINSTOR's does — charts/bundle/bundle.yaml § owed, `the-replicated-stage-is-not-installed`.
  - id: resize-takes-effect-at-the-next-start
    says: >
      `size` is mutable and KubeVirt applies a changed cpu/memory to the next instance, reporting
      RestartRequired until then. docs/plan/13 wants a resize to "require a stop"; this API accepts
      the PUT on a running machine and the machine keeps running at its old size until a restart. A
      refusal on a running machine needs the WRITE PATH to read the object's power state, which the
      manager cannot do today: the reconciler reads it, after the 202, and nothing before.
  - id: images-are-per-resource-group
    says: >
      A machine clones an image in its own namespace, by name. CDI authorises a cross-namespace clone
      against the creator of the DataVolume — KubeVirt's controller, for a template — through a
      SubjectAccessReview this platform has not reasoned about, so a shared image catalogue that a
      tenant's resource groups all clone from is not offered; each group imports its own. The same
      shape charts/managed/kube-ovn-snat records as `the-address-must-be-in-the-same-resource-group`.
  - id: data-disk-names-are-checked-at-reconcile
    says: >
      `dataDisks` declares no per-element Pattern or MaxLength, and not because the registry cannot
      carry them — SchemaProperty applies both per element and ResourceSchema.Validate would enforce
      them at PUT — but because `./build.sh Charts` refuses `@pattern` and `@length` on a `{array}`
      @param, the standing gap charts/managed/kafka/conformance.yaml records as
      `cidr-shape-is-unenforced` and charts/README.md § What a chart cannot say enumerates the sites
      of. So a bad element is a 202 followed by a Failed operation naming the property, rather than a
      400; VirtualMachines.DataDiskProblem is the check, and the day the chart surface carries the
      constraint it moves to the schema and this row goes. The same shape as `cloudInit.userData`'s
      tenancy check and the image reconciler's empty-url refusal: the write path has no per-type
      validator, so every relation the schema cannot state is refused on the first pass.
  - id: the-joins-are-not-resolved-before-202
    says: >
      `image`, each `dataDisks` entry, `network.virtualNetwork` and `network.subnet` are NAMES whose
      shape the schema checks and whose existence nothing on the write path can ask about. A disk
      that is not there is `ErrorPvcNotFound` from KubeVirt, a subnet that is not there is a launcher
      pod the fabric never gives an address, and both reach the tenant through the reconciler's
      InProgress message rather than through a 4xx. The reader charts/managed/kube-ovn-snat owes is
      the same reader this family owes.
  - id: a-disk-may-be-named-by-two-machines
    says: >
      Nothing checks that a disk is attached to at most one machine. Two bodies naming one disk render
      two claims on one ReadWriteOnce volume, and the second machine to start is refused by the
      scheduler or the CSI driver rather than by this API. Closing it is the reader above, asked the
      other way round.
  - id: instancetypes-wait-for-the-bundles-catalogue
    says: >
      docs/plan/13 wants the size to be a VirtualMachineInstancetype from the platform catalogue.
      charts/bundle installs no catalogue, charts/managed/kubernetes-agentpool renders a name it does
      not resolve and records the belief that costs, and this chart renders quantities instead so
      the guest gets what quota reserved. The day the bundle ships the catalogue, both charts move to
      the name and the sizing table is spelled once.
  - id: one-interface-and-no-floating-ip
    says: >
      docs/plan/13's "a NIC per subnet, optional floating IP, security groups" is one interface here,
      on one subnet or the pod network, with no floating address and no security group on the
      machine. A second interface is a Multus attachment the bundle does not install; a floating IP
      is an OvnFip charts/managed/kube-ovn-eip records as not rendered; a security group on a VM is
      the NSG family's `nothing-can-join-a-network-yet` from the other side.
  - id: converged-is-not-ready
    says: >
      A VirtualMachine that reads back as applied and carries no status at all converges — the
      branch a harness with a derived CRD stub and no KubeVirt lands on, the same branch
      charts/managed/kubernetes records under this id. A real cluster writes a printable status
      within seconds, and the reconciler follows it; the shared suites never see that branch.
  - id: no-recovery-window
    says: >
      No SupportsSoftDelete, and the reason is a disk's: a machine's teardown detaches its disks and
      a restore would reattach them, and a disk another machine took in between is a disk this
      provider cannot see. The window lands with the reader that can.
  - id: no-serial-console
    says: >
      docs/plan/13's "Serial + VNC over the terminal hub" needs virt-api's `console` and `vnc`
      subresources reached through docs/plan/19's hub, which the Terminal family has not grown a
      KubeVirt route for. Nothing here reaches a guest.
  - id: grafana-dashboard
    says: >
      Sixth sighting of charts/managed/nats' item of the same name. KubeVirt exports guest CPU,
      memory and network metrics per instance through virt-handler; nothing here scrapes or shows
      them.
  - id: customer-managed-keys
    says: >
      CyberCloud.Compute/virtualMachines. OWED, AND ADDED BY THE #30 REVIEW. THE ENGINE STEP is
      charts/managed/disk's for the root disk, which this chart clones from an image into a volume
      of its own (`the-root-disk-clones-the-named-image-in-this-namespace` above), and nothing in the
      bundle encrypts a block volume. The data disks are CyberCloud.Compute/disks and carry that
      type's row. The cloud-init user data is resolved from a handle in the tenant's own vault path
      into a Secret, so it rests in the vault and in the cluster's etcd rather than on a volume.
      What every family still needs is docs/plan/18 § What customer-managed keys still need: (1) a
      key-use seam — the grant is expressible today, `keyVaultCryptoUser` with principalType
      `resource` on a CyberCloud.KeyVault/vaults, but `ctx.View` is read-only by construction and
      wrapKey/unwrapKey are actions, so no reconciler can call them; (2) an `encryption.keyUri`
      property on a NEW api-version of this type; (3) revocation — a disabled key taking the data
      offline, which needs a re-unwrap on a schedule nothing runs. The key's home is no longer the
      blocker: CyberCloud.KeyVault/vaults was published on 2026-09-23. None of this row is started.
