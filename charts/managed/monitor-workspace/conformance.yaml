# Conformance manifest — docs/plan/12 § The pattern, once, piece 8.
#
# What the conformance suite asserts about CyberCloud.Monitor/workspaces. This file is data:
# `Build.Charts` checks that it is present, non-empty, and names the same resource type as
# Chart.yaml. The suite that reads the rest of it lives in test/ and does not exist yet, and the
# target says so in its own log rather than implying otherwise.

resourceType: CyberCloud.Monitor/workspaces
apiVersion: "2026-08-01"
chart: monitor-workspace

# Objects the reconciler must have applied once the resource reports Succeeded, in apply order.
#
# ⚠ THREE, TWO CORE KINDS AND ONE CUSTOM, AND NONE OF THEM BECOMES A POD. Every other row in this
# directory renders a workload. A workspace is a tenancy in stores the platform already runs, so what
# it renders is a credential, a routing rule and a row. The Secret is applied first because the
# VMUser names it in passwordRef; the row is applied LAST because it is what announces the workspace
# to the region's ingest, and a row that appeared before its key and routing would advertise a
# workspace as ready while every write to it was refused.
renders:
  # ⚠ The platform writes this rather than any operator, and it is the second object in the catalogue
  # whose CONTENT is a credential (charts/managed/seaweedfs' identities file was the first). It is
  # built from what the tenant's vault returned, inside one reconcile pass, and the workspace's body
  # has no property that carries it — which is why this directory has no template for it.
  - group: ""
    version: v1
    kind: Secret
    count: 1
  - group: operator.victoriametrics.com
    version: v1beta1
    kind: VMUser
    count: 1
  - group: ""
    version: v1
    kind: ConfigMap
    count: 1

# ⚠ THERE IS NO `requiredCrds:` BLOCK HERE, AND ITS ABSENCE IS CORRECT.
# `ProviderConformanceCase` has no `RequiredCrds` member and never had one — the harness DERIVES the
# definitions from the case's own `Objects`, which already carries group, version, kind and plural.
# What is new here: this is the first case where the derivation has to produce a stub for SOME of the
# kinds and not others. A bare k3s serves /api/v1/.../configmaps and /secrets without being told and
# serves no path for operator.victoriametrics.com/v1beta1.

# ADR-013 — every rendered object carries all seven labels. Asserted against real rendered output,
# which is what the Labels architecture gate in docs/plan/23 § The architecture gates requires.
labels:
  required:
    - cybercloud.io/tenant-id
    - cybercloud.io/subscription-id
    - cybercloud.io/resource-group
    - cybercloud.io/resource-id
    - cybercloud.io/resource-type
    - cybercloud.io/api-version
    - cybercloud.io/managed-by
  # ⚠ Not the resource type verbatim. A `/` is not a legal label value character, so the value is
  # lower-cased with `/` replaced by `_` — KubeLabels.ResourceTypeValue.
  values:
    cybercloud.io/resource-type: cybercloud.monitor_workspaces
    cybercloud.io/managed-by: cybercloud
  # ⚠ AN EIGHTH LABEL, ON ONE OBJECT OF THE THREE, AND IT IS THE FIRST TIME A PROVIDER HAS ADDED ONE.
  # The seven identify a resource; this one says what an object IS, so that a watcher can select
  # every workspace's row across every namespace in a region without encoding "the one whose kind is
  # ConfigMap" as a rule about this provider's object list.
  additional:
    cybercloud.io/telemetry-row: workspace

# Behaviour a tenant is entitled to. Each is a statement the suite can fail on, not a feature list.
assertions:
  - id: metrics-round-trip
    says: >
      A Prometheus remote-write to the endpoint listKeys returned, authenticated with the key
      listKeys returned, is queryable back through the PromQL endpoint listKeys returned.
  - id: one-workspace-cannot-read-anothers-metrics
    says: >
      A client holding workspace A's ingest key cannot write to or read from workspace B's accountID
      by any request it can construct — including one that spells an accountID in its own path.
      ⚠ THE SINGLE MOST IMPORTANT ASSERTION ON THIS TYPE. It is what the VMUser's
      `target_path_suffix` exists for, it is the one thing this type sells, and no unit test can make
      it because it is a property of vmauth's routing rather than of the rendered document.
  - id: logs-round-trip
    says: >
      An OTLP log record sent to the OTLP endpoint appears in a SELECT against the database listKeys
      returned, and does not appear in any other workspace's database.
  - id: over-quota-samples-and-says-so
    says: >
      A workspace pushed past its daily allowance keeps accepting at the declared sample rate, the
      accepted fraction is reported on the blade, and NOTHING IS DROPPED SILENTLY — docs/plan/16
      § Cost and retention honesty. A workspace at 100% over quota that stops accepting entirely
      fails this.
  - id: a-cardinality-bomb-is-refused-by-name
    says: >
      A metric carrying a request id in a label is rejected once the workspace's cardinalityCap is
      crossed, and the rejection NAMES THE OFFENDING LABEL. A rejection that says only "too many
      series" fails this, because the client will just retry.
  - id: retention-is-honoured-per-signal
    says: >
      Data older than the tier's day count is gone and data younger than it is present, for each of
      the three signals independently. ⚠ On metrics this is a property of WHICH vmstorage group the
      workspace was routed to, not of any per-tenant setting — see SOURCE.
  - id: retention-shortens-nothing
    says: >
      A PUT that lowers any retention tier is refused and destroys no data. The workspace's old tier
      is still in effect afterwards and every record it held is still readable.
  - id: secrets-never-round-trip
    says: A GET of the resource never returns the ingest key in any form. The only path out is the listKeys action.
  - id: a-delete-takes-the-tenancy-down-and-stops-the-writes
    says: >
      After DELETE the old address answers the canonical 404, the VMUser is gone, the ingest key
      authenticates nothing, and no further telemetry is accepted or billed. ⚠ ALL FOUR HOLD WITH A
      SEVEN-DAY RECOVERY WINDOW DECLARED, and that combination is what the window was withdrawn over
      and re-declared for: a soft delete tears the data plane down, so the write path closes at the
      delete rather than at a purge, and what the window holds is the name, the stored body, the
      committed quota and the tenant's data in the stores this row is a tenancy in. See § owed,
      `soft-delete-was-withdrawn-and-is-declared-again`.

# ── Owed ────────────────────────────────────────────────────────────────────────────────────────
#
# What this row does NOT do, each with what closes it. A gap that is written down is a decision; a
# gap that is not is a defect somebody rediscovers.
owed:
  - id: nothing-consumes-the-row
    says: >
      CyberCloud.Ingest.Host does not exist — docs/plan/03 § Hosts plans it, src/Hosts holds four
      hosts and not that one. So the row's logs and traces retention, all three daily allowances,
      the series cap, the cardinality cap and the over-quota sample rate are published and enforced
      by nobody. ⚠ THIS IS THE LARGEST SINGLE GAP ON THE ROW and it is deliberately not hidden
      behind the half that does work: the VMUser is enforced by vmauth the moment it is applied, and
      everything else here is a promise with a schema. ⚠ SINCE 2026-09-17 THE ROW IS READ, BY TWO
      PODS AND FOR THREE KEYS: the collector under this workspace and the Grafana pointed at it name
      `accountId` and `database` by configMapKeyRef and the ingest key's Secret by secretKeyRef, and
      the kubelet substitutes them at pod start (MonitorWorkspaces.WorkspaceEnv). That is a reader
      of the tenancy coordinates and not of the enforcement half; the sentence above stands for the
      caps and the allowances.
    closes: The ingest host, watching ConfigMaps labelled cybercloud.io/telemetry-row across the region.
  - id: clickhouse-ttl-is-published-not-applied
    says: >
      A per-workspace logs and traces retention IS expressible in ClickHouse — `TTL expr + INTERVAL n
      DAY` per table, alterable with `ALTER TABLE … MODIFY TTL` — and nothing in this catalogue
      applies SQL. So the database this row names is never created and its tables never get a TTL.
      ⚠ This is the reverse of the VictoriaMetrics limit below: the store CAN do it and the platform
      has no way to ask.
    closes: A schema step on the ingest host, which is the only component holding a ClickHouse connection.
  - id: metrics-retention-is-routing-because-per-tenant-retention-is-enterprise
    says: >
      docs/plan/16 prices per-signal metrics retention per workspace. Open-source VictoriaMetrics has
      one `-retentionPeriod` per vmstorage node; `-retentionFilter` and `-downsampling.period` are
      enterprise. This row takes upstream's own open-source answer — one vmstorage group per tier,
      selected by routing — which means the three per-tier VMClusters must exist in every region and
      must be provisioned with the day counts in MonitorWorkspaces.RetentionDays. NOTHING CHECKS
      THAT, and a mismatch is a workspace billed for 400 days of metrics that are deleted after 30.
    closes: charts/bundle/ rendering the three VMClusters from the same table, plus a gate comparing them.
  - id: vmcluster-is-named-not-resolved
    says: >
      The VMUser names a VMCluster by name and namespace and nothing verifies either exists. A wrong
      telemetryNamespace or a missing tier group produces an object that applies cleanly, reads back
      cleanly and converges, and routes to nothing — which vmauth reports to the tenant's collector
      as a bad gateway and reports to us not at all. Same shape as charts/managed/clickhouse's Keeper
      Service name, second sighting.
    closes: A reconciler-side existence check, or an admission policy in the bundle.
  - id: suffix-is-inferred-from-two-halves
    says: >
      `target_path_suffix: /insert/{accountID}/prometheus` is assembled from two separately verified
      upstream facts — the operator's own example, which stops at `/insert/1`, and VictoriaMetrics'
      cluster URL grammar, which spells `/insert/<accountID>/prometheus/api/v1/write`. No upstream
      example spells the combination. It is the string that makes cross-tenant reads impossible, so
      inference is not good enough forever.
    closes: The `one-workspace-cannot-read-anothers-metrics` assertion above, against a real vmauth.
  - id: accountid-is-folded-not-allocated
    says: >
      MonitorWorkspaces.AccountId folds the resource GUID to 32 bits because VictoriaMetrics'
      accountID is a 32-bit integer and a derived value needs no allocator and no grain. A fold is not
      a bijection: the birthday bound puts a collision at even odds around 77 000 workspaces, which is
      inside target scale, and two workspaces sharing an accountID read each other's metrics. ⚠ The
      first thing to consume this value is the thing that enforces isolation.
    closes: >
      An allocator — either an accountID grain per region, or `accountID:projectID` (VictoriaMetrics
      accepts both as arbitrary 32-bit integers), which makes the space 64 bits and the collision
      negligible without adding durable state.
  - id: retention-shrink-is-refused-after-202
    says: >
      Shortening a retention destroys data, and the refusal is in the reconciler because it cannot be
      at the API: ResourceSchema validates one body against constants with no access to the previous
      body, and IResourceTypeBuilder declares no provider-supplied validator. So the caller is told
      202 and then the operation fails. Fifth sighting of that seam after virtualNetworks' address
      overlap, ContainerService's version skew, seaweedfs-bucket's cluster and clickhouse's volume
      shrink — and the first where the consequence is irreversible destruction of tenant data.
    closes: A provider-supplied predicate on ResourceManagerService's write path, taking the previous body.
  - id: ingest-keys-are-not-a-child-type
    says: >
      docs/plan/16 makes ingestKeys a sub-resource, "rotatable with a grace period". A grace period is
      two live credentials at once; ISecretWriter mints once and does not replace. Second sighting of
      the blocker CyberCloud.Storage/accounts records against regenerateKeys, and the first where it
      decides a whole resource type rather than one action.
    closes: A two-slot secret shape in ISecretWriter — current and previous, with an expiry on previous.
  - id: soft-delete-was-withdrawn-and-is-declared-again
    says: >
      ⚠⚠ THIS TYPE WAS THE FIRST IN THE TREE TO DECLARE SupportsSoftDelete, IT WITHDREW THE
      DECLARATION ON 2026-08-18, AND IT DECLARES IT AGAIN. The entry is kept rather than deleted
      because the withdrawal was a measurement and the measurement is what closed the defect.
      ⚠ WHAT WAS MEASURED, in the shipping source, three ways: OperationGrain.DriveAsync returned
      early for a soft delete and ran NO pass, so every applied object was left exactly as it was;
      ParkAsync stated that the quota stays committed until purge; and the object left standing was
      the VMUser, which is the ONE thing on this row that enforces anything, because vmauth resolves
      it the moment it is applied. So a soft-deleted workspace was an authenticated, BILLED, open
      write path into a store the tenant believed was gone — a collector nobody reconfigured kept
      writing, the retention kept accruing, and the only way to stop it was a purge behind a
      permission the tenant may not hold. A delete that does not delete is worse than no recovery
      window.
      ⚠ AND WHAT DID NOT REPRODUCE IS WHY THE FIX LANDED WHERE IT DID.
      CyberCloud.ContainerRegistry/registries reported a soft-deleted resource RECONCILING ITS DATA
      PLANE BACK — an active re-apply — and on this type that path was not reachable: driving the
      completed delete operation again returned nothing, and disabling OperationGrain's soft-delete
      branch made the pass run with tearingDown TRUE, so it DESTROYED the objects rather than
      re-applying them. Recording the disagreement instead of inheriting the other row's answer is
      what made it findable. That row's evidence was a conformance assertion reporting an END STATE,
      and an end state cannot tell "never torn down" from "torn down and re-applied".
      ⚠ HOW IT WAS CLOSED, WHICH IS EXACTLY WHAT THIS ENTRY ASKED FOR. A soft delete now runs the
      teardown, so the VMUser comes down and the write path closes; the window holds the name, the
      workspace's stored body, the committed quota and — for the stores this row is a tenancy IN —
      the data, which no teardown of a VMUser or a ConfigMap could remove. A restore re-applies the
      same three objects through OperationKind.Restore, and the conformance experiment above asserts
      all three halves: the write path closed, no stray drive reopening it, and the restore putting
      it back.
  - id: nothing-here-owns-a-claim-so-the-window-is-not-hollow
    status: closed
    closed: 2026-09-15
    says: >
      ⚠ EXAMINED FOR #69, WHICH ASKED THAT EVERY TYPE DECLARING A WINDOW BE CHECKED FOR THE SHAPE
      THAT MADE CyberCloud.DBforPostgreSQL/servers' WINDOW HOLLOW: an operator that creates the
      resource's PersistentVolumeClaims and stamps a controller reference on them, so the teardown's
      delete garbage-collects the data before the window starts. This row does not have that shape,
      and the reason is recorded so the next examination starts from evidence. The reconciler applies
      a ConfigMap, a Secret and a VMUser and nothing else; none of the three is a claim, none owns a
      claim, and the operator that acts on the VMUser (victoria-metrics-operator) creates no claim on
      its behalf — it rewrites vmauth's configuration. The data a workspace holds lives in the shared
      VictoriaMetrics and ClickHouse stores the row is a tenancy IN, under their own retention, and no
      teardown of this row's three objects can reach it. So what the soft delete tears down is the
      write path, what the window holds is the name, the stored body, the committed quota and the
      data's retention clock, and a restore re-applying the three objects hands back exactly what was
      taken — which `soft-delete-was-withdrawn-and-is-declared-again` above already measured.
      ⚠ AND THE SHARED CASE SKIPS THIS FAMILY, CORRECTLY: it renders no volumeClaimTemplate and
      declares no operator-owned claim, and the skip message now names both, so a reader of the run
      sees why rather than a green with nothing behind it.
  - id: no-external-endpoint
    says: >
      Every endpoint listKeys returns is in-cluster. docs/plan/12 § Cross-cutting decisions requires an
      explicit CIDR allow-list on any exposure, and this type declares no exposure property at all —
      the same decision charts/managed/kubernetes took, and for the same reason: a property that
      renders nothing is worse than the absence.
    closes: An ingress with a source-range list, once the exposure axis exists platform-wide.

  # ── workspaces/alertRules — #32 ─────────────────────────────────────────────────────────────
  #
  # ⚠ THE CHILD TYPE IS CHARTLESS AND CLUSTERLESS, SO ITS DEBTS ARE RECORDED ON ITS PARENT'S CHART.
  # CyberCloud.Monitor/workspaces/alertRules converges a spec onto an evaluator grain and applies
  # nothing to any cluster; there is no charts/managed/monitor-alert-rule for a conformance.yaml to
  # sit in. The sending module's clusterless types record theirs in charts/bundle/bundle.yaml
  # because that family has no chart at all; this family has one, and a rule's whole meaning is a
  # query against the workspace this chart renders the tenancy for, so this is the file a reader
  # looking for what an alert rule does not yet do will open.
  - id: alert-rules-query-seam-is-refusing
    says: >
      No host registers an IAlertQuerySeam, so every alert rule in this tree is evaluated against
      UnavailableAlertQuerySeam: the query is not run, the rule records the refusal as its lastError
      and stays where it is — a store that does not answer neither fires nor resolves, by design,
      and AlertEvaluatorTests pins that — and nobody is paged. ⚠ THIS IS THE LARGEST SINGLE GAP ON
      THE TYPE and it is deliberately a refusal rather than a stub: a seam answering "no samples"
      would report every rule ok forever. What the seam owes, so that whoever writes it starts from
      the contract rather than from the interface's name: a MetricsQL /api/v1/query against the
      query gateway under the workspace's accountID for `signal: metrics`, and a SQL query under
      the workspace's database for `signal: logs`, BOTH resolved from the workspace's address —
      the evaluator carries the canonical path, not the GUID, because a child's pass never learns
      its parent's GUID — which means reading the row this chart renders, or the index; the
      look-back honoured as a hard range; the cancellation token honoured, because the evaluator
      sets it to QueryTimeout; and for `logs`, a refusal or a rewrite of any expression that names
      a database, because a MetricsQL expression cannot choose an account and a SQL one can.
    closes: >
      An IAlertQuerySeam over the query gateway, registered by the silo host before
      AddCyberCloudMonitorAlerting's TryAdd — and the metrics-round-trip assertion above extended to
      "a rule over the written series fires", against a real VictoriaMetrics, which is the only place
      the accountID isolation of the query half can be proved.
  - id: alert-rules-one-instance-per-rule
    says: >
      A rule whose query returns several series — one per instance, which is what a MetricsQL query
      over a workspace usually returns — fires ONE instance carrying the worst offending value, not
      one per series. Azure fires per dimension. The schema has no array of objects (the remarks on
      SchemaKind.Array), so an action group is one channel and a list of recipients, and an instance
      is one line; per-series instances would need the labels on the wire as a shape the schema
      cannot spell. The notification names the value that crossed the line and not which series
      carried it.
    closes: The api-version that grows the tree — the same api-version the sending module's multi-locale templates wait on.
  - id: alert-rules-evaluator-key-borrows-the-resource-shape
    says: >
      IAlertEvaluatorGrain is keyed res/{guid:N} with a GUID derived from the WORKSPACE's canonical
      path — MonitorAlertRules.EvaluatorIdFor — because a rule's reconcile pass knows its workspace by
      name only, and asking the index is forbidden. The key borrows GrainKeys.Resource's shape for
      something that is not a resource, which is the borrowing CommunicationGrainKeys records and
      costs the same: a repair tool routing by GrainKeyKind would send this key to IResourceGrain,
      and a workspace deleted and recreated under one name lands on one evaluator (harmless here:
      its rules left with it, and their instances with them). The honest follow-up is the one that
      module named — a shape of its own in GrainKeys, a Core change with a Core review — and it is
      now owed by two families rather than one.
    closes: A derived-key shape in GrainKeys, reviewed once for both families.
  - id: alert-rules-are-not-driven-by-vmalert
    says: >
      docs/plan/16 § The stack names vmalert as the evaluator and cc.{tenant}.alerts as the path to a
      notification grain. Neither is here: the evaluator is one grain per workspace on an Orleans
      reminder (docs/plan/04 § Reminders, the fifth use), and § Alerts' landed section says why —
      vmalert would have put a VMRule per workspace, an Alertmanager-webhook receiver and NATS in
      front of the notification, three things that do not exist. What the reminder costs that
      vmalert would not: evaluation runs on the control plane's silos, one query per rule per
      interval, and the limits are the schema's and the grain's rather than the store's own. If the
      catalogue's alert volume ever makes that the wrong trade, the seam to swap is IAlertQuerySeam
      (vmalert as the thing that answers) and the reminder is what goes.
    closes: Nothing, unless measured evaluation load says so; recorded because the plan says the other thing.
  - id: alert-rules-webhook-and-inbox-not-landed
    says: >
      docs/plan/16 § Alerts promises fan-out to "email, SMS, WhatsApp, webhook, and a portal inbox".
      The landed action group is ONE channel of the sending module's ChannelKind — sms, whatsapp,
      email, push, voice — because the notification goes through IMessageSender and that is the set
      it sends. A webhook is not a channel the sending module has (its carriers are people-facing
      and a webhook's authentication is a signature the receiver verifies, not a suppression list),
      and a portal inbox is not a channel at all: it is a store the portal reads, which the
      evaluator's own instance history is the nearest thing to — listInstances renders it — with no
      unread state and no portal page. Neither is in the schema's channel vocabulary, so a tenant
      cannot ask for either and be silently refused; they cannot ask at all. (2026-09-15, #32 review:
      the document promised five and the type offers a different five.)
    closes: >
      A webhook ChannelKind in the sending module with signed delivery and a receipt, which is that
      module's design to make; and a portal inbox surface reading the instance history, which is a
      portal page and an unread marker on the instance, at the api-version that grows the tree.
  - id: observability-app-insights-views-not-landed
    says: >
      Issue #32 names four tenant-facing surfaces — "application-insights-shaped views; an OTel
      collector as a managed service; managed Grafana; alerts" — and three are published: the alerts
      (2026-09-15), and on 2026-09-17 CyberCloud.Monitor/workspaces/collectors with
      charts/managed/monitor-collector and CyberCloud.Dashboard/grafanas with charts/managed/grafana,
      each with its own conformance.yaml § owed. The App Insights-shaped views are the noun left:
      not a resource type, not a chart, not a portal page, and docs/plan/16 neither designs nor
      prices them, so there is nothing to build until the document says what an "App Insights-shaped
      view" over a workspace's stores is. (This row used to be
      `observability-three-of-four-nouns-not-landed`; two of the three landed and the id follows.)
    closes: docs/plan/16 designing the views first — which store they read, what they show, whether they are a resource or a portal surface — and then the landing.

# Meters the type must emit — docs/plan/12 § The pattern, once, piece 3.
#
# ⚠ NO vcpu AND NO memory METER, because a workspace runs nothing. The one derived meter is storage,
# and its two factors are the retention tier and the daily allowance — which is where docs/plan/16
# § Cost and retention honesty's "retention is a paid property" stops being a sentence and becomes an
# amount reserved against a subscription.
meters:
  - monitor.ingest.gib
  - monitor.retained.gib.hours
