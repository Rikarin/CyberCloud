# A subnet inside a tenant's virtual network — the configuration surface, once.
#
# ⚠ EVERY NON-`@internal` BLOCK BELOW IS GENERATED from NetworkSubnets.Schema2026 by
# `./build.sh Charts`, and so is values.schema.json. ADR-010 § Which end authors the schema: "The C#
# ResourceSchema is authored. The chart's @param annotations are generated from it and diffed."
#
# ⚠ TWO PREFIX PROPERTIES, AND THE SUBSTRATE WANTS ONE COMMA-SEPARATED STRING. Kube-OVN spells
# dual-stack as `cidrBlock: "10.20.1.0/24,fd00:20:1::/64"`, IPv4 first, split on `,` by
# util.CheckProtocol. Exposing that spelling would make the property unpatternable in practice and
# put the ordering rule in a description where nothing enforces it. The join happens in
# `NetworkSubnets.CidrBlock`, so "IPv4 first" is a fact of a function rather than of a tenant's
# typing.

## @param addressPrefix {object} The range addresses are allocated from.
addressPrefix:
  ## @param v4 {string} The IPv4 prefix, in CIDR form. ⚠ Host bits are cleared by the fabric, so 10.20.1.7/24 is stored as 10.20.1.0/24 and both name the same network. It may not overlap a range the platform reserves, which is refused with the conflicting range named.
  ## @required
  ## @immutable
  ## @pattern (\d{1,3}\.){3}\d{1,3}/\d{1,2}
  ## @example "10.20.1.0/24"
  v4: "10.20.1.0/24"
  ## @param v6 {string} The IPv6 prefix, or empty for an IPv4-only subnet. Setting both makes the subnet dual-stack — docs/plan/14 § IPv6.
  ## @immutable
  ## @pattern ([0-9A-Fa-f:.]+/[0-9]{1,3})?
  ## @example "fd00:20:1::/64"
  v6: ""

## @param natOutgoing {boolean} Whether workloads in this subnet reach the internet through source NAT. Off by default. ⚠ This is the opposite of Kube-OVN's own default for its cluster subnet, deliberately: a tenant subnet that silently egresses is a surprise, and docs/plan/12 § Cross-cutting decisions defaults external exposure to off. It also requires the network's enableExternal to be on; without it the flag is accepted and nothing egresses.
natOutgoing: false

## @param private {boolean} Whether the subnet refuses traffic from other subnets. Off by default. ⚠ In this api-version it has no exception list, so on means no traffic from any other subnet in the network at all.
private: false

## @param enableDhcp {boolean} Whether the fabric answers DHCP in this subnet. Off by default: an address is assigned to a workload's port when the port is created, and DHCP is for guests that insist on asking — a virtual machine rather than a container.
enableDhcp: false

## @param platform {object} Resource identity injected by the reconciler. Not a tenant-facing setting.
## @internal Written by the reconciler from the resource's own identity. A tenant cannot set it, so it is not part of the resource body.
platform:
  ## @param tenantId {string} Tenant GUID, rendered into the cybercloud.io/tenant-id label.
  tenantId: ""
  ## @param subscriptionId {string} Subscription GUID, rendered into the cybercloud.io/subscription-id label.
  subscriptionId: ""
  ## @param resourceGroup {string} Resource group name, rendered into the cybercloud.io/resource-group label.
  resourceGroup: ""
  ## @param resourceId {string} Resource GUID, rendered into the cybercloud.io/resource-id label.
  resourceId: ""
  ## @param resourceType {string} Fully qualified resource type, rendered into the cybercloud.io/resource-type label.
  resourceType: CyberCloud.Network/virtualNetworks/subnets
  ## @param apiVersion {string} The api-version the resource was last written at, rendered into the cybercloud.io/api-version label.
  apiVersion: "2026-08-01"
  ## @param managedBy {string} Value of the cybercloud.io/managed-by label. Constant, and the selector every informer filters on.
  managedBy: cybercloud
  ## @param parentName {string} The Vpc object name this subnet binds to. Rendered into spec.vpc. ⚠ Already qualified by the reconciler — it is VirtualNetworks.ObjectNameOf's output, not the tenant's network name.
  parentName: ""

## @param nameOverride {string} Replace the generated object-name stem. Empty means derive it from the release name.
## @internal Helm plumbing. Nothing about it belongs in a resource body.
nameOverride: ""
