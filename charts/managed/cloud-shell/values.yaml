# The cloud terminal — the configuration surface, once.
#
# ⚠ EVERY NON-`@internal` BLOCK BELOW IS GENERATED from CloudConsoles.Schema2026 by
# `./build.sh Charts`, and so is values.schema.json. ADR-010 § Which end authors the schema: "The C#
# ResourceSchema is authored. The chart's @param annotations are generated from it and diffed."
# Editing a generated row here is undone on the next run and fails the build in between; add the
# field in C# instead.
#
# ⚠ THE ABSENCES ARE THE INTERESTING PART. There is no `image.repository` or `image.digest` — a tenant
# choosing what runs in a pod holding their own identity is the whole attack, so the image is
# `@internal`; there is no `network.allowedCidrs`, because the policy this row renders is not
# expressible as a list a tenant supplies and a half-expressible one would read as a guarantee; and
# there is no value of `session.idleTimeoutMinutes` meaning "never", which is why that row has a
# maximum as well as a minimum. All three are argued at CloudConsoles.Schema2026.

## @param identity {object} Who the shell runs as.
identity:
  ## @param principalId {string} The managed identity every command in this shell acts as. It may not be changed: a console whose identity moved would have an audit trail describing a shell that no longer exists.
  ## @required
  ## @immutable
  ## @format uuid
  principalId: ""

## @param image {object} Which shell image to run.
image:
  ## @param variant {string} default carries every tool in docs/plan/19's table and takes about 40 seconds to pull cold; minimal carries shells, editors, cyc and kubectl and starts in about 8. The repository and the digest are the platform's.
  ## @enum default | minimal
  variant: default

## @param sizing {object} CPU and memory for the shell.
sizing:
  ## @param preset {string} How much a shell gets. The ladder stops at 2 vCPU and 4 GiB, which is docs/plan/19's ceiling for this row — a workload that needs more needs a cluster and a job rather than a terminal.
  ## @enum c1.large | c1.medium | c1.small
  ## @widget cozy-preset
  preset: c1.small

## @param home {object} The persistent home directory. The only part of a console that survives an idle reclaim.
home:
  ## @param size {string} The size of $HOME. It grows and never shrinks: a PersistentVolumeClaim refuses a decrease at the API.
  ## @required
  ## @pattern \d+(\.\d+)?(m|k|M|G|T|P|E|Ki|Mi|Gi|Ti|Pi|Ei)?
  ## @example "5Gi"
  size: "5Gi"
  ## @param retentionDays {integer} How long $HOME is kept after the console was last attached to. ⚠ Nothing sweeps on it yet — it is carried so that a console created today is swept correctly by whatever does.
  ## @range 1..365
  retentionDays: 90

## @param session {object} When a shell stops. Both numbers are ceilings a tenant may lower and neither may be turned off.
session:
  ## @param idleTimeoutMinutes {integer} How long a shell may sit with nobody typing into it before it is reclaimed. The home volume survives; the pod does not. ⚠ There is no value meaning never — an idle terminal is a tenant paying for something they closed.
  ## @range 5..120
  idleTimeoutMinutes: 20
  ## @param maxDurationHours {integer} The longest a single shell may run, busy or not. Enforced by the kubelet through the pod's own deadline, so it holds even when nothing of this platform is running.
  ## @range 1..24
  maxDurationHours: 8

## @param network {object} What the shell may reach. Nothing may ever reach the shell.
network:
  ## @param egress {string} Internet lets the shell reach public addresses as well as this subscription's own workloads and DNS — a shell that cannot git clone is not a shell. TenantOnly removes the public half and leaves the rest.
  ## @enum Internet | TenantOnly
  egress: Internet

## @param audit {object} docs/plan/19 § Auditing. Who, when, from where, which subscription and for how long is always recorded and is not a setting.
audit:
  ## @param sessionRecording {boolean} Whether everything typed into and printed by this shell is recorded. ⚠ Off by default and immutable afterwards: a shell contains secrets, a keystroke log is a liability, and a recording that could be switched off mid-life would be worth nothing to the compliance requirement it exists for.
  ## @immutable
  sessionRecording: false

## @param platform {object} Resource identity injected by the reconciler. Not a tenant-facing setting.
## @internal Written by the reconciler from the resource's own identity. A tenant cannot set it, so it is not part of the resource body.
platform:
  ## @param tenantId {string} Tenant GUID, rendered into the cybercloud.io/tenant-id label AND into the network policy's tenant-wide egress selector. ⚠ It is the only value in this file that is both an identity label and a security control.
  tenantId: ""
  ## @param subscriptionId {string} Subscription GUID, rendered into the cybercloud.io/subscription-id label.
  subscriptionId: ""
  ## @param resourceGroup {string} Resource group name, rendered into the cybercloud.io/resource-group label.
  resourceGroup: ""
  ## @param resourceId {string} Resource GUID, rendered into the cybercloud.io/resource-id label.
  resourceId: ""
  ## @param resourceType {string} Fully qualified resource type, rendered into the cybercloud.io/resource-type label and into the network policy's own podSelector.
  resourceType: CyberCloud.Terminal/consoles
  ## @param apiVersion {string} The api-version the resource was last written at, rendered into the cybercloud.io/api-version label.
  apiVersion: "2026-08-01"
  ## @param managedBy {string} Value of the cybercloud.io/managed-by label. Constant, and the selector every informer filters on.
  managedBy: cybercloud
  ## @param namespace {string} The resource's own namespace, which the network policy allows the shell to reach.
  namespace: ""

## @param imageRepository {string} Where the shell image is published.
## @internal A tenant choosing what runs in a pod that holds their own managed identity is the whole attack, so the image is the platform's and not a setting. ⚠ NOTHING IN THIS REPOSITORY BUILDS IT — build/Build.Images.cs publishes .NET hosts through the SDK's container tooling and its header forbids a Dockerfile, and a 2.5 GB shell image is neither. conformance.yaml § owed, `no-image-pipeline`.
imageRepository: cybercloud/cloud-shell

## @param ephemeralStorageLimit {string} How much a shell may write outside its home volume.
## @internal Not a tenant choice, because the failure it prevents is the NODE'S rather than the tenant's: an unbounded emptyDir fills the kubelet's disk and evicts every pod on the machine, including other tenants'.
ephemeralStorageLimit: 2Gi

## @param nameOverride {string} Replace the generated object-name stem. Empty means derive it from the release name.
## @internal Helm plumbing. Nothing about it belongs in a resource body.
nameOverride: ""
