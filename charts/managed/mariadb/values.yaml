# Charts` rewrites it from `MariaDbServers.Schema2026` and fails on drift — ADR-010 § Which end
# authors the schema, DECIDED 2026-08-11: the C# ResourceSchema is authored and the chart's
# annotations are generated from it. Edit the schema; this file follows.
#
# ⚠ values.schema.json next to this file is generated from THIS file by the same target, and is
# diffed in CI. Edit neither.
