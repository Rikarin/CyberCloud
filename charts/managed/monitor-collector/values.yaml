# A managed OpenTelemetry collector under a monitor workspace — the configuration surface, once.
#
# ⚠ EVERY NON-`@internal` BLOCK BELOW IS GENERATED from MonitorCollectors.Schema2026 by
# `./build.sh Charts`, and so is values.schema.json. ADR-010 § Which end authors the schema: "The C#
# ResourceSchema is authored. The chart's @param annotations are generated from it and diffed."
# Editing a generated row here is undone on the next run and fails the build in between; add the
# field in C# instead.
#
# ⚠ THE WORKSPACE IS NOT A VALUE. A collector is a child of its workspace — the address carries the
# workspace's name — and the reconciler writes it into `platform.workspace` below, which is how the
# rendered Deployment names the workspace's row and ingest key. A tenant-settable workspace would be a
# collector pointed at somebody else's tenancy.
#
# ⚠ NO `config`. Upstream's own chart takes a whole collector configuration as a value; docs/plan/16
# says why this one does not — "an arbitrary collector config is a data-exfiltration primitive and a
# code-execution surface" — and offers the two OTLP protocols as switches instead. The declarative
# receiver list and tenant-owned exporters are conformance.yaml § owed,
# `tenant-authored-config-is-not-accepted`.

## @param receivers {object} Which OTLP protocols the collector listens on. At least one; both is the default.
receivers:
  ## @param otlpGrpc {boolean} Accept OTLP over gRPC on port 4317 — what most SDKs send by default.
  otlpGrpc: true
  ## @param otlpHttp {boolean} Accept OTLP over HTTP on port 4318 — protobuf or JSON, for browsers and anything that cannot speak gRPC.
  otlpHttp: true

## @param replicas {integer} How many collector pods share the endpoint. The collector is stateless, so more replicas is more fan-in and nothing else.
## @range 1..3
replicas: 1

## @param sizing {object} CPU and memory for each collector pod.
sizing:
  ## @param preset {string} How much each pod gets. The small row carries a few thousand spans a second; the larger rows are for a whole cluster's telemetry through one gateway. The memory limiter is set from the preset, so an oversized burst is refused rather than killed.
  ## @enum c1.large | c1.medium | c1.small
  ## @widget cozy-preset
  preset: c1.small

## @param platform {object} Resource identity injected by the reconciler. Not a tenant-facing setting.
## @internal Written by the reconciler from the resource's own identity. A tenant cannot set it, so it is not part of the resource body.
platform:
  ## @param tenantId {string} Tenant GUID, rendered into the cybercloud.io/tenant-id label.
  tenantId: ""
  ## @param subscriptionId {string} Subscription GUID, rendered into the cybercloud.io/subscription-id label.
  subscriptionId: ""
  ## @param resourceGroup {string} Resource group name, rendered into the cybercloud.io/resource-group label.
  resourceGroup: ""
  ## @param resourceId {string} Resource GUID, rendered into the cybercloud.io/resource-id label.
  resourceId: ""
  ## @param resourceType {string} Fully qualified resource type, rendered into the cybercloud.io/resource-type label.
  resourceType: CyberCloud.Monitor/workspaces/collectors
  ## @param apiVersion {string} The api-version the resource was last written at, rendered into the cybercloud.io/api-version label.
  apiVersion: "2026-08-01"
  ## @param managedBy {string} Value of the cybercloud.io/managed-by label. Constant, and the selector every informer filters on.
  managedBy: cybercloud
  ## @param workspace {string} The parent workspace's name — a component of every object name, and the stem of the workspace's own row and ingest-key Secret the pod reads its coordinates from.
  workspace: prod

## @param image {string} The collector image, pinned by digest in the bundle's shape.
## @internal Upstream's contrib distribution, unmodified. ⚠ `repository:tag@sha256:…` — the shape every charts/bundle component records its images in — and the same string as MonitorCollectors.Image; CollectorDeclarationTests fails when the two drift. Resolved 2026-09-17; SOURCE has the command and the output. A tenant choosing what runs in a pod that holds their workspace's ingest key is not a configuration surface.
image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1

## @param nameOverride {string} Replace the generated object-name stem. Empty means derive it from the release name.
## @internal Helm plumbing. Nothing about it belongs in a resource body.
nameOverride: ""
