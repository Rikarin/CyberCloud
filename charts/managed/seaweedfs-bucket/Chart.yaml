# A bucket inside a managed object-storage account — docs/plan/15 § The three kinds, "Object ·
# CyberCloud.Storage/accounts + /buckets · SeaweedFS + S3 gateway", and § The resource model,
# "buckets/{name} ← globally-unique-per-account name, quota, versioning, lifecycle".
#
# ⚠ THIS IS THE FIRST CHART IN THE TREE WHOSE RESOURCE TYPE IS A CHILD, and it is a directory of its
# own rather than a second block in charts/managed/seaweedfs. `Build.Charts` pairs a chart with a
# resource type through ONE `cybercloud.io/resource-type` annotation per Chart.yaml, so one directory
# cannot be the configuration surface of two types — and it should not be: a Bucket is a different
# object with a different lifetime from the Seaweed it lives in.
#
# ⚠ AND IT IS THE FIRST CHART THAT NEEDS A FACT FROM THE RESOURCE'S ADDRESS RATHER THAN FROM ITS
# BODY. See values.yaml's `platform.parentName`.
apiVersion: v2
name: seaweedfs-bucket
description: An S3 bucket inside a managed object-storage account — an optional size limit and optional object versioning.
type: application

# The chart's own version. Bumped on every change to this directory.
version: 0.1.0

# ⚠ The SeaweedFS version this chart's object shape was reviewed against — the same release
# charts/managed/seaweedfs pins, because a Bucket is reconciled by the same operator.
appVersion: "4.41"

kubeVersion: ">=1.31.0-0"

keywords:
  - seaweedfs
  - s3
  - object-storage
  - bucket

home: https://seaweedfs.com
sources:
  - https://github.com/seaweedfs/seaweedfs
  - https://github.com/seaweedfs/seaweedfs-operator

maintainers:
  - name: Cyber Cloud Platform

# ⚠ These three are read by `Build.Charts` and written into `values.schema.json` as
# `x-cybercloud-*`. The resource type carries BOTH segments — a child's type path is
# `accounts/buckets`, interleaved, and a chart annotated with the flattened `buckets` would pair
# with a type no provider declares.
#
# ⚠ The api-version is the ACCOUNT'S, deliberately. A parent and a child served at different dates
# would make `…/accounts/{a}/buckets/{b}?api-version=…` a request whose single version parameter has
# to mean two things.
annotations:
  cybercloud.io/resource-type: CyberCloud.Storage/accounts/buckets
  cybercloud.io/api-version: "2026-08-01"
  cybercloud.io/operator: seaweedfs-operator
