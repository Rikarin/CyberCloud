# Conformance manifest — docs/plan/12 § The pattern, once, piece 8.
#
# What the conformance suite asserts about CyberCloud.Messaging/kafkaClusters. This file is data:
# `Build.Charts` checks that it is present, non-empty, and names the same resource type as
# Chart.yaml. The suite that reads the rest of it lives in test/ and does not exist yet, and the
# target says so in its own log rather than implying otherwise.

resourceType: CyberCloud.Messaging/kafkaClusters
apiVersion: "2026-08-01"
chart: kafka

# Objects the reconciler must have applied once the resource reports Succeeded.
#
# ⚠ BOTH, UNCONDITIONALLY — there is no `when:` here and the PostgreSQL manifest has one. With
# strimzi.io/node-pools enabled the Kafka carries no replica count and no storage of its own, so a
# cluster without its pool is not a smaller cluster, it is one with nowhere to run.
renders:
  - group: kafka.strimzi.io
    version: v1beta2
    kind: Kafka
    count: 1
  - group: kafka.strimzi.io
    version: v1beta2
    kind: KafkaNodePool
    count: 1

# ⚠ THE `requiredCrds:` BLOCK THAT USED TO BE HERE HAS BEEN REMOVED, AND ITS REMOVAL IS THE FIX
# RATHER THAN A LOSS. It carried the sentence "Read by ProviderConformanceCase.RequiredCrds", and
# that member has never existed on master: it is the design ProviderConformanceCase.cs's long
# comment records losing, because a declared list can be under-declared and the failure when it is
# names nothing. The harness DERIVES the definitions from the case's own `Objects`, which already
# carries group, version, kind and plural — and `renders:` above is the same two kinds, so nothing
# was said here that the derivation does not already know.
#
# The claim the block was making is still true and is still worth stating: a bare k3s serves no REST
# path for a custom resource, so every cluster-backed assertion about a Strimzi object fails without
# one, as an HttpOperationException with no status code. It is the harness that now guarantees it.

# ADR-013 — every rendered object carries all seven labels. Asserted against real rendered output,
# which is what the Labels architecture gate in docs/plan/23 § The architecture gates requires.
labels:
  required:
    - cybercloud.io/tenant-id
    - cybercloud.io/subscription-id
    - cybercloud.io/resource-group
    - cybercloud.io/resource-id
    - cybercloud.io/resource-type
    - cybercloud.io/api-version
    - cybercloud.io/managed-by
  # ⚠ Not the resource type verbatim. A `/` is not a legal label value character, so the value is
  # lower-cased with `/` replaced by `_` — KubeLabels.ResourceTypeValue.
  values:
    cybercloud.io/resource-type: cybercloud.messaging_kafkaclusters
    cybercloud.io/managed-by: cybercloud
  # ⚠ NOT one of the seven, and not optional either. A KafkaNodePool whose strimzi.io/cluster does
  # not name an existing Kafka is silently ignored by the operator.
  additional:
    KafkaNodePool:
      strimzi.io/cluster: "{resourceName}"

# Behaviour a tenant is entitled to. Each is a statement the suite can fail on, not a feature list.
assertions:
  - id: produce-and-consume
    says: A client resolves the bootstrap address from listKeys, produces to a topic and consumes what it produced.
  - id: quorum-survives-one-node
    says: Deleting one broker pod of a three-node cluster leaves the cluster writable throughout, and every acknowledged record is still readable afterwards.
  - id: external-is-off-unless-asked
    says: With external.enabled false no LoadBalancer Service exists for this cluster. Turning it on with an empty allowedCidrs list creates one that accepts no source range, never one that accepts every source range.
  - id: retention-is-the-declared-window
    says: A record older than retention.hours is not readable; one inside the window is. Changing retention.hours changes the boundary rather than requiring a new cluster.
  - id: replication-factor-fits-the-cluster
    says: A topics.replicationFactor above the node count is refused by the API before it reaches a cluster, rather than producing a cluster where every produce to a new topic fails.
  - id: storage-grows-never-shrinks
    says: Increasing storage.size resizes online; decreasing it is refused at the API.
  - id: secrets-never-round-trip
    says: A GET of the resource never returns broker credentials in any form. The only path out is the listKeys action.

# Meters the type must emit — docs/plan/12 § The pattern, once, piece 3.
meters:
  - kafka.node.hours
  - kafka.storage.gib.hours
  - kafka.egress.gib

# ── owed ──────────────────────────────────────────────────────────────────────────────────────
#
# Named here rather than left to be discovered, because an absent capability that nobody wrote down
# is indistinguishable from one nobody thought of.
owed:
  - id: scrape-object
    says: >
      docs/plan/12 § The pattern, once, piece 6's SECOND branch — "hand-write one into the chart only
      when there is no operator to ask" — and this is the first service it is true of. Strimzi emits
      no PodMonitor or ServiceMonitor and has no switch on the Kafka CR that asks it to;
      spec.kafkaExporter makes the metrics exist and nothing scrapes them. The chart owes a
      PodMonitor selecting this cluster's pods, and the Grafana dashboard that reads it.
  - id: dedicated-controller-pool
    says: >
      One KafkaNodePool carries both the controller and the broker role. Strimzi's production shape
      is two pools, so that controllers can be sized and scaled independently of brokers and a broker
      restart cannot cost quorum. Splitting them changes the rendered object set from two to three
      and is a change to KafkaClusters.NodePoolJson, the reconciler's Targets, and this file's
      renders block.
  - id: listkeys-has-no-handler
    says: >
      listKeys has a declared response shape and nothing that serves it — CyberCloud.Messaging/
      kafkaClusters is on actions-without-handlers.txt with the reason.
      ⚠ THAT REASON IS NOT PIECE 5, THOUGH THIS ROW USED TO SAY SO. Piece 5 is ISecretWriter and
      CyberCloud.Vault ships OpenBaoSecretWriter behind it; four reconcilers mint through it. What is
      missing here is the credential itself: no KafkaUser is rendered and the listeners declare no
      SASL mechanism, so no SCRAM user exists and Strimzi generates no Secret for a handler to read.
      Closing it is a listener change first, which every client already connected to an existing
      cluster can see, and only then a user and a handler.
  - id: odd-node-count-is-unenforced
    says: >
      A KRaft quorum of two controllers tolerates no failures, so /properties/nodes wants an odd
      value. SchemaProperty.AllowedValues is Text-only by construction and Minimum/Maximum cannot say
      "odd", so the constraint is in the property's description and in nothing that enforces it. A
      body asking for four nodes is accepted and produces a cluster that looks highly available and
      is not.
  - id: cidr-shape-is-unenforced
    says: >
      /properties/external/allowedCidrs declares no Pattern, so "999.0.0.1/99" is accepted by the
      API, reaches loadBalancerSourceRanges, and fails at the API server AFTER the caller was told
      202. The registry would carry the constraint — SchemaProperty applies a Pattern per element on
      an array — and ADR-012's fifth surface refuses `@pattern` on a `{array}` while emitting
      `@enum` there as `items.enum`, which is the same per-element shape. Closing it is one case in
      ChartAnnotationEmitter and one in Build.Charts' Validate. KafkaClusters.CidrPattern is the
      string, written down and tested, waiting for a surface that will carry it.
      ⚠ UPDATED 2026-09-06 (#84), AND THE UPDATE IS NOT A FIX. ChartAnnotationEmitter now has a case
      for `@pattern`, `@length` and `@format` on a non-`{string}` @param — a REFUSAL, not the
      emission this item is waiting for. Until #84 the emitter wrote the directive and ./build.sh
      Charts failed on the file it had just written, so declaring Pattern here would have been red
      with the complaint pointing at a generated values.yaml; it is now red with the complaint
      pointing at this registration and naming the property. What it costs is unchanged, and so is
      what would close it — but NOT the two-site figure this entry carried, which the #84 review
      found disagreeing with two other counts committed the same day: FIVE in ChartAnnotationEmitter
      and NINE in charts/README.md. The sentence above, "Closing it is one case in
      ChartAnnotationEmitter and one in Build.Charts' Validate", UNDERCOUNTS and predates #84.
      Build.Charts' PropertyNode writes `pattern`, `minLength`, `maxLength` and `format` onto the
      node itself for EVERY type and would have to move all four into `items` on an array, or JSON
      Schema ignores them — which is the failure this whole item is about; and its CheckPattern and
      CheckLength each return unless the default is a JSON string, so an array default would be
      checked against nothing and `helm lint --strict` would reject the chart's own values two steps
      later. The sites are enumerated BY NAME, once, in charts/README.md § What a chart cannot say.
      This entry deliberately carries no figure of its own so that the two cannot drift apart again.
  - id: replication-factor-versus-node-count
    says: >
      The `replication-factor-fits-the-cluster` assertion above is not enforceable by the registry
      either — it is a relation between two properties, and ResourceSchema validates each property
      against constants. A cross-property validation seam would close this one and the odd-node one
      is a different shape again.
  - id: sub-resources
    says: >
      docs/plan/12 names topics and users as sub-resources. They are not declared, and the reason is
      the resource-id grammar rather than effort — see the remarks on KafkaClusters and
      src/Providers/README.md § What the third provider measured.
