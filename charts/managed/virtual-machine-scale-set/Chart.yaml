# A virtual machine scale set — docs/plan/13 § Scale sets: "A replica count over one template.
# Deliberately *not* an autoscaler in M2."
#
# ⚠ ONE OBJECT, AND IT IS KUBEVIRT'S OWN POOL. `VirtualMachinePool` (pool.kubevirt.io/v1beta1 at the
# pinned v1.9.0) creates `spec.replicas` machines named `{pool}-{index}` from `virtualMachineTemplate`,
# gives each a clone of its own root disk by indexing the template's DataVolume, and restarts them onto
# a changed template as `updateStrategy` says. The machine template is charts/managed/virtual-machine's
# machine, and its helpers are spelled here a second time — ComputeChartDriftTests compares the size
# table in both against VirtualMachines.Sizes.
#
# ⚠ THE REPLICA COUNT IS NOT A TENANT VALUE. `replicas` below is @internal: the platform renders what the
# pool already says, and a tenant moves it through the `scale` action within `capacity`, never through
# this file — the scale set's version of the machine's power state.
apiVersion: v2
name: virtual-machine-scale-set
description: A scale set on KubeVirt — a replica count over one machine template, each machine a clone of one image, restarted onto a changed template as its upgrade policy says.
type: application

# The chart's own version. Bumped on every change to this directory.
version: 0.1.0

# ⚠ The KubeVirt release this chart's object was reviewed against — charts/bundle/kubevirt's pin.
appVersion: "1.9.0"

kubeVersion: ">=1.31.0-0"

keywords:
  - kubevirt
  - virtual-machine-pool
  - scale-set
  - compute

home: https://kubevirt.io
sources:
  - https://github.com/kubevirt/kubevirt

maintainers:
  - name: Cyber Cloud Platform

annotations:
  cybercloud.io/resource-type: CyberCloud.Compute/virtualMachineScaleSets
  cybercloud.io/api-version: "2026-08-01"
  cybercloud.io/operator: kubevirt
