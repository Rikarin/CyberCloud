# A security group inside a tenant's virtual network — the configuration surface, once.
#
# ⚠ EVERY NON-`@internal` BLOCK BELOW IS GENERATED from NetworkSecurityGroups.Schema2026 by
# `./build.sh Charts`, and so is values.schema.json. ADR-010 § Which end authors the schema: "The C#
# ResourceSchema is authored. The chart's @param annotations are generated from it and diffed."
# Editing a generated row here is undone on the next run and fails the build in between; add the
# field in C# instead.
#
# ⚠ SIX SCALARS PER DIRECTION RATHER THAN A LIST OF RULE OBJECTS, AND THAT IS THE WHOLE ARGUMENT OF
# THIS CHART. Kube-OVN's SecurityGroupSpec is `ingressRules`/`egressRules` of SecurityGroupRule —
# an ARRAY OF OBJECTS, which `SchemaProperty.ElementKind` refuses outright: "an array element is a
# scalar". docs/plan/14 asks for a security group, not for a JSON transcription of that struct, and a
# security group is expressible in scalars: a group is ONE coherent allow-set and a port carries
# SEVERAL, which is Kube-OVN's own composition model — a port's `…kubernetes.io/security_groups`
# annotation is a comma-separated list of group names.
#
# ⚠ AND THE RESHAPE VALIDATES MORE, NOT LESS. A patterned string enforces 1–65535 per port at the
# API, with a JSON Pointer, before the write path answers 202. An `array` of `WholeNumber` could not:
# Minimum/Maximum are PROPERTY constraints on SchemaProperty and there is no per-element bounds
# member, and ADR-012's fifth surface refuses `@pattern` on an array outright.
#
# ⚠ AN EMPTY SECTION PERMITS NOTHING. Kube-OVN's CreateSgDenyAllACL installs a drop for every port in
# a security group's port group, beneath every rule this chart writes, and the controller has no
# special case for an empty rule list. So the empty body is the SAFE body — see SOURCE.

## @param allowSameGroupTraffic {boolean} Whether workloads that carry this same security group may reach each other without a rule. Off by default: it is the one setting here that permits traffic nobody wrote a rule for.
allowSameGroupTraffic: false

## @param ingress {object} What may reach workloads carrying this group. ⚠ Anything not allowed here is dropped — the fabric installs a default-deny for every port in a security group, so an empty section permits nothing.
ingress:
  ## @param remoteV4 {string} The IPv4 range inbound traffic may come from, in CIDR form, or empty for no IPv4 rules at all. Use 0.0.0.0/0 for the whole internet.
  ## @pattern ((\d{1,3}\.){3}\d{1,3}/\d{1,2})?
  ## @example "10.20.0.0/16"
  ## @widget cidr
  remoteV4: ""
  ## @param remoteV6 {string} The IPv6 range inbound traffic may come from, or empty for no IPv6 rules at all. ⚠ A group with only an IPv4 remote silently permits nothing over IPv6, which on a dual-stack subnet is not the same as permitting nothing.
  ## @pattern ([0-9A-Fa-f:.]+/[0-9]{1,3})?
  ## @example "fd00:20::/48"
  ## @widget cidr
  remoteV6: ""
  ## @param tcpPorts {string} TCP ports inbound traffic may reach, as a comma-separated list of ports and ranges — for example 80,443,8000-8100. Empty means no TCP is allowed inbound. ⚠ There is no way to say 'every protocol'; 1-65535 says 'every TCP port'.
  ## @pattern ((6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(-(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?(,(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(-(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?)*)?
  ## @example "80,443"
  tcpPorts: ""
  ## @param udpPorts {string} UDP ports inbound traffic may reach, in the same form as tcpPorts. Empty means no UDP is allowed inbound.
  ## @pattern ((6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(-(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?(,(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(-(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?)*)?
  ## @example "53"
  udpPorts: ""
  ## @param allowIcmp {boolean} Whether inbound ICMP is allowed from the remotes above. Off by default. ⚠ With this off, a workload in this group does not answer ping and does not receive path-MTU messages.
  allowIcmp: false

## @param egress {object} What workloads carrying this group may reach. ⚠ Same default-deny: an empty section permits no outbound traffic at all, which for most workloads means no DNS and no package downloads.
egress:
  ## @param remoteV4 {string} The IPv4 range outbound traffic may reach, or empty for no IPv4 rules at all.
  ## @pattern ((\d{1,3}\.){3}\d{1,3}/\d{1,2})?
  ## @example "0.0.0.0/0"
  ## @widget cidr
  remoteV4: ""
  ## @param remoteV6 {string} The IPv6 range outbound traffic may reach, or empty for no IPv6 rules at all.
  ## @pattern ([0-9A-Fa-f:.]+/[0-9]{1,3})?
  ## @example "::/0"
  ## @widget cidr
  remoteV6: ""
  ## @param tcpPorts {string} TCP ports outbound traffic may reach, in the same form as the inbound list. Empty means no outbound TCP.
  ## @pattern ((6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(-(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?(,(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(-(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?)*)?
  ## @example "443"
  tcpPorts: ""
  ## @param udpPorts {string} UDP ports outbound traffic may reach. Empty means no outbound UDP — which includes DNS on port 53.
  ## @pattern ((6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(-(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?(,(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(-(6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?)*)?
  ## @example "53"
  udpPorts: ""
  ## @param allowIcmp {boolean} Whether outbound ICMP is allowed to the remotes above. Off by default.
  allowIcmp: false

