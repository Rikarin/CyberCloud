packages:
  - 'apps/*'
  - 'libs/*'

# Build scripts are opt-in under pnpm 10+. These are the ones the Angular + Tailwind toolchain
# genuinely needs — esbuild and @tailwindcss/oxide ship prebuilt native binaries that their install
# script selects, and @parcel/watcher backs the dev server's file watching. Everything else stays
# denied: an install script is arbitrary code execution at `pnpm install` time, and the default of
# "no" is the right one for a dependency tree this size.
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  # Pulled in transitively by the Angular CLI's caching layer, not by anything the portal calls.
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@xui/breadcrumb@2.2.1 || 2.2.2'
  - '@xui/button@2.2.1 || 2.2.2'
  - '@xui/core@2.2.1 || 2.2.2'
  - '@xui/dialog@2.2.1 || 2.2.2'
  - '@xui/divider@2.2.1 || 2.2.2'
  - '@xui/dock-manager@2.2.1 || 2.2.2'
  - '@xui/icon@2.2.1 || 2.2.2'
  - '@xui/input@2.2.1 || 2.2.2'
  - '@xui/kbd@2.2.1 || 2.2.2'
  - '@xui/menu@2.2.1 || 2.2.2'
  - '@xui/non-ideal-state@2.2.1 || 2.2.2'
  - '@xui/omnibar@2.2.1 || 2.2.2'
  - '@xui/overflow-list@2.2.1 || 2.2.2'
  - '@xui/panel-stack@2.2.1 || 2.2.2'
  - '@xui/popover@2.2.1 || 2.2.2'
  - '@xui/progress-bar@2.2.1 || 2.2.2'
  - '@xui/scroll-area@2.2.1 || 2.2.2'
  - '@xui/select@2.2.1 || 2.2.2'
  - '@xui/spinner@2.2.1 || 2.2.2'
  - '@xui/tag@2.2.1 || 2.2.2'
  - '@xui/toast@2.2.1 || 2.2.2'
  - '@xui/tooltip@2.2.1 || 2.2.2'

# ⚠ Single-version policy. Every @angular/*, @xui/* and peer package is declared once in the root
# package.json and pinned exactly; workspace packages carry no runtime dependency ranges of their
# own. Two copies of @angular/core in one tree is a broken app, and @xui/* peers on exact
# @angular/* versions (docs/plan/02 § ADR-017) leave no room for a second resolution.
#
# @angular/common is pinned to 22.0.8 rather than the 22.x head because @xui/panel-stack,
# @xui/popover, @xui/tooltip and @xui/breadcrumb at 2.2.0 peer on `"@angular/common": "22.0.8"` —
# an EXACT version, not the major range ADR-017 records. @angular/cdk is pinned to 22.0.6 for the
# same reason (@xui/echarts). See portal/README.md § The Angular pin.
