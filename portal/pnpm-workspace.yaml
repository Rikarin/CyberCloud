packages:
  - 'apps/*'
  - 'libs/*'

# Build scripts are opt-in under pnpm 10+. These are the ones the Angular + Tailwind toolchain
# genuinely needs — esbuild and @tailwindcss/oxide ship prebuilt native binaries that their install
# script selects, and @parcel/watcher backs the dev server's file watching. Everything else stays
# denied: an install script is arbitrary code execution at `pnpm install` time, and the default of
# "no" is the right one for a dependency tree this size.
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  # Pulled in transitively by the Angular CLI's caching layer, not by anything the portal calls.
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false

# ⚠ minimumReleaseAge is NOT set here, and that is a decision with a number behind it. pnpm 11
# defaults `minimum-release-age` to 1440 minutes (one day; the default table in pnpm's own bundle,
# `"minimum-release-age": 24 * 60`), so a version younger than a day is refused at resolution time
# unless it is listed under `minimumReleaseAgeExclude`. Because the key is not set explicitly,
# pnpm is in its non-strict mode: it does not prompt or fail, it APPENDS the immature pick to that
# list itself and reports "Added N entries to minimumReleaseAgeExclude". The
# `@xui/*@2.2.1 || 2.2.2 || 2.2.3 || 2.2.4` list that used to live here has exactly the `||`-merged
# shape pnpm writes, and all four were taken on 2026-08-12, the day they were published. So the
# list is pnpm's record of same-day picks, not a policy to curate by hand, and it is dead weight
# once the pin has moved on.
#
# @xui/*@3.0.0 (published 2026-09-10) and @ng-icons/*@35.1.0 (2026-08-27) were both older than a
# day when they were taken on 2026-09-15, so `pnpm install` resolved them without adding anything
# and the list is gone. The next same-day @xui bump will grow one again; commit what pnpm writes.

# ⚠ Single-version policy. Every @angular/*, @xui/* and peer package is declared once in the root
# package.json and pinned exactly; workspace packages carry no runtime dependency ranges of their
# own. Two copies of @angular/core in one tree is a broken app, and @xui/* peers on @angular/*
# (docs/plan/02 § ADR-017) leave no room for a second resolution.
#
# @angular/* is pinned to 22.0.8 and @angular/cdk to 22.0.6. Those numbers were FORCED at @xui 2.2.x,
# when @xui/panel-stack, popover, tooltip, breadcrumb and overflow-list peered
# `"@angular/common": "22.0.8"` and @xui/echarts peered `"@angular/cdk": "22.0.6"` — exact
# versions. At @xui 3.0.0 every one of those
# packages peers the `22` major range, so the pins are no longer forced by a peer; they are kept
# because the gate is green on them and moving Angular is a separate change from moving xUI.
# See portal/README.md § The Angular pin for the measured table and what unpins them.
