packages:
  - 'apps/*'
  - 'libs/*'

# Build scripts are opt-in under pnpm 10+. These are the ones the Angular + Tailwind toolchain
# genuinely needs — esbuild and @tailwindcss/oxide ship prebuilt native binaries that their install
# script selects, and @parcel/watcher backs the dev server's file watching. Everything else stays
# denied: an install script is arbitrary code execution at `pnpm install` time, and the default of
# "no" is the right one for a dependency tree this size.
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  # Pulled in transitively by the Angular CLI's caching layer, not by anything the portal calls.
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false

# ⚠ minimumReleaseAge is NOT set here, and that is a decision with a number behind it. pnpm 11
# defaults `minimum-release-age` to 1440 minutes (one day; the default table in pnpm's own bundle,
# `"minimum-release-age": 24 * 60`), so a version younger than a day is refused at resolution time
# unless it is listed under `minimumReleaseAgeExclude`. Because the key is not set explicitly,
# pnpm is in its non-strict mode: it does not prompt or fail, it APPENDS the immature pick to that
# list itself and reports "Added N entries to minimumReleaseAgeExclude". The
# `@xui/*@2.2.1 || 2.2.2 || 2.2.3 || 2.2.4` list that used to live here has exactly the `||`-merged
# shape pnpm writes, and all four were taken on 2026-08-12, the day they were published. So the
# list is pnpm's record of same-day picks, not a policy to curate by hand, and it is dead weight
# once the pin has moved on.
#
# @xui/*@3.0.0 (published 2026-09-10) and @ng-icons/*@35.1.0 (2026-08-27) were both older than a
# day when they were taken on 2026-09-15, so `pnpm install` resolved them without adding anything
# and the list is gone. The next same-day @xui bump will grow one again; commit what pnpm writes.

# ⚠ Single-version policy. Every @angular/*, @xui/* and peer package is declared once in the root
# package.json and pinned exactly; workspace packages carry no runtime dependency ranges of their
# own. Two copies of @angular/core in one tree is a broken app, and @xui/* peers on @angular/*
# (docs/plan/02 § ADR-017) leave no room for a second resolution.
#
# The framework (@angular/core and its siblings, @angular/compiler-cli, @angular/cdk) is pinned to
# 22.1.4 — the version xUI compiled @xui/*@3.0.0 with, which every installed @xui bundle stamps and
# apps/portal/src/app/angular-pin.spec.ts checks. The tooling (@angular/cli, @angular/build,
# @angular/ssr) is pinned to 22.0.8, separately: it versions on its own cadence, and 22.1.0 through
# 22.1.4 of the CLI fail strictPeerDependencies on the CLI's own tree. portal/README.md § The
# Angular pin has the measurements and names the next move.

# ⚠ These four settings lived in .npmrc until 2026-09-15, and pnpm 11 never read them there. pnpm
# 11.0's release notes: "pnpm no longer reads non-auth settings from `.npmrc`" — registry and auth
# stay in INI files, everything pnpm-specific moves to this file. The portal has pinned pnpm 11
# since its first commit, so `strict-peer-dependencies=true` was in force for exactly zero
# installs: `pnpm config get strict-peer-dependencies` answered `undefined`, and a resolution with
# an unmet exact peer printed "[WARN] Issues with peer dependencies found" and exited 0. With the
# key here, the same resolution is ERR_PNPM_PEER_DEP_ISSUES and exit 1, which is what every "under
# strict peers" claim in the docs had been assuming.
#
# strictPeerDependencies: Angular's compiler resolves @angular/* deeply and @xui/* peers on
# @angular/*; failing the install on an unmet peer surfaces a conflict at `pnpm install` instead of
# as a runtime "two copies of Angular" failure. autoInstallPeers is off for the same reason — a
# peer pnpm adds on its own is a version nobody pinned. resolutionMode is pnpm's default, stated so
# that a change of default cannot move the tree silently.
strictPeerDependencies: true
autoInstallPeers: false
resolutionMode: highest

# engineStrict is deliberately off. The Node major is pinned by .nvmrc / .node-version and
# enforced as a hard gate by `pnpm node:gate` (scripts/check-node.mjs --strict), which CI runs
# first; the dev host has only Node 26 installed, so a wall here would mean the portal cannot be
# installed there at all. The warning half of that arrangement was measured and lost, and
# `pnpm node:recap` is the answer — see scripts/check-node.mjs's header and README § Node.
engineStrict: false
