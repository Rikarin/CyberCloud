# docs/plan/23 § CI shape, row `release.yml`: "Tag | Full gate, publish everything, staged rollout".
#
# ── ⚠ WHY THERE IS NO `uses: ./.github/workflows/gate.yml` HERE ──────────────────────────────────
#
# pr.yml and main.yml both call the reusable gate. This one does not, and the reason is a decision
# the build already made. Build.Publish.cs:
#
#   "docs/plan/23 § CI shape gives release.yml exactly one job — 'full gate, publish everything' —
#    so `./build.sh Publish` has to BE that gate rather than trust a workflow file to have run the
#    gate first."
#
# `Publish` depends on Test, Generate, Architecture, Portal and Licence, and Licence in turn on
# Charts and Images. Calling gate.yml as well would run those targets twice, and — worse — would
# suggest the workflow is what gates the release. It is not. If somebody ever runs
# `./build.sh Publish` from a laptop, the same gate runs.
#
# ── ⚠ E2E, CHAOS AND LOAD ARE NOT HERE, AND THAT IS ALSO NOT AN OMISSION ─────────────────────────
#
# docs/plan/23 § Test layers gates a release on all three, and Build.Publish.cs explains why they are
# not dependencies: "They run against a real deployment of the candidate, so the order is gate →
# deploy the candidate → suites → publish, and this edge would invert it." The suites live in
# nightly.yml and weekly.yml, against staging. `rollout` below is where that order would be encoded,
# and it is blocked.
#
# ── ⚠ SECRETS THIS WORKFLOW REQUIRES ─────────────────────────────────────────────────────────────
#
#   CONTAINER_REGISTRY   registry and repository prefix for the images Licence scans.
#   REGISTRY_USERNAME    a principal that can push to it.
#   REGISTRY_PASSWORD    its password or token.
#   NUGET_FEED           the feed packages go to. Build.Publish.cs gives it no default on purpose:
#                        "a default feed is how a pre-release build ends up on nuget.org".
#   NUGET_API_KEY        its API key.
#   CHART_REGISTRY       OCI registry for packaged charts, e.g. oci://ghcr.io/acme/cybercloud/charts.
#   PROD_KUBECONFIG      for the staged rollout. Currently unusable — see `rollout`.
#
# ── ⚠ WITHOUT THE SIX, A TAG IS GATED AND NOT PUBLISHED, AND THE STEP LIST SAYS WHICH ────────────
#
# Since issue #25 both jobs gate on their secrets the way main.yml's do (.github/scripts/gate-on-
# secrets.sh): all absent is a step named `skipped: … — docs/plan/23 § CI secrets` and a green job;
# some absent is a failure naming the rest. ⚠ But `./build.sh Publish` is TWO things — the full gate
# and the pushes — and only the pushes need a secret. #25's first draft skipped the whole target when
# the secrets were absent, which left a tag validated by nothing this workflow ran and made the
# docs/plan/23 § CI shape row for this file ("Full gate, publish everything") false in the only shape
# the repository can run; its review said so. So the unconfigured shape runs the gate half by name —
# `./build.sh Test Generate Architecture Portal Licence --skip Images`, which is `Publish`'s own
# dependency list with the one dependency that needs a registry skipped the way weekly.yml's
# `licence` job skips it — and only the pushes are what `skipped:` names. A tag pushed to a repository
# with no release secrets has run every test, every gate and the licence scan; what it has not done
# is release, and the skipped step says exactly that.

name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUKE_TELEMETRY_OPTOUT: 1

jobs:
  publish:
    name: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      # cosign keyless, for the images `Licence` scans. Build.Images.cs § CosignKey.
      id-token: write
    env:
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      NUGET_FEED: ${{ secrets.NUGET_FEED }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      CHART_REGISTRY: ${{ secrets.CHART_REGISTRY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ⚠ Build.Publish.cs § Version falls back to "the tag on HEAD when there is exactly one",
          # which it reads with git. A shallow checkout carries no tags and the fallback silently
          # finds none, so the run would block on a version it could have worked out.
          fetch-depth: 0

      # ⚠ FIRST, and unconditional. Every step below is conditioned on its answer.
      - name: Are the release secrets configured?
        id: secrets
        run: |
          .github/scripts/gate-on-secrets.sh publish \
            "docs/plan/23 § Build, row Publish: 'NuGet, npm, charts, CLI binaries per RID', behind docs/plan/23 § CI shape's single release.yml job. Nothing was published — and because ./build.sh Publish is the full gate, nothing in this workflow gated the tag either." \
            "CONTAINER_REGISTRY=create the secret with the registry and repository prefix" \
            "REGISTRY_USERNAME=create the secret with a principal that can push there" \
            "REGISTRY_PASSWORD=create the secret with its password or token" \
            "NUGET_FEED=create the secret with the feed to push to" \
            "NUGET_API_KEY=create the secret with its API key" \
            "CHART_REGISTRY=create the secret with an oci:// registry for packaged charts"

      - name: "skipped: CONTAINER_REGISTRY / REGISTRY_USERNAME / REGISTRY_PASSWORD / NUGET_FEED / NUGET_API_KEY / CHART_REGISTRY are not configured, so nothing is published — docs/plan/23 § CI secrets"
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "::warning title=publish::tag ${GITHUB_REF_NAME} is GATED below and NOT released — the pushes are the half of ./build.sh Publish that needs the six secrets, and they are absent. docs/plan/23 § CI secrets."

      - uses: ./.github/actions/dotnet

      # ── ⚠ THE PORTAL IS ON THE RELEASE PATH, AND UNTIL NOW ITS NODE WAS NOT PINNED HERE ─────────
      #
      # `Publish` is `.DependsOn(Test, Generate, Architecture, Portal, Licence)` — build/Build.cs
      # § Publish — so `./build.sh Publish` below runs the Portal target, which is `pnpm install
      # --frozen-lockfile` plus `pnpm gates` over portal/. gate.yml's portal job sets Node up from
      # `node-version-file: portal/.node-version`; this job did not, and inherited whatever Node
      # the ubuntu-24.04 image happens to ship.
      #
      # portal/README.md § Node ends on "the CI image must be Node 24 — that is the half of this
      # decision that lives outside this repo", and this was the half of *that* half nobody had
      # checked. It would not have drifted silently — `pnpm node:gate` runs strict on a server
      # build and would have failed the release — but a release that fails on a runner-image bump
      # is not a pin, it is a tripwire over a hole. Same file, same reason, same one number.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: portal/.node-version

      # And the same corepack step, for the same reason gate.yml gives: `packageManager` in
      # portal/package.json is the single pnpm pin, and Build.Portal.cs § ResolvePnpm needs `pnpm`
      # on PATH or it fails the target outright.
      - name: Enable pnpm from portal/package.json's packageManager pin
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: |
          corepack enable pnpm
          echo "node: $(node --version)"
          echo "pnpm: $(cd portal && pnpm --version)"

      # ⚠ In BOTH shapes, the way weekly.yml's `licence` job installs it: on CI a missing syft FAILS
      # `Licence` rather than warning (Build.Licence.cs § ResolveOptionalTool), and the gate half below
      # runs `Licence` over the bundle's upstream images with or without a registry.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # The full `Test` run — no `--test-lane`, so the sixteen *.Cluster.Conformance suites hold a k3s
      # each — is in both shapes below. nightly.yml's `test-full` proves the daemon first for the same
      # reason: a v1 daemon gives every one of them an API server with no node and a skip that reads as
      # a pass (docs/plan/23 § The lane that needs a kubelet).
      - name: Prove Docker can run the container-backed suites
        run: |
          docker version --format 'client {{.Client.Version}}, server {{.Server.Version}}'
          docker run --rm hello-world > /dev/null
          cgroup=$(docker info --format '{{.CgroupVersion}}')
          echo "cgroup version: $cgroup"
          if [ "$cgroup" != "2" ]; then
            echo "::error title=publish::the Docker daemon is on cgroup v$cgroup and k3s v1.35 will not schedule a pod on it, so the cluster-conformance half of the gate would skip and report success. docs/plan/23 § The lane that needs a kubelet."
            exit 1
          fi

      - name: Install cosign
        if: steps.secrets.outputs.configured == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to the registry
        if: steps.secrets.outputs.configured == 'true'
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "${CONTAINER_REGISTRY%%/*}" \
            --username "$REGISTRY_USERNAME" --password-stdin

      # ⚠ The version is taken from the tag rather than passed, so the artefacts cannot be named
      # after something other than what triggered the release. Build.Publish.cs § Version does the
      # same fallback; passing it explicitly here makes the failure "the tag is not vN.N.N" rather
      # than "HEAD carries no tag", which is a more useful thing to read.
      - name: ./build.sh Publish
        if: steps.secrets.outputs.configured == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *[!0-9.a-zA-Z-]* | '' )
              echo "::error title=Publish::the tag '$GITHUB_REF_NAME' does not look like a version. release.yml triggers on 'v*' and the version is the tag with the leading v removed."
              exit 1
              ;;
          esac
          echo "Publishing $version from $GITHUB_REF_NAME"
          .github/scripts/run-build.sh "$RUNNER_TEMP/publish.log" Publish \
            --version "$version" \
            --container-registry "$CONTAINER_REGISTRY" \
            --container-image-tag "$version" \
            --nuget-feed "$NUGET_FEED" \
            --nuget-api-key "$NUGET_API_KEY" \
            --chart-registry "$CHART_REGISTRY"

      # ── The gate without the pushes ──────────────────────────────────────────────────────────────
      #
      # Build.cs § Publish: `.DependsOn(Test, Generate, Architecture, Portal, Licence)`. This is that
      # list, invoked by name, so a tag with no release secrets is still gated by exactly what
      # `Publish` would have gated it by. ⚠ Kept as the LIST rather than as `Publish --skip Publish`
      # or a new `Gate` target: Nuke cannot skip the target it was invoked with, and a second node
      # that repeats `Publish`'s dependency list is a list that drifts the first time one of them
      # changes — Build.Publish.cs § PublishArtefacts is where "the gate" is defined, and this step
      # cites it rather than copying it into the build. `--skip Images` is weekly.yml's shape for the
      # one dependency that needs a registry: Build.Licence.cs reports the platform-image half as ○
      # and scans the bundle half in full.
      - name: ./build.sh Test Generate Architecture Portal Licence --skip Images
        if: steps.secrets.outputs.configured != 'true'
        run: |
          .github/scripts/run-build.sh "$RUNNER_TEMP/gate.log" \
            Test Generate Architecture Portal Licence --skip Images

      # The same two guards nightly.yml's `test-full` has, because a gate that ran nothing is the
      # failure the whole of #25 is about. `always()`, so a red gate still says which half was red.
      - name: The gate's suites actually ran
        if: always() && steps.secrets.outputs.configured != 'true'
        run: .github/scripts/assert-suites-ran.sh artifacts/test-results "$RUNNER_TEMP/gate.log"

      - name: The gate scanned what it could and said what it could not
        if: steps.secrets.outputs.configured != 'true'
        run: |
          if grep -q 'coverage floor was NOT ENFORCED' "$RUNNER_TEMP/gate.log"; then
            echo "::error title=publish::./build.sh Test measured no coverage at all and still exited 0. Build.Test.cs § EnforceCoverageFloor is supposed to make that a hard failure whenever IsServerBuild."
            exit 1
          fi
          if ! grep -q 'Images was skipped' "$RUNNER_TEMP/gate.log"; then
            echo "::error title=publish::./build.sh Licence --skip Images did not report the platform-image half as skipped. Build.Licence.cs § ScanPlatformImages prints that ○ so a reader of this run knows what was not scanned; its absence means the row went quiet."
            exit 1
          fi
          echo "○ Platform images not scanned — no registry. Every other half of the gate ran."
          grep -E 'Licence: [0-9]+ artefact' "$RUNNER_TEMP/gate.log" | tail -1

      # What the gate half leaves behind, kept as long as a release would be: a tag with no release
      # secrets is still a tag somebody may ship from by hand, and this is the evidence it was gated.
      - name: Upload the gate's results
        if: always() && steps.secrets.outputs.configured != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-${{ github.ref_name }}
          path: |
            artifacts/test-results/
            artifacts/coverage/
            artifacts/licence/
          # `warn`: a gate that died in Compile has nothing here, and the job is already red for it.
          if-no-files-found: warn
          retention-days: 400

      # ⚠ `Publish` reports zero npm packages and carries on, deliberately — docs/plan/21 § Other
      # SDKs says the TypeScript client is not written. It does NOT tolerate zero of the other
      # three, but "tolerates" is a property of the target and this is a release: the check that the
      # artefacts exist belongs to whoever is about to be unable to install them.
      - name: Something was actually published
        if: always() && steps.secrets.outputs.configured == 'true'
        run: |
          packages=$(find artifacts/packages -name '*.nupkg' 2>/dev/null | wc -l | tr -d ' ')
          charts=$(find artifacts/charts -name '*.tgz' 2>/dev/null | wc -l | tr -d ' ')
          binaries=$(find artifacts/cyc -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          echo "nupkg: $packages, charts: $charts, cyc RIDs: $binaries"
          if [ "$packages" -eq 0 ] && [ "$charts" -eq 0 ] && [ "$binaries" -eq 0 ]; then
            echo "::error title=Publish::the release produced no packages, no charts and no CLI binaries. Whatever else this run did, it did not release anything."
            exit 1
          fi

      - name: Upload the release artefacts
        if: always() && steps.secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/packages/
            artifacts/charts/
            artifacts/cyc/
            artifacts/images.json
            artifacts/sbom/
          if-no-files-found: warn
          retention-days: 400

  # ── docs/plan/23 § Environments and rollout: canary → 25 % → 100 % ──────────────────────────────
  #
  # ⚠ BLOCKED, on the same two things as main.yml's deploy-dev plus one of its own.
  #
  #   1. There is no `Deploy` target — Build.cs § target graph.
  #   2. `charts/platform` does not exist; charts/ holds agent, bundle and managed.
  #   3. Nothing measures the rollback triggers. docs/plan/23 § Environments and rollout requires
  #      "automatic rollback on error rate, p99 or grain-activation-failure regression", which needs
  #      those three signals queryable per canary. docs/plan/16 describes the observability that
  #      would answer them; nothing here reads it.
  #
  # ⚠ A staged rollout without 3 is not a staged rollout, it is a slow deploy. Written down because
  # the tempting shortcut is to ship 1 and 2 with a `sleep 600` between stages and call the row
  # done — and the whole value of a canary is the thing that decides to stop.
  rollout:
    name: rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same two-kinds-of-blocker shape as main.yml's deploy-dev: no kubeconfig is a skip that
      # names the three pieces of work in a warning; a kubeconfig is a failure that names them in
      # an error, because a secret nothing can consume is a misconfiguration worth a red.
      #
      # ⚠ The secret is materialised on THIS STEP and not on the job. master never read
      # PROD_KUBECONFIG at all; the only thing this job does with it is ask whether it is empty, and
      # a production kubeconfig in the environment of every step of an unprotected job — there is no
      # `environment:` here, because nothing here deploys — is a wider landing than a yes/no needs.
      # When the three blockers below are gone and a rollout step exists, it gets the secret on its
      # own `env:` and the job gets an `environment: prod` with its protection rules.
      - name: Is the production kubeconfig configured?
        id: secrets
        env:
          PROD_KUBECONFIG: ${{ secrets.PROD_KUBECONFIG }}
        run: |
          .github/scripts/gate-on-secrets.sh rollout \
            "docs/plan/23 § Environments and rollout: canary → 25 % → 100 %, with automatic rollback. Nothing was rolled out." \
            "PROD_KUBECONFIG=create the secret with a kubeconfig for prod — after the three blockers below are gone, not before"

      - name: "skipped: PROD_KUBECONFIG is not configured — docs/plan/23 § CI secrets"
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "::warning title=rollout::rollout is also BLOCKED on 3 input(s) that are not secrets — no Deploy target in build/, no charts/platform, and nothing that can answer 'is the canary healthy?'. Creating PROD_KUBECONFIG would turn this skip into a failure, not into a rollout. docs/plan/23 § CI secrets, 'Blocked on work, not on a secret'."

      - name: What a staged rollout needs that this repository does not have
        if: steps.secrets.outputs.configured == 'true'
        run: |
          cat <<'BLOCKED'
          ::error title=rollout::rollout is BLOCKED on 3 input(s), none of them a secret.
          BLOCKED
          cat <<'BLOCKED'

            ✘ the build has no `Deploy` target.
              To unblock: add one, in build/. ⚠ Not `helm upgrade` written here — docs/plan/23
              § Build makes ./build.sh the single entry point so CI and a workstation run the same
              code, and a rollout is exactly the procedure you most want to be able to rehearse.

            ✘ charts/platform does not exist.
              To unblock: add it. deploy/README.md § What an operator actually types documents
              `helm install cybercloud charts/platform --set image=…`.

            ✘ nothing can answer "is the canary healthy?".
              To unblock: make error rate, p99 and grain-activation failures queryable per rollout
              stage — docs/plan/16 § Observability. docs/plan/23 § Environments and rollout requires
              AUTOMATIC rollback on a regression in any of the three, and a canary with no abort
              condition is a deploy with extra steps.

          The release itself is unaffected: `publish` above pushed the packages, charts and binaries.
          What has not happened is the staged rollout onto prod.
          BLOCKED
          exit 1
