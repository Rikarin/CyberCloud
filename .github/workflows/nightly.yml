# docs/plan/23 § CI shape, row `nightly.yml`: "02:00 | E2E, cluster e2e, hostile BYO, chaos,
# security".
#
# ── ⚠ WHAT RUNS TONIGHT, WHAT SKIPS, AND WHAT IS STILL RED — EACH FOR A REASON IT SAYS ITSELF ────
#
# Until issue #25 every job here was red on every run, and for three different reasons that a red
# tick cannot tell apart: a secret that does not exist, a suite that does not exist, and a real
# finding. This file now keeps them apart, because a job that is red for a reason nobody can act on
# hides the red somebody could.
#
# RUNS, and is green when the tree is:
#   * `test-full` — `./build.sh Test` over every suite in one process, the only run in which the
#     coverage floor sees all of them (gate.yml splits them into two lanes; Build.Test.cs § TestLane).
#   * `bootstrap-kind` and the four `hostile-byo` legs — `./build.sh Bootstrap` against a real API
#     server: manifest rendering, RBAC namespacing and the schema Job's shape, validated by a
#     Kubernetes four minors old, by restricted Pod Security, by a cluster with no default storage
#     class, and by a cluster with a webhook that says no. docs/plan/23 § Test layers calls that
#     row "the brief's core premise". Since #25 these call `Bootstrap`, a target of its own, rather
#     than `E2E` — which did the same dry-run and then failed on a suite that does not exist, so a
#     dry-run that passed and one that failed were the same red (Build.Bootstrap.cs' header).
#   * `security-history` — the whole-history secret scan and the closure audit.
#
# SKIPS, with a step named for the secret and docs/plan/23 § CI secrets naming who sets it:
#   * `e2e` and `chaos` — E2E_BASE_URL and STAGING_KUBECONFIG. ⚠ Both are also BLOCKED on suites
#     that do not exist (test/CyberCloud.E2E, test/CyberCloud.Chaos); with the secrets set they fail
#     on that, by design (Build.cs § target graph), so the skip step says so.
#   * `security-runtime` — a registry for Trivy to scan and a staging for ZAP to baseline.
#
# ── ⚠ SECRETS THIS WORKFLOW USES ─────────────────────────────────────────────────────────────────
#
#   E2E_BASE_URL         base URL of staging, e.g. https://api.staging.cybercloud.example.
#                        Build.E2E.cs § E2EBaseUrl has no fallback on purpose: "an E2E run against a
#                        local process is a different test wearing this one's name".
#   STAGING_KUBECONFIG   kubeconfig for staging, for the bootstrap dry-run and for Chaos.
#   STAGING_KUBE_CONTEXT the context name inside it. Optional; defaults to the current-context.
#   CONTAINER_REGISTRY   registry prefix, so Trivy knows what to scan.
#   REGISTRY_USERNAME    a principal that can pull from it.
#   REGISTRY_PASSWORD    its password or token.
#   ZAP_TARGET_URL       what ZAP baselines. Usually the same host as E2E_BASE_URL.

name: nightly

on:
  schedule:
    # ⚠ 02:00 UTC. docs/plan/23 § CI shape says "02:00" without a zone, and GitHub cron has no zone
    # but UTC — recorded here so the next person does not have to work out which 02:00 it meant.
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUKE_TELEMETRY_OPTOUT: 1

jobs:
  # ── docs/plan/23 § Test layers, every "Every PR" row, in one process ─────────────────────────────
  #
  # gate.yml runs the same suites as two lanes — `test` on every PR, `test-cluster` on every merge —
  # and neither lane's coverage floor sees every suite. This job is the one that does: the same
  # `./build.sh Test` a developer runs, with no `--test-lane`, and the same three guards gate.yml's
  # `test` job has. There is no budget here, which is what lets it be one process.
  test-full:
    name: test-full
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dotnet

      - name: Prove Docker can run the container-backed suites
        run: |
          docker version --format 'client {{.Client.Version}}, server {{.Server.Version}}'
          docker run --rm hello-world > /dev/null
          echo "cgroup version: $(docker info --format '{{.CgroupVersion}}')"

      - name: ./build.sh Test
        run: .github/scripts/run-build.sh "$RUNNER_TEMP/test.log" Test

      - name: Prove the suites actually ran
        if: always()
        run: .github/scripts/assert-suites-ran.sh artifacts/test-results "$RUNNER_TEMP/test.log"

      # The same two greps as gate.yml's `test` job, for the same reason it gives: Nuke's host
      # detection is load-bearing for the floor, so the log gets a second reader.
      - name: The coverage floor was measured, not skipped
        run: |
          if grep -q 'coverage floor was NOT ENFORCED' "$RUNNER_TEMP/test.log"; then
            echo "::error title=Coverage floor::./build.sh Test came back with ○ — it measured no coverage at all — and CI still saw a zero exit code. Build.Test.cs § EnforceCoverageFloor is supposed to make that a hard failure whenever IsServerBuild. docs/plan/23 § Test layers."
            exit 1
          fi
          if ! grep -q 'shipping project(s) at or above the' "$RUNNER_TEMP/test.log"; then
            echo "::error title=Coverage floor::./build.sh Test exited 0 without printing the line that says the floor was applied. docs/plan/23 § Test layers."
            exit 1
          fi
          grep -E 'Test: coverage floor|shipping project\(s\) at or above|  (✔|✘|○|▪) CyberCloud' "$RUNNER_TEMP/test.log"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-full
          path: |
            artifacts/test-results/
            artifacts/coverage/
          if-no-files-found: error
          retention-days: 14

  # ── docs/plan/23 § Test layers, row E2E: "Playwright + `cyc` against a real staging deployment" ──
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      STAGING_KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Are the staging secrets configured?
        id: secrets
        run: |
          .github/scripts/gate-on-secrets.sh e2e \
            "docs/plan/23 § Test layers, row E2E, gating 'green before release'. No journey ran against anything." \
            "E2E_BASE_URL=create the secret with staging's base URL" \
            "STAGING_KUBECONFIG=create the secret with a kubeconfig for staging"

      - name: "skipped: E2E_BASE_URL / STAGING_KUBECONFIG are not configured — docs/plan/23 § CI secrets"
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "::warning title=e2e::e2e is also BLOCKED on a suite that does not exist — test/CyberCloud.E2E — and on a cyc CLI under cli/. With the secrets set, ./build.sh E2E fails naming both (Build.E2E.cs). docs/plan/23 § CI secrets, 'Blocked on work, not on a secret'."

      - uses: ./.github/actions/dotnet
        if: steps.secrets.outputs.configured == 'true'

      - name: Point kubectl at staging
        if: steps.secrets.outputs.configured == 'true'
        run: |
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$STAGING_KUBECONFIG" > "$HOME/.kube/config"
          kubectl config current-context

      # ⚠ Expected to fail on its preconditions today — `test/CyberCloud.E2E` does not exist and
      # `cli/` holds no project, both confirmed by running it. What runs BEFORE that failure is the
      # bootstrap preflight and dry-run against staging, which is why the job is not `Bootstrap`
      # alone: against staging the row is the E2E row, and a red here is the honest answer until
      # the suite exists.
      - name: ./build.sh E2E
        if: steps.secrets.outputs.configured == 'true'
        run: |
          context="${{ secrets.STAGING_KUBE_CONTEXT }}"
          [ -n "$context" ] || context="$(kubectl config current-context)"
          .github/scripts/run-build.sh "$RUNNER_TEMP/e2e.log" E2E \
            --e2e-base-url "$E2E_BASE_URL" \
            --kube-context "$context"

      - name: The bootstrap half ran, whatever the suite did
        if: always() && steps.secrets.outputs.configured == 'true'
        run: .github/scripts/assert-bootstrap-exercised.sh "$RUNNER_TEMP/e2e.log" cluster

  # ── docs/plan/23 § Test layers, row Cluster e2e — the part of it that exists ─────────────────────
  #
  # "kind + CAPI + Kamaji + KubeVirt: create and destroy a real tenant cluster | Nightly, ~20 min |
  # ⚠ The highest-value test in the suite — the one that catches operator drift".
  #
  # ⚠ THIS JOB IS NOT THAT ROW, AND ITS NAME SAYS SO. It was called `cluster-e2e` and ran `E2E`,
  # which did a bootstrap dry-run against the kind cluster and then failed on the missing suite —
  # every night, for the same reason, with the dry-run's pass buried in the log. What is here is
  # what exists: a real cluster, a real API server, and bootstrap.sh --dry-run against it, which is
  # the only way to exercise the manifests themselves (Build.Bootstrap.cs § BootstrapDryRun). That
  # catches the class of operator drift that is "the manifests no longer apply".
  #
  # CAPI, Kamaji and KubeVirt are NOT installed, and the reason is not runner capacity. There is
  # nothing to drive them with: the row's assertion is "create and destroy a real tenant cluster",
  # test/CyberCloud.E2E does not exist, and installing three operators so that a job can then report
  # it has no test to run would be an expensive way to stay exactly as covered as this is. And a
  # KubeVirt guest needs /dev/kvm, which a GitHub-hosted runner does not lend — docs/plan/23 § The
  # lane that needs a kubelet puts the row on the VM lane. Unblocking the row means writing the
  # suite first; docs/plan/23 § CI secrets lists it under "Blocked on work, not on a secret".
  bootstrap-kind:
    name: bootstrap-kind
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dotnet

      - name: Create the kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: bootstrap-kind
          node_image: kindest/node:v1.35.0
          wait: 180s

      - name: The cluster is real
        run: |
          kubectl --context kind-bootstrap-kind get nodes -o wide
          nodes=$(kubectl --context kind-bootstrap-kind get nodes --no-headers | wc -l | tr -d ' ')
          if [ "$nodes" -eq 0 ]; then
            echo "::error title=bootstrap-kind::the kind cluster reports 0 nodes, so the dry-run below would validate nothing."
            exit 1
          fi
          echo "$nodes node(s)."

      - name: ./build.sh Bootstrap against the kind cluster
        run: |
          .github/scripts/run-build.sh "$RUNNER_TEMP/bootstrap-kind.log" Bootstrap \
            --kube-context kind-bootstrap-kind

      # ⚠ Kept even though the job now fails on its own when the dry-run does. The day somebody drops
      # --kube-context from the step above, Build.Bootstrap.cs warns and exits 0 — the manifests
      # were never rendered, the job stays green — and this is what notices.
      - name: The dry-run reached the API server
        if: always()
        run: .github/scripts/assert-bootstrap-exercised.sh "$RUNNER_TEMP/bootstrap-kind.log" cluster

  # ── docs/plan/23 § Test layers, row Hostile BYO: "The brief's core premise" ──────────────────────
  hostile-byo:
    name: hostile-byo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every leg runs even when one fails: "old minor breaks and PSA also breaks" and "only old
      # minor breaks" are different bugs, and finding out one per night is four nights.
      fail-fast: false
      matrix:
        # ⚠ The four hostilities docs/plan/23 § Test layers names, one job each. A leg removed from
        # here has to be removed from `hostile-byo-complete` below too, which is what stops this
        # list from quietly shrinking.
        leg:
          - old-minor
          - restrictive-psa
          - no-default-storage-class
          - rejecting-webhook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dotnet

      # kind is on the runner image (0.32.0), so there is no installer step. The script proves the
      # cluster is hostile in the intended way before anything runs against it — see the note at the
      # head of make-hostile-cluster.sh for why that proof is the point.
      - name: Create a ${{ matrix.leg }} cluster and prove it is hostile
        run: .github/scripts/make-hostile-cluster.sh "${{ matrix.leg }}" "hostile-${{ matrix.leg }}"

      - name: ./build.sh Bootstrap against the ${{ matrix.leg }} cluster
        run: |
          .github/scripts/run-build.sh "$RUNNER_TEMP/hostile.log" Bootstrap \
            --kube-context "kind-hostile-${{ matrix.leg }}"

      - name: The dry-run reached the hostile API server
        if: always()
        run: .github/scripts/assert-bootstrap-exercised.sh "$RUNNER_TEMP/hostile.log" cluster

      - name: Tear the cluster down
        if: always()
        run: kind delete cluster --name "hostile-${{ matrix.leg }}"

  # ⚠ A matrix that expands to zero produces no jobs and no error: the matrix job reports `skipped`
  # and every `needs` on it is satisfied. That is the same shape as a path filter that matches
  # nothing, and it is why this job exists rather than trusting the list above to stay non-empty.
  hostile-byo-complete:
    name: hostile-byo-complete
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: hostile-byo
    if: always()
    steps:
      - name: Every hostility was actually attempted
        run: |
          result='${{ needs.hostile-byo.result }}'
          echo "hostile-byo: $result"
          if [ "$result" = "skipped" ]; then
            echo "::error title=Hostile BYO::the hostile-byo matrix produced no jobs. docs/plan/23 § Test layers names four hostilities and this workflow ran none of them, silently. Check the \`matrix.leg\` list in nightly.yml."
            exit 1
          fi
          if [ "$result" != "success" ]; then
            echo "::error title=Hostile BYO::at least one hostility leg failed — see the matrix jobs. This is not the empty-matrix case; the legs ran."
            exit 1
          fi
          echo "All four hostilities ran."

  # ── docs/plan/23 § Test layers, row Chaos; the assertions are § The chaos invariants ─────────────
  chaos:
    name: chaos
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STAGING_KUBECONFIG: ${{ secrets.STAGING_KUBECONFIG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is the staging kubeconfig configured?
        id: secrets
        run: |
          .github/scripts/gate-on-secrets.sh chaos \
            "docs/plan/23 § The chaos invariants: 'Each is an assertion, not an observation.' An assertion needs something to assert against, and nothing was asserted." \
            "STAGING_KUBECONFIG=create the secret with a kubeconfig for a cluster that can lose a silo, a shard and a NATS node without anybody minding"

      - name: "skipped: STAGING_KUBECONFIG is not configured — docs/plan/23 § CI secrets"
        if: steps.secrets.outputs.configured != 'true'
        run: |
          echo "::warning title=chaos::chaos is also BLOCKED on a suite that does not exist — test/CyberCloud.Chaos — and on an environment whose size can be verified (Build.Chaos.cs). With the secret set, ./build.sh Chaos fails naming both. docs/plan/23 § CI secrets, 'Blocked on work, not on a secret'."

      - uses: ./.github/actions/dotnet
        if: steps.secrets.outputs.configured == 'true'

      - name: Point kubectl at staging
        if: steps.secrets.outputs.configured == 'true'
        run: |
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$STAGING_KUBECONFIG" > "$HOME/.kube/config"
          kubectl config current-context

      # ⚠ Expected to fail on three preconditions today, and the third is the interesting one:
      # Build.Chaos.cs reports the environment's SIZE as unverifiable — invariant 7 needs 30 silos
      # and nothing can count them. A green chaos run against a three-silo staging would be worse
      # than this red one.
      - name: ./build.sh Chaos
        if: steps.secrets.outputs.configured == 'true'
        run: |
          context="${{ secrets.STAGING_KUBE_CONTEXT }}"
          [ -n "$context" ] || context="$(kubectl config current-context)"
          ./build.sh Chaos --kube-context "$context"

  # ── docs/plan/23 § Test layers, row Security: the nightly half ───────────────────────────────────
  #
  # The PR half (CodeQL, NuGetAudit, secret-scan-the-diff, dependency review, action pins) is in
  # pr.yml. What is here is the two that need something a PR does not have — a pushed image and a
  # running staging — plus a secret scan of the whole history rather than of one diff.
  security-history:
    name: security-history
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/dotnet

      # ⚠ The whole history, not the diff. A secret that was committed and then removed is still on
      # every clone and still valid; the per-PR scan cannot see it, because by then it is not in any
      # diff under review.
      # ⚠ No `--fail` in extra_args. The action's own entrypoint already passes it, and trufflehog
      # rejects the repeat outright — "error: flag 'fail' cannot be repeated" — which is how this
      # step failed every night: not on a finding, but before scanning anything at all. The failing
      # behaviour the flag asks for is the action's default and is unchanged by dropping it.
      # ⚠ `verified,unknown` WITH FOUR FIXTURE FILES EXCLUDED BY PATH, since issue #25's review. The
      # scan exited 183 every night on the same thirteen `unknown` results — connection strings in
      # SecretScrubbingSinkTests, OrleansAdoNetSchemaTests, HashTagAndShardMapTests and
      # DocumentDbReconcilerTests, each naming a fixture host a runner cannot reach, so verification
      # never finished — `verified_secrets: 0` in its own summary. A test of a secret scrubber has to
      # contain a secret-shaped string. The first fix was `--results=verified`, tree-wide, and that
      # gave up the one finding this repository is most likely to produce: a REAL connection string
      # to a private address is `unknown` to a runner too. So the four files are excluded by path in
      # .github/trufflehog-exclude-paths.txt, which says what each one tests, and `unknown` stays on
      # for everything else. Measured 2026-09-18 over the full history with trufflehog 3.96.0:
      # thirteen results without the file, zero with it, and a sabotage commit outside the four
      # files reported. pr.yml's diff scan has the same setting and the same paragraph.
      - name: Secret scan, full history
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude-paths.txt

      # Re-run nightly as well as per-PR: advisories are published against packages nobody touched,
      # so a repository with no PRs for a week is a repository whose audit is a week old.
      - name: NuGetAudit over the full closure
        run: .github/scripts/audit-packages.sh

  security-runtime:
    name: security-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      ZAP_TARGET_URL: ${{ secrets.ZAP_TARGET_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Are the registry and staging secrets configured?
        id: secrets
        run: |
          .github/scripts/gate-on-secrets.sh security-runtime \
            "docs/plan/23 § Test layers, row Security: 'Trivy on images … ZAP against staging', gated on 'No criticals'. No image was scanned and no host was baselined." \
            "CONTAINER_REGISTRY=create the secret so Trivy knows which repository to scan" \
            "REGISTRY_USERNAME=create the secret with a principal that can pull from it" \
            "REGISTRY_PASSWORD=create the secret with its password or token" \
            "ZAP_TARGET_URL=create the secret with staging's base URL for the ZAP baseline"

      - name: "skipped: CONTAINER_REGISTRY / REGISTRY_USERNAME / REGISTRY_PASSWORD / ZAP_TARGET_URL are not configured — docs/plan/23 § CI secrets"
        if: steps.secrets.outputs.configured != 'true'
        run: echo "Trivy scanned no image and ZAP baselined no host tonight. docs/plan/23 § CI secrets says which secret unlocks each and who sets it."

      - name: Install trivy
        if: steps.secrets.outputs.configured == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      # ⚠ Scans the digests main.yml actually pushed, taken from the `images` artifact it uploads —
      # not a `:latest` tag. docs/plan/18 § Platform security: "A pinned digest, never a tag", and a
      # scan of a tag is a scan of whatever that tag pointed at this minute.
      - name: Trivy over every image main.yml pushed
        if: steps.secrets.outputs.configured == 'true'
        run: .github/scripts/scan-images.sh

      # ZAP writes its findings into repository issues by default. Turned off: an unattended nightly
      # that opens issues turns a scanner into a spammer, and the report is uploaded as an artifact
      # instead.
      - name: ZAP baseline against staging
        if: steps.secrets.outputs.configured == 'true'
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ secrets.ZAP_TARGET_URL }}
          allow_issue_writing: false
          fail_action: true
