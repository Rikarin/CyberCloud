# docs/plan/23 § CI shape, row `weekly.yml`: "Sunday | Load, licence scan, dependency review, a
# restore drill".
#
# ── ⚠ ONE OF THOSE FOUR CANNOT LIVE HERE, AND IT IS A DOC DEFECT RATHER THAN A CHOICE ────────────
#
# "dependency review" is actions/dependency-review-action, which compares a pull request's
# dependency graph against its base. A schedule has no pull request and no base, so the action
# cannot run here at all. It lives in pr.yml, where it works. What runs weekly instead is the
# vulnerability audit over the full transitive closure — which is the half of "dependency review"
# that is meaningful without a diff, and which catches an advisory published against a package
# nobody has touched in a month.
#
# ── ⚠ WHAT RUNS ON A SUNDAY WITH NO SECRETS, AND WHAT SKIPS ──────────────────────────────────────
#
# Until issue #25 all four jobs were red on every Sunday. `dependencies` was red on a real finding
# (SSH.NET 2025.1.0 under Testcontainers, two High advisories — pinned to 2026.0.0 in
# Directory.Packages.props); the other three were red on inputs that do not exist, which is a red
# nobody can act on and a red that hides the one somebody could.
#
#   `licence`       RUNS. The bundle half of the scan — every component's LICENSE file at its pinned
#                   release (twenty on 2026-09-18), their charts' annotations, their images' labels
#                   (thirty-three) and, with syft, what each image links — needs a network and no
#                   secret. The platform-
#                   image half needs `Images`, which needs a registry, so without one the job says
#                   `--skip Images` and Build.Licence.cs reports that half as ○ rather than ✘.
#   `dependencies`  RUNS.
#   `load`          RUNS (issue #44): test/CyberCloud.Load starts the chaos suite's topology in the
#                   runner's Docker and puts the real gateway in front of it, at a tenth of
#                   docs/plan/23's rates. Build.Load REFUSES an --e2e-base-url rather than ignoring
#                   one; the full-scale run against staging is owed under docs/plan/23 § The load
#                   scenarios and will need E2E_BASE_URL and a token source back here when it lands.
#   `restore-drill` BLOCKED on three things that are not secrets, and now says so as a warning
#                   annotation on a green job rather than as a red one. See the job for the argument.
#
# ── ⚠ SECRETS THIS WORKFLOW USES ─────────────────────────────────────────────────────────────────
#
#   E2E_BASE_URL         not read by any job today — see `load` above; it comes back with the
#                        full-scale suite mode.
#   CONTAINER_REGISTRY   the registry `Images` pushes to, so `Licence` can scan the platform's own
#   REGISTRY_USERNAME    images too. Without them the bundle half of the scan still runs in full.
#   REGISTRY_PASSWORD
#   DOCKERHUB_USERNAME   optional — spends an account's Docker Hub budget on the manifest reads the
#   DOCKERHUB_TOKEN      scan makes, instead of the runner's shared anonymous one. See `licence`.

name: weekly

on:
  schedule:
    # ⚠ Sunday, 03:00 UTC. docs/plan/23 § CI shape says "Sunday" and no time; an hour after the
    # nightly so the two do not contend for runners.
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUKE_TELEMETRY_OPTOUT: 1

jobs:
  # ── docs/plan/23 § Test layers, row Load; the budgets are § The load scenarios ───────────────────
  #
  # ⚠ A TENTH OF THE ROWS' RATES, ON A RUNNER, AND THE LOG SAYS SO ON EVERY LINE. The suite drives
  # 500 rps of reads, 50 writes/s and 2 000 checks/s through the real gateway over a topology it
  # starts in Docker; the budgets are not scaled, so a p99 met here is necessary for the row and not
  # sufficient. The committed load-baseline.json is provisional — one laptop run, no release — so
  # Build.Load prints the deltas against it and blocks on none of them until a release stamps the
  # file (Build.Load.cs § LoadBaselineFile). A runner's numbers are a runner's; docs/plan/23's
  # finding 3 is what a machine other tenants share does to a p99, and a shared GitHub runner is
  # one. The job is red while a budget row is ✘, which the write p99 and the queue slope are.
  load:
    name: load
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove Docker can host the topology
        run: |
          docker version --format 'client {{.Client.Version}}, server {{.Server.Version}}'
          docker info --format 'cgroup {{.CgroupVersion}}'
          docker run --rm hello-world > /dev/null
          echo "Docker works — the suite can start its Redis, shards, k3s, silos and the gateway."

      - name: ./build.sh Load
        run: .github/scripts/run-build.sh "$RUNNER_TEMP/load.log" Load

      - name: Upload the load results
        if: always() && steps.secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-results
          path: artifacts/load/
          # ⚠ `warn`, not `error`, and this is the one place in these workflows that is right.
          # Build.Load.cs § LoadResults exists because "the run and the gate genuinely happen in
          # different places" — a blocked run has no results to upload and the job is already red
          # for the real reason.
          if-no-files-found: warn
          retention-days: 400

  # ── docs/plan/23 § Build, row `Licence`: "ADR-011 scan over charts and images" ───────────────────
  #
  # `Licence` depends on `Charts` and `Images`. `Charts` runs here — helm is on the runner image.
  # `Images` needs a registry, and the two shapes of this job follow from whether there is one:
  #
  #   * registry configured: cosign, login, `./build.sh Licence` in full — Charts, Images, the scan
  #     over the bundle AND over the SBOMs Images just wrote.
  #   * registry absent: `./build.sh Licence --skip Images`. Build.Licence.cs § ScanPlatformImages
  #     tells a skip asked for by name from an Images that ran and wrote nothing, and reports the
  #     platform-image half as ○ with a warning rather than as the ✘ it was every Sunday until #25.
  #     The bundle half — every component's licence read off its artefacts, every upstream image's
  #     contents through syft against ADR-011's deny-list — runs in full either way.
  #
  # ⚠ syft IS INSTALLED BY THIS JOB IN BOTH SHAPES, AND THAT IS LOAD-BEARING. On CI a missing syft
  # FAILS the target rather than warning (Build.Licence.cs § ResolveOptionalTool): a weekly scan that
  # skipped the SBOM half would be green over exactly the row with a legal consequence.
  #
  # ⚠ DOCKER HUB RATIONS ANONYMOUS MANIFEST READS, AND GITHUB RUNNERS SHARE ADDRESSES. Eleven of the
  # bundle's thirty-two images are on docker.io; the scan makes two manifest GETs per image, and a
  # runner whose address is already over the 100-per-six-hours budget gets HTTP 429 on all of them —
  # which the scan reports as a finding, because an artefact it could not read is one it did not
  # scan. build/OciRegistry.cs reads DOCKERHUB_USERNAME and DOCKERHUB_TOKEN when they are set and
  # spends the account's budget instead. They are optional and are passed below when present. ⚠ The
  # first no-registry run of this job is where that rate limit will be measured for real; if it
  # bites, the two secrets are the fix and docs/plan/23 § CI secrets lists them.
  #
  # The tripwire step stays: it exits 0 the moment the log no longer says "Not implemented yet",
  # which it no longer does, and .github/scripts/assert-stub-still-blocked.sh explains why the call
  # is kept rather than removed.
  licence:
    name: licence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dotnet

      - name: Is the registry configured?
        id: secrets
        run: |
          .github/scripts/gate-on-secrets.sh licence \
            "docs/plan/23 § Build, row Licence: an ADR-011 scan over charts and images. Build.cs makes Licence depend on Images, so the platform's own images can only be scanned where they can be pushed. The bundle's components and upstream images are scanned below regardless." \
            "CONTAINER_REGISTRY=create the secret with the registry and repository prefix" \
            "REGISTRY_USERNAME=create the secret with a principal that can push there" \
            "REGISTRY_PASSWORD=create the secret with its password or token"

      - name: "skipped: CONTAINER_REGISTRY / REGISTRY_USERNAME / REGISTRY_PASSWORD are not configured, so the platform's own images are not scanned — docs/plan/23 § CI secrets"
        if: steps.secrets.outputs.configured != 'true'
        run: echo "The bundle half of the scan runs below with --skip Images. The platform-image half is reported as ○ by Build.Licence.cs."

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install cosign
        if: steps.secrets.outputs.configured == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to the registry
        if: steps.secrets.outputs.configured == 'true'
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "${CONTAINER_REGISTRY%%/*}" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: ./build.sh Licence
        if: steps.secrets.outputs.configured == 'true'
        run: |
          .github/scripts/run-build.sh "$RUNNER_TEMP/licence.log" Licence \
            --container-registry "$CONTAINER_REGISTRY" \
            --container-image-tag "weekly-${GITHUB_SHA::7}"

      - name: ./build.sh Licence --skip Images
        if: steps.secrets.outputs.configured != 'true'
        run: .github/scripts/run-build.sh "$RUNNER_TEMP/licence.log" Licence --skip Images

      # ⚠ Two different sentences have to be true of the log, depending on which shape ran. With a
      # registry, the platform images MUST have been scanned — a "was skipped" in that log means
      # `--skip Images` leaked into the configured path. Without one, the ○ MUST be there — its
      # absence means Build.Licence.cs stopped reporting the half it did not scan.
      - name: The scan covered what it could and said what it could not
        run: |
          if [ "${{ steps.secrets.outputs.configured }}" = "true" ]; then
            if grep -q 'Images was skipped' "$RUNNER_TEMP/licence.log"; then
              echo "::error title=Licence::the registry is configured and the log still says Images was skipped, so the platform's own images were not scanned on a run that could have scanned them."
              exit 1
            fi
            echo "Platform images scanned from the SBOMs Images wrote."
          else
            if ! grep -q 'Images was skipped' "$RUNNER_TEMP/licence.log"; then
              echo "::error title=Licence::./build.sh Licence --skip Images did not report the platform-image half as skipped. Build.Licence.cs § ScanPlatformImages prints that ○ so a reader of this run knows what was not scanned; its absence means the row went quiet."
              exit 1
            fi
            echo "○ Platform images not scanned — no registry. The bundle half ran in full."
          fi
          grep -E 'Licence: [0-9]+ artefact' "$RUNNER_TEMP/licence.log" | tail -1

      # The moment there is something to scan, a stub that scans it is no longer an acceptable pass.
      - name: Licence is not a stub over real artefacts
        if: always()
        run: |
          .github/scripts/assert-stub-still-blocked.sh Licence "$RUNNER_TEMP/licence.log" \
            artifacts/images.json 'artifacts/charts/*.tgz'

      - name: Upload the licence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licence-report
          path: artifacts/licence/
          if-no-files-found: error
          retention-days: 400

  # ── docs/plan/23 § CI shape, row `weekly.yml`, the "dependency review" column ────────────────────
  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dotnet

      - name: NuGetAudit over the full closure
        run: .github/scripts/audit-packages.sh

      # Not a gate — an inventory. docs/plan/23 does not put a freshness bar on dependencies and
      # this workflow is not the place to invent one; what it is good for is noticing that a package
      # has gone three majors behind while nobody was looking.
      - name: Outdated packages, for the record
        run: |
          dotnet list CyberCloud.slnx package --outdated 2>&1 | tee "$RUNNER_TEMP/outdated.log" || true
          {
            echo "### Outdated packages"
            echo
            echo '```'
            grep -E '^\s+> ' "$RUNNER_TEMP/outdated.log" | sort -u || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── docs/plan/23 § CI shape, row `weekly.yml`, the "restore drill" column ────────────────────────
  #
  # ⚠ BLOCKED, AND NOT ON A SECRET — AND SINCE #25 A WARNING ON A GREEN JOB, NOT A RED ONE.
  #
  # Written out rather than omitted, because "a restore drill" is one of the four things that row
  # promises and a weekly workflow with three of them is a workflow that quietly redefined the row.
  # It used to `exit 1`, on the argument that reporting the drill green would be the most expensive
  # possible way to find out the backups do not restore. That argument is right about a GREEN TICK
  # OVER A DRILL THAT RAN NOTHING and wrong about what a permanent red buys: a year of Sundays red on
  # this job made the whole workflow red, and a red `dependencies` job — a real High advisory in the
  # closure — sat inside it for four days looking exactly like every other Sunday.
  #
  # So the job is green and the run page carries a `::warning` annotation naming the three blockers
  # every week, which is what a reader of a green weekly run sees first. The drill has not moved: it
  # is still three pieces of work, still listed in docs/plan/23 § CI secrets under "Blocked on work,
  # not on a secret", and the day one of them lands this comment is the first thing to rewrite.
  restore-drill:
    name: restore-drill
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "blocked: no backup, no restore procedure, no scratch environment — docs/plan/23 § CI secrets"
        run: |
          echo "::warning title=restore-drill::restore-drill is BLOCKED on 3 input(s), none of them a secret — nothing in the repository takes a backup, no restore procedure is written, and there is no scratch environment to restore into. docs/plan/23 § CI secrets, 'Blocked on work, not on a secret'."
          cat <<'BLOCKED'

            ✘ nothing in the repository takes a backup.
              To unblock: decide where the durable tier's backups live and how they are taken.
              docs/plan/05 § The two tiers describes the tiers; nothing describes their backup.

            ✘ there is no documented restore procedure to drill.
              To unblock: write it. deploy/README.md § Idempotence has the closest thing — the
              recovery SQL that drops and reapplies the Orleans schema — and that is schema repair,
              not data restore. A drill of a procedure nobody wrote is a drill of nothing.

            ✘ there is no scratch environment to restore INTO.
              To unblock: a throwaway shard per drill. docs/plan/23 § Environments and rollout has
              dev, staging and prod, and restoring over any of the three is not a drill.

          ⚠ The point of a restore drill is finding out that the backups do not restore. This job
          drilled nothing; the tick above it is the workflow's, not the drill's.
          BLOCKED
          {
            echo "### ○ restore-drill — blocked on work, not on a secret"
            echo
            echo "No backup mechanism, no written restore procedure, no scratch environment. Nothing was drilled."
          } >> "$GITHUB_STEP_SUMMARY"
