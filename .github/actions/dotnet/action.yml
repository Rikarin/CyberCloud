# The .NET half of every job's setup, in one place so the five workflows cannot drift on which SDK
# they build with — docs/plan/23 § Build: "`./build.sh <Target>` locally and in CI, so 'works on my
# machine' and 'works in CI' are the same code path". Two copies of the SDK selection is how that
# sentence stops being true.

name: Set up .NET
description: Restore the SDK from global.json, warm the NuGet cache, and prove the toolchain resolves.

runs:
  using: composite
  steps:
    # global-json-file rather than a literal version. global.json pins 10.0.300 with
    # rollForward: latestFeature, and repeating "10.0.x" here would be a second pin that nobody
    # updates when the first one moves.
    - name: Install the SDK from global.json
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # Keyed on the two files that decide the restore graph. Central Package Management means every
    # version lives in Directory.Packages.props, so a change there is the only thing that can
    # invalidate the closure; global.json is in the key because an SDK bump changes the targeting
    # packs that come down with it.
    - name: Cache NuGet
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        # One path: local tools are NuGet packages too, so `dotnet tool restore` in build.sh warms
        # the same directory the solution's restore does.
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', 'global.json', '.config/dotnet-tools.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-${{ runner.arch }}-

    # ⚠ Not a formality. `dotnet --version` run from the repository root fails outright when the
    # SDK on PATH cannot satisfy global.json, and it fails here — in a step named for the
    # toolchain — rather than forty lines into a restore, where the message is about a package.
    #
    # ⚠ AND WHAT IT ASSERTS IS NOW THE ROSLYN FLOOR, WHICH IS WHAT ISSUE #80 WAS ABOUT.
    # CyberCloud.Analyzers is built against Microsoft.CodeAnalysis.CSharp 5.6.0
    # (Directory.Packages.props § Roslyn), a compiler refuses to load an analyzer built against a
    # newer Roslyn than itself, and 10.0.3xx is the lowest band on which Roslyn 5.6 is attested —
    # Directory.Packages.props § Roslyn has the measurements. While global.json read
    # `10.0.100` that floor was unwritten anywhere the toolchain reads: a runner image already
    # carrying a 10.0.1xx SDK satisfies `10.0.100`, so the step above finds a match, installs
    # nothing, and this step happily echoes an SDK that cannot build the tree. The failure then
    # arrives forty lines into the compile as `CSC : error CS9057: Analyzer assembly … references
    # version '5.6.0.0' of the compiler, which is newer than the currently running version
    # '5.0.0.0'`, naming neither global.json nor the SDK. With the floor at `10.0.300` the same image
    # no longer matches: the step above has to fetch a 10.0.3xx-or-later SDK or fail trying, and if
    # PATH still resolves below the floor for any other reason this step fails with the resolver's
    # own message — "Requested SDK version: 10.0.300 … global.json file: …".
    #
    # ⚠ There is deliberately no second literal version in this file to compare against. That would
    # be a third copy of the floor (global.json, Directory.Packages.props § Roslyn, here) and the one
    # nobody updates; the resolver comparing what is on PATH against global.json is the same check
    # without a copy. Verified on 2026-09-05 locally rather than reasoned about: `dotnet --version`
    # in a directory whose global.json names an uninstalled band exits 155 and prints both the
    # requested version and the global.json path.
    - name: Prove the SDK satisfies global.json
      shell: bash
      run: |
        set -euo pipefail
        echo "SDK: $(dotnet --version)"
        echo "runner: ${{ runner.os }}/${{ runner.arch }}"
